<meta name="theme-color" content="#0c2734">

<link rel="preconnect" href="https://fonts.googleapis.com">

<div id="wrap"><canvas id="game" tabindex="0" aria-label="Keys Crew, a Florida Keys lobstering and fishing game"></canvas></div>
<script>
/* ---- js/core.js ---- */
'use strict';
/* Keys Crew — core: math helpers, canvas + loop, input, immediate-mode buttons,
   synthesized audio, local storage, particles. Everything is drawn on one canvas
   in a logical space that is always 540 units tall and 720–1280 units wide. */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const approach = (v, target, rate, dt) => v + (target - v) * (1 - Math.exp(-rate * dt));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; t = clamp(t, 0, 1); return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function mulberry(seed) {

    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtLb(w) { return (w >= 100 ? Math.round(w) : w.toFixed(1)) + ' lb'; }
function longDate(d = new Date()) { return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }

const FONT_D = '"Shrikhand", Georgia, "Times New Roman", serif';
const FONT_UI = '"Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
const fnt = (size, weight = 700) => `${weight} ${size}px ${FONT_UI}`;
const dfnt = (size) => `400 ${size}px ${FONT_D}`;

// Sun-bleached Keys palette: gelcoat white, deep Gulf Stream navy, lobster orange, sun yellow.
const PAL = {
  ink: '#0c2734', inkSoft: '#355564', panel: 'rgba(7,36,51,0.9)', panelLine: 'rgba(255,255,255,0.16)',
  foam: '#f7f3e8', sand: '#efdcae', coral: '#ff6a3d', sun: '#ffc845', sunDeep: '#c98b12',
  sea: '#0e7fa1', deep: '#08405e', shallow: '#62d0cf', good: '#3ccf7c', warn: '#ffad1f', bad: '#ff4f4f', mute: '#9fb8c2'
};

function text(ctx, s, x, y, o = {}) {

  setFont();

  ctx.textBaseline = o.base || 'alphabetic';

function wrapText(ctx, s, maxW) {

}

/* ---------- storage (per-browser conveniences only) ---------- */
const Store = {
  get(k, d) { try { const v = window.localStorage.getItem('keyscrew_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { window.localStorage.setItem('keyscrew_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { window.localStorage.removeItem('keyscrew_' + k); } catch (e) { /* storage unavailable */ } }
};

/* ---------- audio: everything is synthesized, nothing to download ---------- */
const SFX = {
  ac: null, master: null, muted: false, nb: null, drag: null, amb: null,
  init() { this.muted = !!Store.get('muted', false); },
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const ac = this.ac = new AC();
      this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.55; this.master.connect(ac.destination);
      const len = ac.sampleRate * 2; const buf = ac.createBuffer(1, len, ac.sampleRate); const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nb = buf;
      // reel drag scream: band-passed noise chopped by a square LFO
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 1.4;
      const am = ac.createGain(); am.gain.value = 0.5;
      const lfo = ac.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 40;
      const lfoG = ac.createGain(); lfoG.gain.value = 0.5; lfo.connect(lfoG); lfoG.connect(am.gain);
      const g = ac.createGain(); g.gain.value = 0;
      src.connect(bp); bp.connect(am); am.connect(g); g.connect(this.master); src.start(); lfo.start();
      this.drag = { g, lfo, bp };
      // ambient wash of the sea
      const s2 = ac.createBufferSource(); s2.buffer = buf; s2.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
      const g2 = ac.createGain(); g2.gain.value = 0;
      s2.connect(lp); lp.connect(g2); g2.connect(this.master); s2.start();
      this.amb = { g: g2, lp };
      // outboard engine drone for the boat run
      const e1 = ac.createOscillator(); e1.type = 'sawtooth'; e1.frequency.value = 42;
      const e2 = ac.createOscillator(); e2.type = 'sawtooth'; e2.frequency.value = 42.7;
      const elp = ac.createBiquadFilter(); elp.type = 'lowpass'; elp.frequency.value = 500;
      const eg = ac.createGain(); eg.gain.value = 0;
      e1.connect(elp); e2.connect(elp); elp.connect(eg); eg.connect(this.master); e1.start(); e2.start();
      this.engine = { e1, e2, lp: elp, g: eg };
    } catch (e) { this.ac = null; }
    if (this.ac) { try { Music.attach(); } catch (e) { console.warn('music unavailable', e); } }
  },
  setMuted(m) { this.muted = m; Store.set('muted', m); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ac.currentTime, 0.05); },
  setDrag(level, pitch = 1) {
    if (!this.drag) return; const t = this.ac.currentTime;
    this.drag.g.gain.setTargetAtTime(clamp(level, 0, 1) * 0.2, t, 0.04);
    this.drag.lfo.frequency.setTargetAtTime(26 + 34 * pitch, t, 0.05);
    this.drag.bp.frequency.setTargetAtTime(2000 + 1400 * pitch, t, 0.05);
  },
  setEngine(level, rpm = 0) {
    if (!this.engine) return; const t = this.ac.currentTime, e = this.engine, f = 38 + 74 * clamp(rpm, 0, 1);
    e.g.gain.setTargetAtTime(level ? 0.035 + 0.05 * rpm : 0, t, 0.12);
    e.e1.frequency.setTargetAtTime(f, t, 0.25); e.e2.frequency.setTargetAtTime(f * 1.017, t, 0.25); e.lp.frequency.setTargetAtTime(380 + 1500 * rpm, t, 0.25);
  },
  setAmbient(level, under) {
    if (!this.amb) return; const t = this.ac.currentTime;
    this.amb.g.gain.setTargetAtTime(level * 0.06, t, 0.4);
    this.amb.lp.frequency.setTargetAtTime(under ? 240 : 650, t, 0.4);
  },
  tone(f, dur, o = {}) {
    const ac = this.ac; if (!ac || this.muted) return;
    const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = ac.createGain(); const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(dur, o = {}) {
    const ac = this.ac; if (!ac || this.muted || !this.nb) return;
    const t = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = this.nb;
    const f = ac.createBiquadFilter(); f.type = o.filter || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
  },
  steel(f, delay, vol = 0.16) { // steel-pan-ish bell
    this.tone(f, 0.55, { delay, vol, type: 'sine' });
    this.tone(f * 2.01, 0.3, { delay, vol: vol * 0.35, type: 'sine' });
    this.tone(f * 3.9, 0.12, { delay, vol: vol * 0.12, type: 'triangle' });
  },
  play(name) {
    if (!this.ac || this.muted) return;
    switch (name) {
      case 'click': this.tone(700, 0.06, { type: 'triangle', vol: 0.12 }); break;
      case 'splash': this.noise(0.4, { f: 1600, to: 300, vol: 0.32 }); break;
      case 'bigsplash': this.noise(0.8, { f: 1400, to: 200, vol: 0.5 }); this.tone(90, 0.3, { vol: 0.2, to: 50 }); break;
      case 'plop': this.tone(320, 0.09, { to: 110, vol: 0.22 }); this.noise(0.12, { f: 900, vol: 0.08 }); break;
      case 'nibble': this.tone(420, 0.04, { type: 'square', vol: 0.05 }); this.tone(380, 0.04, { type: 'square', vol: 0.05, delay: 0.08 }); break;
      case 'bite': this.tone(150, 0.16, { vol: 0.4, to: 60 }); this.noise(0.1, { f: 400, vol: 0.2 }); break;
      case 'hookset': this.noise(0.14, { filter: 'highpass', f: 1800, vol: 0.25 }); this.tone(220, 0.12, { to: 520, type: 'sawtooth', vol: 0.1 }); break;
      case 'snap': this.noise(0.09, { filter: 'highpass', f: 3000, vol: 0.5 }); this.tone(1300, 0.16, { to: 180, type: 'square', vol: 0.1 }); break;
      case 'catch': Music.duck(1.4); [523, 659, 784, 1046].forEach((f, i) => this.steel(f, i * 0.09)); break;
      case 'trophy': Music.duck(1.8); [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.steel(f, i * 0.1, 0.18)); break;
      case 'coin': this.tone(988, 0.08, { type: 'square', vol: 0.05 }); this.tone(1319, 0.14, { type: 'square', vol: 0.05, delay: 0.07 }); break;
      case 'bubble': this.tone(rand(500, 900), 0.09, { to: 1500, vol: 0.06 }); break;
      case 'warn': this.tone(880, 0.12, { type: 'square', vol: 0.06 }); break;
      case 'sting': this.noise(0.2, { filter: 'highpass', f: 2500, vol: 0.2 }); this.tone(1500, 0.2, { to: 600, type: 'sawtooth', vol: 0.08 }); break;
      case 'chomp': this.tone(110, 0.16, { type: 'sawtooth', vol: 0.18, to: 60 }); this.noise(0.12, { f: 700, vol: 0.25 }); break;
      case 'tickle': this.tone(1700 + Math.random() * 500, 0.03, { type: 'triangle', vol: 0.035 }); break;
      case 'net': this.noise(0.28, { filter: 'bandpass', f: 700, to: 2200, vol: 0.22 }); break;
      case 'swish': this.noise(0.22, { filter: 'bandpass', f: 500, to: 1600, vol: 0.16, q: 2 }); break;
      case 'fail': this.tone(392, 0.18, { type: 'triangle', vol: 0.12 }); this.tone(330, 0.18, { type: 'triangle', vol: 0.12, delay: 0.16 }); this.tone(247, 0.35, { type: 'triangle', vol: 0.12, delay: 0.32 }); break;
      case 'cast': this.noise(0.32, { filter: 'bandpass', f: 3200, to: 700, vol: 0.14 }); break;
      case 'strip': this.noise(0.05, { filter: 'highpass', f: 2500, vol: 0.05 }); break;
      case 'horn': this.tone(196, 0.5, { type: 'sawtooth', vol: 0.07 }); this.tone(247, 0.5, { type: 'sawtooth', vol: 0.05 }); break;
      case 'tick': this.tone(2300, 0.02, { type: 'square', vol: 0.03 }); break;
      case 'siren': for (let i = 0; i < 4; i++) { this.tone(720, 0.28, { type: 'square', vol: 0.05, delay: i * 0.6 }); this.tone(980, 0.28, { type: 'square', vol: 0.05, delay: i * 0.6 + 0.3 }); } break;
      case 'woo': this.tone(520, 0.35, { type: 'triangle', vol: 0.08, to: 900 }); this.noise(0.3, { filter: 'bandpass', f: 1200, vol: 0.12 }); break;
      case 'slam': Music.duck(2); [392, 523, 659, 784, 1046, 1318, 1568].forEach((f, i) => this.steel(f, i * 0.08, 0.2)); break;
    }
  }
};

/* ---------- music: a small step sequencer playing synthesized island tunes ---------- */
const NOTE_CACHE = {};
function nf(name) { // 'C4', 'F#3', 'Bb2' -> Hz
  if (NOTE_CACHE[name]) return NOTE_CACHE[name];
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  const semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return (NOTE_CACHE[name] = 440 * Math.pow(2, (12 * (+m[3] + 1) + semi - 69) / 12));
}
const Music = {
  on: true, want: null, cur: null, song: null, i: 0, next: 0, bus: null, lp: null, duckG: null, timer: null, intensity: 0,
  init() { this.on = Store.get('music', true) !== false; },
  attach() {
    const ac = SFX.ac;
    this.bus = ac.createGain(); this.bus.gain.value = 0.0001;
    this.lp = ac.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 16000;
    this.duckG = ac.createGain(); this.duckG.gain.value = 1;
    this.bus.connect(this.lp); this.lp.connect(this.duckG); this.duckG.connect(SFX.master);
    this.timer = setInterval(() => this.tick(), 40);
    document.addEventListener('visibilitychange', () => { if (!SFX.ac) return; if (document.hidden) SFX.ac.suspend().catch(() => {}); else SFX.ac.resume().catch(() => {}); });
    if (this.want) { const w = this.want; this.cur = null; this.play(w); }
  },
  play(name) {
    this.want = name;
    if (!this.bus || this.cur === name || !SONGS[name]) return;
    const t = SFX.ac.currentTime, g = this.bus.gain;
    this.cur = name; this.song = SONGS[name]; this.i = 0; this.next = t + 0.32; this.intensity = 0;
    g.cancelScheduledValues(t); g.setValueAtTime(Math.max(0.0001, g.value), t); g.linearRampToValueAtTime(0.0001, t + 0.28);
    g.linearRampToValueAtTime(this.on ? this.song.vol : 0.0001, t + 1.1);
    this.lp.frequency.setTargetAtTime(this.song.lp || 16000, t, 0.25);
  },
  setOn(v) {
    this.on = v; Store.set('music', v);
    if (this.bus && this.song) this.bus.gain.setTargetAtTime(v ? this.song.vol : 0.0001, SFX.ac.currentTime, 0.15);
  },
  muffle(on) { if (!this.lp || !this.song) return; this.lp.frequency.setTargetAtTime(on ? 820 : this.song.lp || 16000, SFX.ac.currentTime, 0.12); },
  duck(d = 1.5) {

  },
  tick() {
    const ac = SFX.ac; if (!this.song || !ac || ac.state !== 'running') return;
    const now = ac.currentTime; if (this.next < now - 0.2) this.next = now + 0.05;
    while (this.next < now + 0.3) {

  },
  // instruments
  osc(t, f, dur, o = {}) {
    const ac = SFX.ac, osc = ac.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur); if (o.detune) osc.detune.value = o.detune;
    const g = ac.createGain(); const v = o.vol || 0.1;

    if (o.lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; g.connect(fl); fl.connect(this.bus); } else g.connect(this.bus);

  },
  nz(t, dur, o = {}) {

    const fl = ac.createBiquadFilter(); fl.type = o.filter || 'highpass'; fl.frequency.value = o.f || 7000; fl.Q.value = o.q || 0.8;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.03, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  steel(t, f, v, len = 0.5) { this.osc(t, f, len, { vol: v }); this.osc(t, f * 2.01, len * 0.55, { vol: v * 0.33 }); this.osc(t, f * 3.9, 0.1, { vol: v * 0.1, type: 'triangle' }); },
  bass(t, f, v, len = 0.3) { this.osc(t, f, len, { type: 'triangle', vol: v }); this.osc(t, f, len * 0.8, { vol: v * 0.6 }); },
  pad(t, f, v, len) { this.osc(t, f, len, { type: 'triangle', vol: v, att: len * 0.35 }); this.osc(t, f, len, { vol: v * 0.8, att: len * 0.4, detune: 8 }); },
  pluck(t, f, v) { this.osc(t, f, 0.35, { vol: v }); this.osc(t, f * 4, 0.06, { vol: v * 0.25 }); },

  draw(dt) {

    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.fillStyle = '#041d29'; ctx.fillRect(0, 0, this.cw, this.ch);
    let sx = 0, sy = 0;
    if (this.shakeT > 0) { this.shakeT -= dt; const a = this.shakeAmt * (this.reduced ? 0.15 : 1) * Math.min(1, this.shakeT * 4); sx = rand(-a, a); sy = rand(-a, a); }
    ctx.setTransform(k * this.scale, 0, 0, k * this.scale, k * (this.ox + sx * this.scale), k * (this.oy + sy * this.scale));
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, this.W, this.H); ctx.clip();
    UI.beginFrame();
    if (this.scene && this.scene.draw) this.scene.draw(ctx);
    this.drawToasts(ctx);
    if (this.error) {
      ctx.fillStyle = 'rgba(120,0,0,0.85)'; ctx.fillRect(0, this.H - 34, this.W, 34);
      text(ctx, 'Something broke: ' + String(this.error.message || this.error).slice(0, 120), 12, this.H - 12, { size: 15, color: '#fff' });
    }
    if (this.fade > 0) { ctx.fillStyle = `rgba(3,22,32,${this.fade})`; ctx.fillRect(0, 0, this.W, this.H); }
    ctx.restore();
    if (this.portrait && this.touch && this.oy > 40) {
      ctx.setTransform(k, 0, 0, k, 0, 0);
      ctx.font = fnt(16, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText('Turn your phone sideways for the full view', this.cw / 2, this.oy / 2);
    }
  },
  drawToasts(ctx) {
    const sc = this.scene; if (sc && (sc.paused || (sc.panel && sc.panel.kind !== 'chart'))) return;   // never on top of a pause menu
    const placed = [];
    for (const t of this.toasts) {
      const a = t.t < 0.18 ? easeBack(t.t / 0.18) : 1; const fadeOut = clamp((t.dur - t.t) / 0.3, 0, 1);
      const h = t.size + (t.sub ? 34 : 12);
      let y = t.y || 150;
      for (let guard = 0; guard < 6; guard++) { const hit = placed.find((p) => Math.abs(p.y - y) < (p.h + h) / 2); if (!hit) break; y = hit.y + (hit.h + h) / 2 + 4; }
      placed.push({ y, h });
      ctx.save(); ctx.translate(this.W / 2, y); ctx.scale(a, a); ctx.globalAlpha = fadeOut;
      text(ctx, t.msg, 0, 0, { size: t.size, display: true, align: 'center', base: 'middle', color: t.color, stroke: 'rgba(4,28,40,0.9)', sw: 8, maxW: this.W - 60 });
      if (t.sub) text(ctx, t.sub, 0, t.size * 0.85, { size: 18, align: 'center', base: 'middle', color: '#fff', stroke: 'rgba(4,28,40,0.9)', sw: 5, weight: 700, maxW: this.W - 60 });
      ctx.restore();
    }
  }
};

function rollWeight(key, perks) {
  const sp = SPECIES[key]; const k = 2.3 / ((perks && perks.trophy) || 1);
  const r = Math.pow(Math.random(), k);
  return Math.round((sp.min + (sp.max - sp.min) * r) * 10) / 10;
}
function sizeNorm(key, w) { const sp = SPECIES[key]; return clamp((w - sp.min) / (sp.max - sp.min), 0, 1); }

// Build a scored catch record. extras: [{label, pts}]
function makeCatch(key, weight, ch, spot, extras = []) {
  const sp = SPECIES[key];
  const lines = [{ label: fmtLb(weight) + ' × ' + sp.mult, pts: Math.round(weight * sp.mult) }];
  const trophy = sizeNorm(key, weight) >= 0.72;
  if (trophy) lines.push({ label: 'Trophy', pts: Math.round(weight * sp.mult * 0.2) });
  if (sp.release && sp.relBonus) lines.push({ label: 'Clean release', pts: sp.relBonus });
  for (const e of extras) lines.push(e);
  const pts = lines.reduce((a, l) => a + l.pts, 0);
  return { key, name: sp.name, weight, ch, spot, trophy, released: !!sp.release, lines, pts, at: Date.now() };
}

/* ---------- trip state (saved after every turn so a phone nap doesn't wipe the day) ---------- */
const Trip = {
  cur: null,
  start(o) {
    const scores = {}; o.crew.forEach((c) => (scores[c] = 0));
    this.cur = {
      id: Date.now(), mode: o.mode, crew: o.crew.slice(), plan: o.plan,
      spotsNeeded: o.plan === 'full' ? 4 : o.plan === 'half' ? 2 : 0,
      sessionLen: o.sessionLen, weather: rollWeather(), date: new Date().toISOString(),
      done: [], spot: null, turn: 0, scores, catches: [], turns: [], legs: 0, boat: null, found: []
    };
    this.save();
  },
  save() { if (this.cur && this.cur.mode === 'crew') Store.set('trip', this.cur); },
  load() { const t = Store.get('trip', null); return t && t.crew && t.scores ? t : null; },
  resume() { this.cur = this.load(); return !!this.cur; },
  clear() { Store.del('trip'); },
  get player() { return this.cur.crew[this.cur.turn]; },
  record(ch, spot, res) {
    const c = this.cur; c.scores[ch] = (c.scores[ch] || 0) + res.total;
    for (const k of res.catches) c.catches.push(k);
    c.turns.push({ ch, spot, total: res.total, n: res.catches.length });
    Records.add(res.catches);
    this.save();
  },
  leader() {
    const c = this.cur; let best = null;
    for (const ch of c.crew) if (!best || c.scores[ch] > c.scores[best]) best = ch;
    return best;
  }
};

const Records = {
  all() { return Store.get('records', {}); },
  add(catches) {
    const rec = this.all(); let changed = false;
    for (const k of catches) {
      if (!k || !k.weight || k.fine) continue;
      const r = rec[k.key];
      if (!r || k.weight > r.w) { rec[k.key] = { w: k.weight, ch: k.ch, date: new Date().toISOString() }; changed = true; k.pb = true; }
    }
    if (changed) Store.set('records', rec);
  },
  isRecord(key, w) { const r = this.all()[key]; return !r || w > r.w; },
  trips() { return Store.get('trips', []); },
  addTrip(t) { const list = this.trips(); list.unshift(t); Store.set('trips', list.slice(0, 12)); }
};

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const x = hexRgb(a), y = hexRgb(b); return `rgb(${Math.round(lerp(x[0], y[0], t))},${Math.round(lerp(x[1], y[1], t))},${Math.round(lerp(x[2], y[2], t))})`; }
function rgba(h, a) { const x = hexRgb(h); return `rgba(${x[0]},${x[1]},${x[2]},${a})`; }

const LOSS_TEXT = {
  snap: ['SNAP!', 'Too much pressure while it was running. Let go on the runs.'],
  slack: ['Spit the hook', 'Too much slack. Keep reeling between runs.'],
  jump: ['Threw the hook!', 'Let go when it jumps. Bow to the fish.'],
  rock: ['Rocked up!', 'It made the reef and cut you off. Tap faster to turn it.'],
  mangrove: ['In the mangroves!', 'It wrapped you in the roots. Tap faster to turn it.'],
  piling: ['Cut off on the pilings!', 'It wrapped you around the bridge. Tap faster to turn it.'],
  wreck: ['Cut off in the wreck!', 'It dove into the wreckage. Tap faster to turn it.'],
  tax: ['Taxed!', 'A shark ate your fish. Only the head came back.'],
  spool: ['Spooled!', 'It took every inch of line.']

class FightScene {
  constructor(o) {
    this.o = o; this.key = o.sp; this.sp = SPECIES[o.sp]; this.ch = o.ch; this.C = CHARS[o.ch]; this.perks = this.C.perks;
    this.weight = o.weight; this.wn = sizeNorm(o.sp, o.weight);

    this.variant = (SPOTS[o.spot] && SPOTS[o.spot].variant) || null;

    this.d0 = this.kind === 'reef' ? (o.depth || 90) : this.kind === 'flats' ? rand(35, 50) + 25 * this.wn : rand(50, 70) + 30 * this.wn;
    this.dist = this.d0; this.maxDist = this.d0 + 130; this.unit = this.kind === 'reef' ? 'ft' : 'yds';
    this.S = 1; this.T = 0.45; this.t = 0; this.fightT = 0;
    const rock = o.rock != null ? o.rock : (this.kind === 'reef' ? (this.sp.rock || 0) : 0);
    this.rockStr = rock; this.phase = rock > 0 ? 'turn' : 'fight'; this.rockBar = 0.45; this.turnGrace = 0.7;
    this.running = false; this.runT = 0; this.runStr = 1; this.restT = rand(0.9, 1.6); this.tele = false;
    this.jumpT = 0; this.jumpDelay = 0; this.jumpHold = 0; this.jumps = 0; this.bows = 0; this.jumpX = 0;
    this.slackT = 0; this.snapT = 0; this.revealed = false;

  }
  enter() {
    Game.toasts = []; Music.play('fight');
    SFX.play('hookset'); Game.vibrate(60);
    Game.toast('FISH ON!', { color: PAL.sun, size: 48, dur: 1.3, y: 120 });
    if (this.phase === 'turn') Game.toast({ mangrove: 'Heading for the roots!', piling: 'Heading for the pilings!', wreck: 'Diving for the wreck!', rock: 'Diving for the reef!' }[this.cover], { size: 26, color: '#fff', dur: 1.6, y: 175 });
  }
  exit() { SFX.setDrag(0); }
  holding() { return Input.held('Space', 'ArrowDown', 'KeyS', 'Enter') || !!Input.anyGameplayPointer(); }
  pointerDown() { this.tap(); }
  keyDown(c) { if (['Space', 'ArrowDown', 'KeyS', 'Enter'].includes(c)) this.tap(); }
  tap() {

    else if (this.phase === 'over' && this.overT > 0.9) this.finish();
  }

  update(dt) {
    this.t += dt; this.parts.update(dt); this.fl.update(dt); this.crankFx = Math.max(0, this.crankFx - dt);
    if (this.o.tick) this.o.tick(dt);

      SFX.setDrag(0.5, 0.7);
      if (this.rockBar >= 1) { this.phase = 'fight'; this.T = 0.5; this.restT = 1.2; Game.toast({ mangrove: 'Out of the roots!', piling: 'Off the pilings!', wreck: 'Out of the wreck!', rock: 'Off the bottom!' }[this.cover], { color: PAL.good, size: 32, y: 130 }); SFX.play('coin'); }
      else if (this.rockBar <= 0) return this.lose(this.cover);

    const inZone = this.T > 0.38 && this.T < 0.86 * Lmax;
    this.S = clamp(this.S - (dt / this.staminaSec) * (inZone ? 1 : 0.35) * (hold ? 1 : 0.6) + (this.T < 0.15 ? dt * 0.015 : 0), 0, 1);
    if (this.T < 0.12) { this.slackT += dt; if (this.slackT > 2.1) return this.lose('slack'); } else if (this.T > 0.2) this.slackT = Math.max(0, this.slackT - dt * 2);
    if (this.T > Lmax) { this.snapT += dt; if (this.snapT > 0.28) return this.lose('snap'); } else this.snapT = Math.max(0, this.snapT - dt);
    if (this.T > 0.86 * Lmax && Math.floor(this.t * 6) !== Math.floor((this.t - dt) * 6)) Game.vibrate(15);
    if (this.dist > this.maxDist) return this.lose('spool');
    if (this.jumpT > 0) { this.jumpT -= dt; if (hold) this.jumpHold += dt; if (this.jumpT <= 0) { this.endJump(); if (this.phase === 'over') return; } }
    if (!this.revealed && (this.dist < this.d0 * 0.45 || this.jumpT > 0)) { this.revealed = true; Game.toast(`It's a ${sp.short.toLowerCase()}!`, { color: '#fff', size: 30, y: 120 }); }
    if (this.taxRisk && !this.shark && this.fightT > 16) { this.shark = { t: 10, a: 0 }; Game.toast('SHARK!', { color: '#dfe6ea', size: 42, y: 130, sub: 'Get it in before the tax man does' }); SFX.play('warn'); }
    if (this.shark) { this.shark.t -= dt; this.shark.a += dt; if (this.shark.t <= 0) return this.lose('tax'); }
    SFX.setDrag(this.running ? (hold ? 0.9 : 0.7) : hold ? 0.12 : 0, this.running ? 1 : 0.4);
    this.fightAnim(dt, hold);
    if (this.dist <= 0.5) this.land();
  }
  startJump() {
    this.jumpT = 1.15; this.jumpHold = 0; this.jumps++;
    SFX.play('bigsplash'); Game.vibrate(40);
    this.parts.burst(this.fx, this.waterY(), 22, { color: ['#ffffff', '#cfefff'], angle: -Math.PI / 2, spread: 1.0, min: 120, max: 320, g: 600, sMin: 2, sMax: 5 });
  }
  endJump() {
    this.parts.burst(this.fx, this.waterY(), 26, { color: ['#ffffff', '#cfefff'], angle: -Math.PI / 2, spread: 1.1, min: 100, max: 300, g: 600 });
    SFX.play('splash');
    if (this.jumpHold > 0.3 && chance(0.7)) { this.lose('jump'); return; }
    if (this.jumpHold <= 0.3) { this.bows++; this.fl.add(this.fx, this.waterY() - 60, 'Bowed! +40', PAL.sun, 24); SFX.play('coin'); }
  }
  land() {
    this.phase = 'landing'; this.landT = 0; this.running = false; SFX.setDrag(0); SFX.play('bigsplash');
    this.parts.burst(this.fx, this.waterY(), 30, { color: ['#ffffff', '#bfe9ff'], angle: -Math.PI / 2, spread: 1.2, min: 80, max: 260, g: 600 });
  }
  toOver() {
    const extras = [];
    if (this.bows) extras.push({ label: 'Bowed to the jump × ' + this.bows, pts: this.bows * 40 });
    if (this.shark) extras.push({ label: 'Beat the shark', pts: 75 });
    this.catch = makeCatch(this.key, this.weight, this.ch, this.o.spot, extras);
    this.isPB = Records.isRecord(this.key, this.weight);
    this.won = true; this.phase = 'over'; this.overT = 0;
    SFX.play(this.catch.trophy ? 'trophy' : 'catch'); Game.vibrate([30, 40, 30]);
    this.confetti = new Particles();
    this.confetti.burst(Game.W / 2, 200, 60, { kind: 'confetti', color: [PAL.sun, PAL.coral, '#42d3c4', '#ffffff'], min: 120, max: 420, g: 420, lifeMin: 1.4, lifeMax: 2.4, sMin: 3, sMax: 6, drag: 0.6 });
  }
  lose(reason) {
    this.reason = reason; this.won = false; this.phase = 'over'; this.overT = 0; SFX.setDrag(0);
    SFX.play(reason === 'snap' ? 'snap' : 'fail'); if (reason === 'tax') SFX.play('chomp');
    Game.shake(reason === 'snap' ? 8 : 4, 0.35); Game.vibrate(120);
  }

  /* ----- layout + animation ----- */
  waterY() { return this.kind === 'reef' ? 236 : this.kind === 'flats' ? 300 : 270; }
  anglerX() { return this.kind === 'flats' ? 150 : 200; }
  fightAnim(dt) {
    const W = Game.W, wy = this.waterY();
    const x0 = this.anglerX() + 170, x1 = W - 130;
    let fx, fy;
    const frac = clamp(this.dist / (this.d0 * 1.35), 0, 1);
    if (this.kind === 'reef') {
      fx = lerp(x0 + 40, x1 - 120, 0.45) + Math.sin(this.t * 0.9) * 50 * (this.running ? 1.4 : 0.6);
      fy = wy + 30 + (this.dist / this.maxDist) * (Game.H - wy - 40) * 1.25;
      fy = Math.min(fy, Game.H - 40);
      if (this.phase === 'turn') fy = Game.H - 60 - this.rockBar * 120;
    } else {
      fx = lerp(x0, x1, frac) + Math.sin(this.t * 1.7) * 18;
      fy = wy + (this.kind === 'flats' ? 22 : 45) + Math.sin(this.t * 2.3) * 10;
      if (this.phase === 'turn') { fx = lerp(x0, x1, frac) + 20; fy = wy + 26; }
    }
    if (this.jumpT > 0) { const ph = 1 - this.jumpT / 1.15; fy = wy - Math.sin(ph * Math.PI) * (90 + 60 * this.wn); fx += (ph - 0.5) * 60; this.fang = (ph - 0.5) * 2.2; }
    else this.fang = this.running ? -0.15 : 0.1;
    if (this.phase === 'landing') { const k = easeOut(this.landT / 0.9); fx = lerp(this.fx, this.anglerX() + 90, k); fy = lerp(this.fy, wy - 80, k); }
    this.fx = this.fx ? approach(this.fx, fx, 10, dt || 0.016) : fx; this.fy = this.fy ? approach(this.fy, fy, 10, dt || 0.016) : fy;
    if (this.running && chance(0.3)) this.parts.add({ x: this.fx + rand(-10, 10), y: wy + 2, vy: -rand(20, 60), life: 0.5, size: rand(1.5, 3), color: 'rgba(255,255,255,0.8)', g: 200 });
  }

  draw(ctx) {
    const W = Game.W, H = Game.H, wy = this.waterY(), t = this.t;
    this.drawBackdrop(ctx, W, H, wy, t);
    const lean = 0.08 + this.T * 0.28;
    const hand = this.drawRig(ctx, W, H, wy, t, lean);
    this.drawFishBody(ctx, wy);
    this.parts.draw(ctx);
    this.drawLine(ctx, hand, wy);
    if (this.shark && this.phase !== 'over') {
      const a = this.shark.a; const sx = this.fx + Math.cos(a * 1.8) * 90, sy = Math.max(wy + 40, this.fy + 30 + Math.sin(a * 1.8) * 30);
      ctx.save(); ctx.translate(sx, sy); ctx.globalAlpha = 0.75; drawFish(ctx, 'wahoo', 150, { sil: '#20333c', t, flip: Math.sin(a * 1.8) > 0 }); ctx.restore();
    }
    this.fl.draw(ctx);
    this.drawHud(ctx, W, H);
    if (this.phase === 'over') this.drawOver(ctx, W, H);
  }
  drawBackdrop(ctx, W, H, wy, t) {
    if (this.kind === 'flats') {
      drawSky(ctx, W, wy, 'day');
      drawCloud(ctx, W * 0.25, 70, 0.9); drawCloud(ctx, W * 0.75, 110, 0.7);
      const g = ctx.createLinearGradient(0, wy, 0, H);
      if (this.variant === 'bridge') {
        // the bridge across the horizon, pilings in the current
        ctx.fillStyle = '#b9b4a8'; ctx.fillRect(0, wy - 64, W, 16); ctx.fillStyle = '#8d877a'; ctx.fillRect(0, wy - 48, W, 6);
        for (let x = 30; x < W + 40; x += 120) { ctx.fillStyle = '#9d978a'; ctx.fillRect(x, wy - 48, 14, 52); ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x - 6, wy + 2, 26, 3); }
        ctx.fillStyle = '#e84a3a'; rr(ctx, (t * 40) % (W + 80) - 40, wy - 76, 26, 12, 4); ctx.fill(); ctx.fillStyle = '#f4f4f4'; rr(ctx, W - (t * 55) % (W + 80), wy - 76, 26, 12, 4); ctx.fill();
        g.addColorStop(0, '#3d9c94'); g.addColorStop(0.6, '#2b7d7a'); g.addColorStop(1, '#1d5c5a');
      } else {
        ctx.fillStyle = '#1f4a2c'; for (let x = -20; x < W + 40; x += 34) { ell(ctx, x, wy - 10 - (x % 70 ? 6 : 14), 30, 18); ctx.fill(); }
        ctx.fillStyle = '#2b5f37'; for (let x = 0; x < W + 40; x += 46) { ell(ctx, x, wy - 4, 26, 10); ctx.fill(); }
        if (this.variant === 'glades') { g.addColorStop(0, '#6f7a52'); g.addColorStop(0.5, '#5e6a46'); g.addColorStop(1, '#8a7a52'); }
        else { g.addColorStop(0, '#6cc9c2'); g.addColorStop(0.5, '#8ad8c8'); g.addColorStop(1, '#d9cf9e'); }
      }
      ctx.fillStyle = g; ctx.fillRect(0, wy, W, H - wy);
      ctx.fillStyle = 'rgba(70,120,80,0.25)'; for (let i = 0; i < 9; i++) { ell(ctx, (i * 173) % W, wy + 120 + (i * 61) % 110, 70, 14); ctx.fill(); }
    } else {
      drawSky(ctx, W, wy, 'day');
      drawSun(ctx, W * 0.8, 70, 22);
      drawCloud(ctx, W * 0.2 + Math.sin(t * 0.05) * 20, 60, 0.9); drawCloud(ctx, W * 0.55, 110, 0.6, 0.8);
      const g = ctx.createLinearGradient(0, wy, 0, H);
      if (this.kind === 'reef') { g.addColorStop(0, '#1f8fb7'); g.addColorStop(0.6, '#0d5677'); g.addColorStop(1, '#073248'); }
      else { g.addColorStop(0, '#155ea8'); g.addColorStop(1, '#062a52'); }
      ctx.fillStyle = g; ctx.fillRect(0, wy, W, H - wy);
      if (this.kind === 'reef') {
        ctx.fillStyle = 'rgba(255,255,255,0.05)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(i * W / 5, wy); ctx.lineTo(i * W / 5 + 60, wy); ctx.lineTo(i * W / 5 - 80 + Math.sin(t + i) * 10, H); ctx.lineTo(i * W / 5 - 140, H); ctx.fill(); }
        ctx.fillStyle = '#3e3a30'; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 26 - Math.sin(x * 0.02) * 12 - (x > W * 0.45 && x < W * 0.8 && this.variant !== 'wreck' ? 40 : 0)); ctx.lineTo(W, H); ctx.fill();
        if (this.variant === 'wreck') {
          // the freighter's hull on the bottom
          ctx.fillStyle = '#2c2f30'; ctx.beginPath(); ctx.moveTo(W * 0.38, H - 30); ctx.lineTo(W * 0.42, H - 92); ctx.lineTo(W * 0.86, H - 100); ctx.lineTo(W * 0.92, H - 40); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#3a3e3f'; ctx.fillRect(W * 0.62, H - 140, 60, 44); ctx.strokeStyle = 'rgba(160,110,70,0.5)'; ctx.lineWidth = 3;
          for (let x = W * 0.45; x < W * 0.86; x += 26) { ctx.beginPath(); ctx.moveTo(x, H - 94); ctx.lineTo(x + 4, H - 36); ctx.stroke(); }
        }
      }
    }
    drawWaterline(ctx, W, wy, t, 'rgba(255,255,255,0.6)', 3);
  }
  drawRig(ctx, W, H, wy, t, lean) {
    const ax = this.anglerX();
    let hand;
    if (this.kind === 'flats') {
      hand = drawAnglerSide(ctx, this.ch, ax + 40, wy - 14, 20, { lean, t, crank: this.holding() });
      ctx.fillStyle = '#f4f5f2'; ctx.beginPath(); ctx.moveTo(-40, wy - 14); ctx.lineTo(ax + 120, wy - 12); ctx.quadraticCurveTo(ax + 140, wy - 12, ax + 150, wy - 20); ctx.lineTo(ax + 120, wy + 8); ctx.lineTo(-40, wy + 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2d6b8f'; ctx.fillRect(-40, wy - 2, ax + 165, 5);
    } else {
      hand = drawAnglerSide(ctx, this.ch, ax + 10, wy - 14, 22, { lean, t, crank: this.holding() });
      drawBoatSide(ctx, ax - 120, wy + 4, 0.8, { flip: true, t });
    }
    return hand;
  }
  rodTip(hand) {
    const bend = this.phase === 'over' && !this.won ? 0 : clamp(this.T, 0, 1.2);
    const ang = -1.05 + bend * 0.55; const len = 150;
    return { bx: hand.x - 22, by: hand.y + 14, tx: hand.x + Math.cos(ang) * len, ty: hand.y + Math.sin(ang) * len, ang, bend };
  }
  drawLine(ctx, hand, wy) {
    const r = this.rodTip(hand);
    ctx.strokeStyle = '#1d1f22'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const mx = (r.bx + r.tx) / 2 + r.bend * 20, my = (r.by + r.ty) / 2 - r.bend * 6;
    ctx.beginPath(); ctx.moveTo(r.bx, r.by); ctx.quadraticCurveTo(mx, my, r.tx, r.ty); ctx.stroke();
    ctx.strokeStyle = '#ffc845'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(r.bx, r.by); ctx.lineTo(r.bx + (mx - r.bx) * 0.35, r.by + (my - r.by) * 0.35); ctx.stroke();
    ctx.fillStyle = '#9aa3aa'; ell(ctx, hand.x - 6, hand.y + 4, 8, 7); ctx.fill();
    if (this.phase === 'over' && !this.won) {
      ctx.strokeStyle = 'rgba(240,240,240,0.7)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(r.tx, r.ty); ctx.quadraticCurveTo(r.tx + 40, r.ty + 80, r.tx + 30, wy + 30); ctx.stroke();
      return;
    }
    const sag = (1 - clamp(this.T, 0, 1)) * 90;
    ctx.strokeStyle = 'rgba(245,245,245,0.85)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(r.tx, r.ty); ctx.quadraticCurveTo((r.tx + this.fx) / 2, Math.max(r.ty, this.fy) - 20 + sag, this.fx + 30, this.fy); ctx.stroke();
  }
  drawFishBody(ctx, wy) {
    if (this.phase === 'over' && !this.won) return;
    const len = 70 + 90 * this.wn * (this.key === 'goliath' || this.key === 'bluemarlin' ? 1.6 : 1);
    ctx.save(); ctx.translate(this.fx, this.fy); ctx.rotate(this.fang);
    const above = this.fy < wy;
    const sil = !this.revealed && !above ? 'rgba(10,30,45,0.75)' : null;
    if (!above) ctx.globalAlpha = 0.85;
    drawFish(ctx, this.key, len, { t: this.t, flip: true, sil, speed: this.running ? 16 : 8 });
    ctx.restore();
  }
  drawHud(ctx, W, H) {
    if (this.phase === 'over') return;
    // fish stamina
    panel(ctx, 16, 12, 250, 84, { r: 14 });
    text(ctx, this.revealed ? this.sp.name : 'Something big…', 30, 37, { size: 20, weight: 800, color: '#fff', maxW: 222 });
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; rr(ctx, 30, 48, 222, 12, 6); ctx.fill();
    ctx.fillStyle = this.S > 0.5 ? PAL.coral : this.S > 0.2 ? PAL.sun : PAL.good; rr(ctx, 30, 48, 222 * this.S, 12, 6); ctx.fill();
    text(ctx, (this.unit === 'ft' ? 'DEPTH ' : 'LINE OUT ') + Math.max(0, Math.round(this.dist)) + ' ' + this.unit, 30, 84, { size: 16, color: '#cfe3ea', weight: 800 });
    text(ctx, 'FISH', 252, 84, { size: 13, align: 'right', color: '#9fb8c2', weight: 800 });
    if (this.o.timeLeft) { const tl = this.o.timeLeft(); drawTimerPill(ctx, W / 2, 34, tl); }
    // tension meter
    const mx = W - 62, my0 = 96, my1 = 400, mh = my1 - my0, L = this.perks.line, scale = 1.25;
    const yOf = (v) => my1 - (v / scale) * mh;
    panel(ctx, mx - 30, my0 - 40, 60, mh + 70, { r: 16 });
    text(ctx, 'DRAG', mx, my0 - 18, { size: 15, align: 'center', color: '#cfe3ea', weight: 800 });
    ctx.fillStyle = 'rgba(120,170,200,0.35)'; ctx.fillRect(mx - 12, yOf(0.12), 24, yOf(0) - yOf(0.12));
    ctx.fillStyle = 'rgba(60,207,124,0.55)'; ctx.fillRect(mx - 12, yOf(0.86 * L), 24, yOf(0.38) - yOf(0.86 * L));
    ctx.fillStyle = 'rgba(255,79,79,0.6)'; ctx.fillRect(mx - 12, yOf(scale), 24, yOf(L) - yOf(scale));
    ctx.fillStyle = 'rgba(255,173,31,0.45)'; ctx.fillRect(mx - 12, yOf(L), 24, yOf(0.86 * L) - yOf(L));
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(mx - 12, my0, 24, mh);
    const ny = yOf(clamp(this.T, 0, scale));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx - 22, ny); ctx.lineTo(mx - 12, ny - 7); ctx.lineTo(mx - 12, ny + 7); ctx.fill();
    ctx.fillRect(mx - 12, ny - 2, 24, 4);
    // prompt
    let msg = 'HOLD TO REEL', col = '#fff';
    const danger = this.T > 0.86 * L, slack = this.slackT > 0.6;
    if (this.phase === 'turn') { msg = 'TAP TAP TAP! TURN IT!'; col = PAL.sun; }
    else if (this.jumpT > 0) { msg = 'IT JUMPED! LET GO!'; col = PAL.sun; }
    else if (this.running) { msg = danger ? 'LET GO! IT’S RUNNING' : 'IT’S RUNNING · LET IT GO'; col = danger ? PAL.bad : PAL.warn; }
    else if (this.tele) { msg = 'GET READY…'; col = PAL.warn; }
    else if (slack) { msg = 'SLACK! REEL!'; col = '#9fe0ff'; }
    else if (danger) { msg = 'TOO TIGHT!'; col = PAL.bad; }
    const pw = Math.min(W - 180, 460);
    panel(ctx, W / 2 - pw / 2, H - 70, pw, 52, { r: 26 });
    const pulse = (this.running || this.jumpT > 0 || this.phase === 'turn') ? 1 + Math.sin(this.t * 14) * 0.04 : 1;
    ctx.save(); ctx.translate(W / 2, H - 43); ctx.scale(pulse, pulse);
    text(ctx, msg, 0, 0, { size: 26, align: 'center', base: 'middle', color: col, weight: 800, maxW: pw - 30 });
    ctx.restore();
    if (this.phase === 'turn') {
      const bw = Math.min(420, W - 200), bx = W / 2 - bw / 2, by = H - 128;
      panel(ctx, bx - 14, by - 34, bw + 28, 74, { r: 16 });
      text(ctx, { mangrove: 'KEEP IT OUT OF THE MANGROVES', piling: 'KEEP IT OFF THE PILINGS', wreck: 'PULL IT OUT OF THE WRECK', rock: 'PULL IT OFF THE BOTTOM' }[this.cover], W / 2, by - 12, { size: 16, align: 'center', color: '#cfe3ea', weight: 800 });
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; rr(ctx, bx, by, bw, 20, 10); ctx.fill();
      ctx.fillStyle = this.rockBar < 0.25 ? PAL.bad : PAL.good; rr(ctx, bx, by, bw * clamp(this.rockBar, 0, 1), 20, 10); ctx.fill();
      if (this.crankFx > 0) { ctx.strokeStyle = PAL.sun; ctx.lineWidth = 3; rr(ctx, bx - 3, by - 3, bw + 6, 26, 12); ctx.stroke(); }
    }
  }
  drawOver(ctx, W, H) {
    const k = easeOut(this.overT / 0.35);
    ctx.fillStyle = `rgba(4,26,38,${0.72 * k})`; ctx.fillRect(0, 0, W, H);
    if (!this.won) {
      const [title, sub] = LOSS_TEXT[this.reason] || ['Lost it', ''];
      ctx.save(); ctx.translate(W / 2, H / 2 - 30); ctx.scale(easeBack(Math.min(1, this.overT / 0.3)), easeBack(Math.min(1, this.overT / 0.3)));
      text(ctx, title, 0, 0, { display: true, size: 60, align: 'center', base: 'middle', color: PAL.coral, stroke: '#04202d', sw: 10 });
      ctx.restore();
      text(ctx, sub, W / 2, H / 2 + 30, { size: 22, align: 'center', color: '#fff', weight: 600, maxW: W - 80 });
      if (this.overT > 0.9) text(ctx, Game.touch ? 'Tap to keep fishing' : 'Click or press Space to keep fishing', W / 2, H / 2 + 80, { size: 18, align: 'center', color: '#cfe3ea', weight: 700, alpha: 0.6 + Math.sin(this.t * 4) * 0.3 });
      return;
    }
    const c = this.catch;
    drawSunburst(ctx, W * 0.32, H * 0.5, 420, this.t, 'rgba(255,200,69,0.16)');
    if (this.confetti) { this.confetti.update(1 / 60); this.confetti.draw(ctx); }
    const sc = easeBack(Math.min(1, this.overT / 0.4));
    ctx.save(); ctx.translate(W * 0.32, H * 0.42); ctx.scale(sc, sc);
    drawHeroShot(ctx, this.ch, { kind: 'fish', key: this.key, weight: this.weight }, 0, 0, 36, this.t);
    ctx.restore();
    const px = W * 0.58, pw = Math.min(W * 0.38, 420);
    text(ctx, c.name, px, 120, { display: true, size: 40, color: '#fff', stroke: '#04202d', sw: 8, maxW: pw });
    text(ctx, fmtLb(c.weight), px, 172, { size: 44, color: PAL.sun, weight: 800, stroke: '#04202d', sw: 6 });
    let y = 210;
    const tags = [];
    if (c.trophy) tags.push(['TROPHY', PAL.coral]);
    if (this.isPB) tags.push(['NEW PERSONAL BEST', '#42d3c4']);
    if (c.released) tags.push(['RELEASED', '#7fd98f']);
    let tx = px;
    ctx.font = fnt(15, 800);
    for (const [tg, col] of tags) { const tw = ctx.measureText(tg).width + 22; ctx.fillStyle = col; rr(ctx, tx, y, tw, 28, 14); ctx.fill(); text(ctx, tg, tx + tw / 2, y + 15, { size: 15, align: 'center', base: 'middle', color: '#04202d', weight: 800 }); tx += tw + 8; }
    y += tags.length ? 52 : 18;
    for (const l of c.lines) { text(ctx, l.label, px, y, { size: 19, color: '#cfe3ea', weight: 600 }); text(ctx, '+' + l.pts, px + pw, y, { size: 19, align: 'right', color: '#fff', weight: 800 }); y += 28; }
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(px, y - 14, pw, 2);
    text(ctx, 'Total', px, y + 14, { size: 22, color: '#fff', weight: 800 });
    text(ctx, '+' + c.pts, px + pw, y + 14, { size: 28, align: 'right', color: PAL.sun, weight: 800 });
    if (this.overT > 0.9) text(ctx, Game.touch ? 'Tap to keep fishing' : 'Click or press Space to keep fishing', W / 2, H - 26, { size: 18, align: 'center', color: '#cfe3ea', weight: 700, alpha: 0.6 + Math.sin(this.t * 4) * 0.3 });
  }
}

function drawTimerPill(ctx, x, y, secs) {
  const low = secs <= 10;
  panel(ctx, x - 58, y - 20, 116, 40, { r: 20, fill: low ? 'rgba(160,30,30,0.92)' : PAL.panel });
  text(ctx, fmtTime(secs), x, y + 1, { size: 24, align: 'center', base: 'middle', color: low ? '#fff' : PAL.sun, weight: 800 });
}

/* ---- js/session.js ---- */
'use strict';
/* Keys Crew — shared plumbing for a timed turn at a spot: clock, pause, top bar,
   running a fish fight on top of the spot, and packaging the results. */

class SessionBase {
  constructor(o) {
    this.o = o; this.ch = o.ch; this.C = CHARS[o.ch]; this.perks = this.C.perks; this.spot = o.spot;
    this.weather = o.weather || { id: 'light', name: 'Light chop', vis: 1, drift: 0.5, aim: 1 };
    this.len = o.len || 120; this.timeLeft = this.len; this.t = 0;
    this.paused = false; this.quitAsk = false; this.leaving = false; this.ended = false; this.endT = 0; this.endReason = null;
    this.catches = []; this.extraLines = []; this.score = 0;
    this.parts = new Particles(); this.fl = new Floaters(); this.child = null; this.music = 'boat';
  }
  tickTime(dt) {
    if (this.timeLeft <= 0) return;
    const before = this.timeLeft; this.timeLeft = Math.max(0, this.timeLeft - dt);
    if (before > 10 && this.timeLeft <= 10) { Game.toast('10 seconds left!', { color: PAL.sun, size: 30, y: 110 }); SFX.play('warn'); }
    if (this.timeLeft <= 0 && this.child) Game.toast('Last fish! Land it!', { color: PAL.sun, size: 30, y: 110 });
  }
  addCatch(c) { this.catches.push(c); this.score += c.pts; }
  addLine(label, pts) { this.extraLines.push({ label, pts }); this.score += pts; }
  startFight(opts) {
    const fs = new FightScene(Object.assign({
      ch: this.ch, spot: this.spot, weather: this.weather,
      tick: (dt) => this.tickTime(dt), timeLeft: () => this.timeLeft,
      onDone: (r) => { this.child = null; Music.play(this.music); if (r.ok) this.addCatch(r.catch); if (this.onFightDone) this.onFightDone(r); if (this.timeLeft <= 0) this.end('time'); }
    }, opts));
    this.child = fs; fs.enter();
  }
  end(reason) {
    if (this.ended) return;
    this.ended = true; this.endT = 0; this.endReason = reason; SFX.setDrag(0);
    const msg = reason === 'limit' ? 'Limited out!' : reason === 'quit' ? 'Heading in' : 'Time’s up!';
    Game.toast(msg, { color: PAL.sun, size: 52, dur: 1.6, y: Game.H / 2 - 20 });
    SFX.play('horn');
  }
  buildResult() {
    const lines = this.catches.map((c) => ({ label: c.name + ' · ' + fmtLb(c.weight), pts: c.pts, key: c.key, trophy: c.trophy }));
    for (const l of this.extraLines) lines.push(l);
    const total = Math.max(0, lines.reduce((a, l) => a + l.pts, 0));
    let best = null; for (const c of this.catches) if (!best || c.pts > best.pts) best = c;
    return { catches: this.catches, lines, total, best, header: this.resultHeader || null };
  }
  finish() { if (this.finished) return; this.finished = true; SFX.setDrag(0); SFX.setAmbient(0); this.o.onEnd(this.buildResult()); }
  // returns true when the subclass should skip its own update
  baseUpdate(dt) {
    if (this.paused || this.leaving) return true;   // a fish fight freezes too
    if (this.child) { this.child.update(dt); return true; }
    this.t += dt; this.parts.update(dt); this.fl.update(dt);
    if (this.ended) { this.endT += dt; if (this.endT > 1.7) this.finish(); return true; }
    this.tickTime(dt);
    if (this.timeLeft <= 0 && !this.child) { this.end('time'); return true; }
    return false;
  }
  togglePause() { if (this.ended || this.leaving) return; this.setPaused(!this.paused); }
  setPaused(on) { this.paused = on; this.quitAsk = false; SFX.setDrag(0); if (on) Game.toasts = []; }  // toasts draw above everything, so clear them off the menu
  // leave mid-turn: this turn never reaches the results. Trip.cur still points at this spot and angler,
  // so Resume trip on the title screen hands the phone right back to them.
  quitToTitle() {
    if (this.leaving) return;
    this.leaving = true; this.finished = true; SFX.setDrag(0); SFX.setAmbient(0);
    if (Trip.cur && Trip.cur.mode === 'crew') Trip.save();
    Game.go(new TitleScene());
  }
  basePointerDown(p) {
    if (this.paused || this.leaving) return true;
    if (this.child) { this.child.pointerDown(p); return true; }
    return this.ended;
  }
  baseKeyDown(c) {
    if (c === 'Escape' || c === 'KeyP') { if (this.quitAsk) this.quitAsk = false; else this.togglePause(); return true; }
    if (this.paused || this.leaving) return true;
    if (this.child) { this.child.keyDown(c); return true; }
    return this.ended;
  }
  drawTopBar(ctx) {
    const W = Game.W;
    UI.button(ctx, 'pause', 14, 12, 46, 46, '❚❚', () => this.togglePause(), { style: 'dark', size: 16, r: 14 });
    panel(ctx, 70, 12, 196, 46, { r: 23 });
    ctx.save(); ell(ctx, 93, 35, 19, 19); ctx.clip(); ctx.fillStyle = '#7fc8e8'; ctx.fillRect(70, 12, 46, 46); drawHead(ctx, this.C, 93, 40, 15); ctx.restore();
    ctx.strokeStyle = this.C.color; ctx.lineWidth = 2.5; ell(ctx, 93, 35, 19, 19); ctx.stroke();
    text(ctx, this.C.name, 120, 31, { size: 17, weight: 800, color: '#fff' });
    text(ctx, this.score.toLocaleString() + ' pts', 120, 50, { size: 15, weight: 700, color: PAL.sun });
    drawTimerPill(ctx, W / 2, 35, this.timeLeft);
  }
  drawPause(ctx) {
    const W = Game.W, H = Game.H, cx = W / 2, crew = Trip.cur && Trip.cur.mode === 'crew';
    for (const r of UI.regions) r.disabled = true;   // nothing under the menu answers clicks or hotkeys while paused
    ctx.fillStyle = 'rgba(3,22,32,0.86)'; ctx.fillRect(0, 0, W, H);
    if (this.quitAsk) return this.drawQuitAsk(ctx, crew);
    text(ctx, 'Paused', cx, 130, { display: true, size: 54, align: 'center', color: '#fff' });
    text(ctx, SPOTS[this.spot].name + ' · ' + fmtTime(this.timeLeft) + ' left', cx, 168, { size: 20, align: 'center', color: '#cfe3ea', weight: 600 });
    UI.button(ctx, 'resume', cx - 130, 194, 260, 56, 'Resume', () => this.setPaused(false), { key: 'Escape|Enter|Space', size: 22 });
    UI.button(ctx, 'mute', cx - 130, 264, 125, 48, SFX.muted ? 'Sound: off' : 'Sound: on', () => SFX.setMuted(!SFX.muted), { style: 'secondary', size: 17 });
    UI.button(ctx, 'music', cx + 5, 264, 125, 48, Music.on ? 'Music: on' : 'Music: off', () => Music.setOn(!Music.on), { style: 'secondary', size: 17 });
    UI.button(ctx, 'quit', cx - 130, 326, 260, 56, 'End my turn now', () => { this.setPaused(false); this.end('quit'); }, { style: 'coral', size: 20, sub: this.child ? 'Right after this fish' : 'Your catches so far still count' });
    UI.button(ctx, 'totitle', cx - 130, 398, 260, 52, 'Quit to title', () => (this.quitAsk = true), { style: 'ghost', size: 19, sub: crew ? 'Your trip is saved' : 'Ends your solo day' });
  }
  drawQuitAsk(ctx, crew) {
    const W = Game.W, cx = W / 2;
    text(ctx, crew ? 'Leave the trip?' : 'Leave your day?', cx, 150, { display: true, size: 46, align: 'center', color: '#fff', maxW: W - 60 });
    const lines = crew
      ? ['Your trip is saved. Pick it up with Resume trip on the title screen.', 'This turn won’t count. ' + this.C.name + ' starts it over when you come back.']
      : ['Solo days aren’t saved, so your day ends here.', 'This turn won’t count. Bests from earlier turns stay in the logbook.'];
    lines.forEach((l, i) => text(ctx, l, cx, 202 + i * 30, { size: 19, align: 'center', color: '#cfe3ea', weight: 600, maxW: W - 70 }));
    UI.button(ctx, 'quitno', cx - 230, 280, 220, 56, 'Cancel', () => (this.quitAsk = false), { style: 'ghost', size: 20, key: 'Escape' });
    UI.button(ctx, 'quityes', cx + 10, 280, 220, 56, 'Quit to title', () => this.quitToTitle(), { style: 'coral', size: 20 });
  }
  // during a fish fight the fight draws the whole screen; keep a pause button on it, next to the clock
  drawChildOrNull(ctx) {
    if (!this.child) return false;
    this.child.draw(ctx);
    if (!this.ended && this.child.phase !== 'over') UI.button(ctx, 'pause', Game.W / 2 + 68, 14, 44, 40, '❚❚', () => this.togglePause(), { style: 'dark', size: 15, r: 14 });
    if (this.paused) this.drawPause(ctx);
    return true;
  }
}

/* ---- js/bughunt.js ---- */
'use strict';
/* Keys Crew — Bug Hunt. Free-dive the reef for spiny lobster.
   Hold on a hole (or TICKLE) to coax the bug out, and let go when it twitches. When it walks out,
   click or tap it to swing the net. Lobsters tail-flip backward toward their hole, so a net set
   behind one catches it. Gauge every bug: carapace over 3", no eggs. Six per person.
   Now and then a shark shows up, and you race it back to the boat. */

const BH = { SURF: 96, BAG: 6, BOATX: 660 };
const GAUGE_IN = 3.0;
const NET = { REACH: 170, HOOP: 30, SWING: 0.2, SET: 1.3, COOL: 0.3 };
const BH_SITES = {
  patch: { WW: 3400, floor: 500, ledgeH: [62, 120], gap: [150, 260], bugs: 6, morays: 3, extra: 0.3, shark: 0.35, gold: 1, big: 1, short: 0.34, grade: 0.16 },
  reef: { WW: 4300, floor: 700, ledgeH: [110, 240], gap: [120, 220], bugs: 9, morays: 5, extra: 0.35, shark: 0.55, gold: 2, big: 1.7, short: 0.24, grade: 0.36, light: true }
};

function rollCL(perks, site) {
  const r = Math.random(), sh = site ? site.short : 0.3;
  if (r < sh) return Math.round(rand(2.45, 2.97) * 100) / 100;
  if (r < sh + 0.12) return Math.round(rand(2.95, 3.1) * 100) / 100;
  const big = chance(0.16 * ((perks && perks.trophy) || 1) * (site ? site.big : 1));
  return Math.round((3.1 + Math.pow(Math.random(), 1.7) * (big ? 2.9 : 1.6)) * 100) / 100;
}
const lobsterWeight = (cl) => Math.round(0.034 * Math.pow(cl, 2.9) * 10) / 10;
const bugLen = (lob) => 46 + lob.cl * 5;

// what the rest of the crew yells from the boat
const QUIPS = {
  nice: ['Nice bug!', 'That’s dinner!', 'Look at that thing!', 'Into the cooler!'],
  big: ['THAT’S a big boy!', 'Big boy alert!', 'Now THAT’S a bug!'],
  short: ['Uh… that looked short.', 'FWC is gonna love that one.', 'Bro. Gauge it again.'],
  moray: ['HAHAHA wrong hole!', 'Morays bite, bro!', 'That’s an eel house!'],
  jelly: ['Jellies, man.', 'Watch the jellies!'],
  blackout: ['Breathe, bro!', 'Got you. Easy now.'],
  shark: ['SHARK!! Back to the boat!', 'Uhh… SHARK! SWIM!', 'SHARK! Move, move, move!'],
  escape: ['Never seen you swim that fast!', 'Bro walked on water.', 'I was gonna film it.', 'Still counts as a dive.'],
  caught: ['That’s the tax man!', 'He took a bug! HAHA', 'Sharks gotta eat too.'],
  gold: ['Is that… GOLD?!', 'No way. A golden bug!'],
  octo: ['Inked! HAHA', 'The octopus wins that one.'],
  miss: ['Tail-flipped you!', 'So close!', 'Net BEHIND it, bro!'],
  pro: ['Textbook!', 'Right into the net. Clean.', 'That’s how it’s done.'],
  empty: ['Nobody home.', 'Empty hole, bro.']
};

// a tiling caustic pattern (the bright net of light on the sand), built once
let BH_CAUSTIC = null;
function causticTile() {
  if (BH_CAUSTIC) return BH_CAUSTIC;
  const S = 192, c = document.createElement('canvas'); c.width = S; c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), rng = mulberry(99), pts = [];
  for (let i = 0; i < 16; i++) pts.push([rng() * S, rng() * S]);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let d1 = 1e9, d2 = 1e9;
    for (const [px, py] of pts) for (let oy = -S; oy <= S; oy += S) for (let ox = -S; ox <= S; ox += S) { const dd = Math.hypot(x - px - ox, y - py - oy); if (dd < d1) { d2 = d1; d1 = dd; } else if (dd < d2) d2 = dd; }
    const k = Math.max(0, 1 - (d2 - d1) / 10), p = (y * S + x) * 4;
    img.data[p] = 255; img.data[p + 1] = 255; img.data[p + 2] = 230; img.data[p + 3] = Math.round(255 * k * k);
  }
  g.putImageData(img, 0, 0);
  return (BH_CAUSTIC = c);
}

class BugHuntScene extends SessionBase {
  constructor(o) {
    super(o);
    const v = (SPOTS[o.spot] && SPOTS[o.spot].variant) || 'patch';
    this.variant = BH_SITES[v] ? v : 'patch'; this.site = BH_SITES[this.variant]; this.WW = this.site.WW;
    this.music = 'reef';
    this.resultHeader = 'FWC check at the ramp';
    this.diver = { x: BH.BOATX + 70, y: BH.SURF - 26, vx: 0, vy: 0, facing: 1, stun: 0 };
    this.intro = { t: 0 };
    this.maxBreath = 24 * this.perks.breath; this.breath = this.maxBreath;
    this.bag = []; this.out = null; this.gauge = null; this.blackout = 0; this.beatT = 0;
    this.joy = null; this.press = null; this.tickPtr = null; this.actionPtr = null; this.actionPress = false; this.cam = 0; this.camY = 0; this.goodReleases = 0;
    this.net = { state: 'carry', t: 0, x: 0, y: 0, cool: 0 }; this.seek = null; this.swings = 0;
    let others = (Trip.cur && Trip.cur.crew ? Trip.cur.crew : CHAR_ORDER).filter((c) => c !== this.ch).slice(0, 2);
    if (!others.length) others = CHAR_ORDER.filter((c) => c !== this.ch);
    this.others = others;
    this.quip = null; this.wasUnder = false; this.exhaleT = 2;
    this.coach = !Store.get('coach_bug2_' + this.ch, false); this.coachSaw = {};
    this.shark = null; this.sharkDone = false;
    this.sharkAt = o.shark === true ? 6 : o.shark === false ? null : chance(this.site.shark) ? rand(this.len * 0.22, this.len * 0.62) : null;
    this.gen();
  }
  enter() {
    SFX.setAmbient(1, false); Music.play('reef');
    Game.toast(SPOTS[this.spot] ? SPOTS[this.spot].name : 'Bug Hunt', { color: PAL.coral, size: 44, y: 200, sub: 'Find the antennae. Tickle them out. Swing the net.' });
    if (this.coach) Store.set('coach_bug2_' + this.ch, true);
  }
  exit() { SFX.setAmbient(0); Music.muffle(false); }
  baseFloor(x) { return this.site.floor + 10 * Math.sin(x * 0.004) + 6 * Math.sin(x * 0.013 + 1) + (this.variant === 'reef' ? 22 * Math.sin(x * 0.0017 + 2) : 0); }
  groundAt(x) { for (const L of this.ledges) if (x >= L.x0 - 4 && x <= L.x1 + 4) return L.top; return this.baseFloor(x); }
  solid(x, y) { return y > this.groundAt(x) - 12; }
  elapsed() { return this.len - this.timeLeft; }
  maxCamY() { return Math.max(0, this.site.floor + 46 - Game.H); }
  gen() {
    const S = this.site, WW = this.WW;
    this.ledges = []; let x = 620;
    while (x < WW - 240) { const w = rand(150, 270), h = rand(S.ledgeH[0], S.ledgeH[1]); this.ledges.push({ x0: x, x1: x + w, h, seed: randi(1, 99999) }); x += w + rand(S.gap[0], S.gap[1]); }
    for (const L of this.ledges) {
      L.top = this.baseFloor((L.x0 + L.x1) / 2) - L.h;
      const rng = mulberry(L.seed); L.pts = [];
      L.pts.push([L.x0 - 2, this.baseFloor(L.x0) + 4], [L.x0 - 7, L.top + L.h * 0.55], [L.x0 + 4, L.top + 6]);
      for (let px = L.x0 + 20; px < L.x1 - 14; px += 18) L.pts.push([px, L.top - rng() * 9]);
      L.pts.push([L.x1 - 4, L.top + 6], [L.x1 + 7, L.top + L.h * 0.55], [L.x1 + 2, this.baseFloor(L.x1) + 4]);
      L.deco = [];
      const kinds = this.variant === 'reef' ? ['fan', 'elk', 'elk', 'brain', 'sponge', 'rod', 'barrel'] : ['fan', 'brain', 'sponge', 'rod', 'rod', 'fan', 'urchin', 'barrel'];
      for (let px = L.x0 + 14; px < L.x1 - 10; px += rand(22, 40)) L.deco.push({ x: px, kind: pick(kinds), s: rand(0.7, 1.25), c: pick(['#8a4fb8', '#b85fa8', '#e07a3a', '#d9a441', '#7d5bd0']) });
      L.spots = []; for (let i = 0; i < 10; i++) L.spots.push([L.x0 + rng() * (L.x1 - L.x0), L.top + 10 + rng() * (L.h - 16), 2 + rng() * 6, rng()]);
    }
    // holes: at the foot of every ledge, up the walls of the tall ones. Most are empty.
    this.dens = [];
    for (const L of this.ledges) {
      for (const side of [-1, 1]) { const ex = side < 0 ? L.x0 : L.x1; if (chance(0.9)) this.dens.push(this.makeDen(ex, this.baseFloor(ex) - rand(15, 24), side)); }
      const walls = L.h > 150 ? 2 : L.h > 88 ? 1 : 0;
      for (let i = 0; i < walls; i++) if (chance(0.7)) { const right = chance(0.5); this.dens.push(this.makeDen(right ? L.x1 : L.x0, L.top + rand(26, L.h - 48), right ? 1 : -1)); }
    }
    const order = this.dens.slice().sort(() => Math.random() - 0.5);
    order.forEach((d, i) => {
      if (i < S.morays) d.kind = 'moray';
      else if (i < S.morays + S.bugs) { d.kind = 'lobster'; d.extra = chance(S.extra) ? 1 : 0; d.lob = this.makeLob(); }
      else d.kind = 'empty';
    });
    this.grass = []; for (let i = 0; i < WW / 34; i++) this.grass.push({ x: rand(0, WW), h: rand(10, 26), ph: rand(0, TAU) });
    this.jellies = []; for (let i = 0; i < Math.round(WW / 700); i++) this.jellies.push({ x: rand(700, WW - 100), y: rand(170, this.site.floor - 150), ph: rand(0, TAU), hit: 0 });
    this.schools = [];
    for (let i = 0; i < Math.round(WW / 650); i++) {
      const L = pick(this.ledges), fish = [], kind = pick(['tang', 'sgt', 'grunt', 'yt']);
      for (let k = 0; k < randi(6, 11); k++) fish.push({ ox: rand(-56, 56), oy: rand(-28, 28), ph: rand(0, TAU) });
      this.schools.push({ x: (L.x0 + L.x1) / 2, y: L.top - 40, cx: (L.x0 + L.x1) / 2, cy: L.top - (kind === 'yt' ? 110 : 40), ph: rand(0, TAU), fish, kind });
    }
    this.cuda = { x: rand(900, 2000), y: 230, dir: 1 };
    this.turtle = { x: rand(1000, 2200), y: rand(190, 280), dir: chance(0.5) ? 1 : -1, t: rand(0, 5) };
    this.ray = { x: -300, y: rand(150, 230), t: 0, wait: rand(6, 14), on: false };
    this.critters = [];
    for (let i = 0; i < Math.round(WW / 520); i++) { const L = pick(this.ledges), key = pick(['parrot', 'parrot', 'angel', 'hogfish']); this.critters.push({ key, cx: (L.x0 + L.x1) / 2, x: (L.x0 + L.x1) / 2 + rand(-60, 60), y: L.top - rand(18, 60), vx: rand(16, 30) * (chance(0.5) ? 1 : -1), range: (L.x1 - L.x0) / 2 + 40, t: rand(0, 5), nib: 0, len: key === 'parrot' ? rand(34, 46) : key === 'hogfish' ? rand(40, 52) : rand(26, 32) }); }
    this.crabs = []; for (let i = 0; i < 7; i++) { const cx = rand(200, WW - 200); this.crabs.push({ x: cx, dir: chance(0.5) ? 1 : -1, t: rand(0, 5), pause: rand(0, 2), flee: 0 }); }
    this.sandDeco = []; for (let i = 0; i < WW / 120; i++) this.sandDeco.push({ x: rand(100, WW - 100), kind: i % 3 ? 'star' : 'urchin', r: rand(5, 9), c: pick(['#e8742c', '#d9532f', '#f0a23a', '#c8467a']) });
    const gapL = this.ledges.find((L, i) => i > 0 && i < this.ledges.length - 1) || this.ledges[0];
    this.nurse = { x: gapL.x1 + 82, y: this.baseFloor(gapL.x1 + 82) - 8, dir: -1, t: 0, zT: 1, move: 0 };
    const oL = this.ledges[Math.min(this.ledges.length - 1, 3)];
    this.octo = { x: (oL.x0 + oL.x1) / 2 + rand(-30, 30), y: oL.top - 8, state: 'hide', t: 0, vx: 0, vy: 0, a: 1 };
    // a goliath grouper parked under the biggest ledge at the deep reef
    if (this.variant === 'reef') { const G = this.ledges.reduce((a, L) => (L.h > a.h ? L : a), this.ledges[0]); this.goliath = { x: G.x1 + 70, y: this.baseFloor(G.x1 + 70) - 34, t: 0 }; }
    this.snow = []; for (let i = 0; i < 80; i++) this.snow.push({ x: rand(0, 1400), y: rand(0, 640), r: rand(0.6, 1.8), vy: rand(3, 9), ph: rand(0, TAU) });
    this.fg = []; for (let x = 0; x < WW * 1.4; x += rand(240, 420)) this.fg.push({ x, kind: pick(['fan', 'rock', 'grass', 'grass']), s: rand(0.8, 1.4) });
    this.farFish = []; for (let i = 0; i < 6; i++) this.farFish.push({ x: rand(0, 1400), y: rand(170, 380), sp: rand(8, 18) * (chance(0.5) ? 1 : -1), n: randi(5, 9) });
  }
  makeDen(x, y, dir) { return { x, y, dir, kind: 'empty', coax: 0, spooks: 0, twitch: 0, nextTwitch: rand(0.9, 1.8), badHold: 0, state: 'in', peek: 0, peekT: rand(2, 5), lob: null, extra: 0, probe: 0 }; }
  makeLob() { const cl = rollCL(this.perks, this.site); return { cl, w: lobsterWeight(cl), eggs: cl > 3.0 && chance(0.14), gold: cl > 3.0 && chance(0.04 * this.perks.trophy * this.site.gold) }; }
  say(kind, p = 1) {
    if (!chance(p) || !QUIPS[kind]) return;
    this.quip = { who: pick(this.others), msg: pick(QUIPS[kind]), t: 2.8 };
  }

  /* ---------- input ---------- */
  actionZone() { return { x: Game.W - 96, y: Game.H - 96, r: 66 }; }
  inAction(x, y) { const a = this.actionZone(); return dist(x, y, a.x, a.y) < a.r + 8; }
  toWorld(p) { return [p.x + this.cam, p.y + this.camY]; }
  denAt(wx, wy) { let best = null, bd = 44; for (const den of this.dens) { if (den.state === 'gone') continue; const dd = dist(wx, wy, den.x + den.dir * 6, den.y); if (dd < bd) { bd = dd; best = den; } } return best; }
  pointerDown(p) {
    if (this.basePointerDown(p) || this.gauge || this.blackout > 0 || this.intro) return;
    if (this.inAction(p.x, p.y)) { this.actionPtr = p.id; this.actionPress = true; return; }
    const [wx, wy] = this.toWorld(p);
    if (!this.out) { const den = this.denAt(wx, wy); if (den) { this.tickPtr = { id: p.id, den }; return; } }
    this.press = { id: p.id, sx: p.x, sy: p.y, t0: this.t };
  }
  pointerMove(p) {
    if (this.press && this.press.id === p.id && dist(p.x, p.y, this.press.sx, this.press.sy) > 14) { this.joy = { id: p.id, sx: this.press.sx, sy: this.press.sy, x: p.x, y: p.y }; this.press = null; }
    if (this.joy && this.joy.id === p.id) { this.joy.x = p.x; this.joy.y = p.y; }
  }
  pointerUp(p) {
    if (this.press && this.press.id === p.id) { const [wx, wy] = this.toWorld(p); this.press = null; this.swingAt(wx, wy); }
    if (this.joy && this.joy.id === p.id) this.joy = null;
    if (this.actionPtr === p.id) this.actionPtr = null;
    if (this.tickPtr && this.tickPtr.id === p.id) { this.tickPtr = null; this.seek = null; }
  }
  keyDown(c) {
    if (this.baseKeyDown(c) || this.gauge || this.intro) return;
    if (c === 'Space' || c === 'KeyE' || c === 'KeyF') this.actionPress = true;
  }
  actionHeld() { return this.actionPtr != null || Input.held('Space', 'KeyE'); }

  /* ---------- the net ---------- */
  shoulder() { const d = this.diver; return { x: d.x + d.facing * 10, y: d.y + 2 }; }
  carryPos() { const d = this.diver; return { x: d.x + d.facing * 36, y: d.y + 22 }; }
  bugBody(o) { return { x: o.x, y: o.y - 3 }; }
  swingAt(wx, wy) {
    const n = this.net, d = this.diver;
    if (n.state === 'swing' || n.cool > 0 || this.gauge || this.intro || this.blackout > 0 || d.y < BH.SURF + 10) return;
    const sh = this.shoulder(); let dx = wx - sh.x, dy = wy - sh.y; const L = Math.hypot(dx, dy) || 1;
    if (L > NET.REACH) {
      if (this.out && dist(wx, wy, this.out.x, this.out.y) < 100) { this.seek = { kind: 'net', t: 1.6 }; return; }   // too far: swim at it, swing when in reach
      dx *= NET.REACH / L; dy *= NET.REACH / L;

    this.net = { state: 'swing', t: 0, fx: from.x, fy: from.y, tx, ty, x: from.x, y: from.y, cool: NET.COOL };
    this.swings++; this.seek = null;
    SFX.play('swish');
    for (let i = 0; i < 4; i++) this.parts.add({ kind: 'bubble', x: from.x + rand(-6, 6), y: from.y, vy: -rand(30, 60), vx: rand(-10, 10), life: 1.2, size: rand(1.5, 3) });
  }
  autoSwing() {
    const o = this.out; if (!o) return;
    const b = this.bugBody(o), lead = o.state === 'walk' ? Math.sign(o.tx - o.x) * 16 : 0;
    this.swingAt(b.x + lead, b.y);
  }
  inHoop(o, tight) { const b = this.bugBody(o); return dist(this.net.x, this.net.y, b.x, b.y) < (tight ? NET.HOOP * 0.85 : NET.HOOP + 12); }
  updateNet(dt) {
    const n = this.net; n.cool = Math.max(0, n.cool - dt);

  netImpact() {

    SFX.play('net');

  }
  missed(o) {

  }
  catchIt(pro) {

    if (pro) { this.addLine('Backed it into the net', 50); this.fl.add(o.x - this.cam, o.y - this.camY - 40, 'PRO MOVE +50', PAL.sun, 24); this.say('pro'); }
    else if (!o.misses) { this.addLine('One swing, one bug', 25); this.fl.add(o.x - this.cam, o.y - this.camY - 40, 'CLEAN SWING +25', PAL.sun, 22); }
    this.gauge = { lob: o.lob, t: 0 }; Game.toasts = [];
    this.out = null; this.net.state = 'carry'; this.coach = false;
  }

  /* ---------- update ---------- */
  update(dt) {

    const d = this.diver, t = this.t;

      this.updateCam(dt); return;
    }
    if (this.press && this.t - this.press.t0 > 0.24) { this.joy = { id: this.press.id, sx: this.press.sx, sy: this.press.sy, x: this.press.sx, y: this.press.sy }; this.press = null; }
    // movement input
    let ix = 0, iy = 0;
    if (Input.held('ArrowLeft', 'KeyA')) ix -= 1; if (Input.held('ArrowRight', 'KeyD')) ix += 1;
    if (Input.held('ArrowUp', 'KeyW')) iy -= 1; if (Input.held('ArrowDown', 'KeyS')) iy += 1;
    if (this.joy) { const jx = (this.joy.x - this.joy.sx) / 55, jy = (this.joy.y - this.joy.sy) / 55; const m = Math.hypot(jx, jy); if (m > 0.12) { ix = jx / Math.max(1, m); iy = jy / Math.max(1, m); } }
    const manual = Math.hypot(ix, iy) > 0.1;
    if (manual && this.seek && this.seek.kind === 'net') this.seek = null;
    // auto-swim: toward a hole you're holding, or toward the bug you clicked
    let seekTo = null;
    if (!manual && this.tickPtr && this.tickPtr.den.state !== 'gone') { const den = this.tickPtr.den; seekTo = [den.x + den.dir * 58, den.y - 2]; }
    if (!manual && this.seek && this.seek.kind === 'net' && this.out) {
      this.seek.t -= dt; const b = this.bugBody(this.out), sh = this.shoulder();
      if (dist(sh.x, sh.y, b.x, b.y) < NET.REACH * 0.9) this.autoSwing(); else if (this.seek.t > 0) seekTo = [b.x - Math.sign(b.x - d.x) * 90, b.y - 10]; else this.seek = null;
    } else if (this.seek && !this.out) this.seek = null;
    if (seekTo) { const dx = seekTo[0] - d.x, dy = seekTo[1] - d.y, m = Math.hypot(dx, dy); if (m > 8) { ix = dx / m * Math.min(1, m / 60); iy = dy / m * Math.min(1, m / 60); } }
    const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }
    const stunned = d.stun > 0; if (stunned) { d.stun -= dt; ix = 0; iy = 0; }
    const under = d.y > BH.SURF + 14;
    const sp = this.shark && this.shark.state === 'hunt' ? 176 : 168;
    d.vx = approach(d.vx, ix * sp, 4, dt);
    d.vy = approach(d.vy, iy * sp + (iy === 0 ? -16 : 0), 4, dt);
    if (Math.abs(ix) > 0.1 && !(this.net.state === 'swing')) d.facing = ix > 0 ? 1 : -1;
    const drift = under ? -this.weather.drift * 16 : 0;
    let nx = d.x + (d.vx + drift) * dt, ny = d.y + d.vy * dt;
    nx = clamp(nx, 30, this.WW - 30);
    if (this.solid(nx + d.facing * 28, d.y) || this.solid(nx, d.y)) { nx = d.x; d.vx = 0; }
    ny = clamp(ny, BH.SURF + 2, this.site.floor + 80);
    if (this.solid(nx, ny)) { ny = this.groundAt(nx) - 12; d.vy = Math.min(0, d.vy); }
    d.x = nx; d.y = ny;
    this.updateCam(dt);

    if (!under && this.wasUnder) { this.parts.burst(d.x + d.facing * 16, BH.SURF - 18, 10, { color: ['#ffffff', '#dff6ff'], angle: -Math.PI / 2, spread: 0.4, min: 80, max: 190, g: 500, life: 0.6 }); SFX.noise(0.25, { filter: 'bandpass', f: 1800, vol: 0.12 }); Music.muffle(false); SFX.setAmbient(1, false); }
    this.wasUnder = under;

      if (this.exhaleT <= 0) { this.exhaleT = rand(2, 2.8); for (let i = 0; i < 5; i++) this.parts.add({ kind: 'bubble', x: d.x + d.facing * 30 + rand(-3, 3), y: d.y - 10, vy: -rand(40, 80), vx: rand(-10, 10), life: 2, size: rand(1.8, 4) }); if (chance(0.5)) SFX.play('bubble'); }
      if (Math.hypot(d.vx, d.vy) > 120 && chance(dt * 8)) this.parts.add({ kind: 'bubble', x: d.x - d.facing * 70, y: d.y + rand(-4, 4), vy: -30, vx: -d.facing * 20, life: 1, size: rand(1, 2.2) });
    } else this.breath = Math.min(this.maxBreath, this.breath + dt * 9);
    if (this.breath < this.maxBreath * 0.28 && under) { this.beatT -= dt; if (this.beatT <= 0) { this.beatT = 0.75; SFX.tone(60, 0.12, { vol: 0.25 }); } }
    if (this.breath <= 0) { this.blackout = 2.2; this.breath = 0; if (this.out) this.sendHome(this.out, null, true); SFX.play('fail'); return; }
    for (const j of this.jellies) if (!j.hit && dist(j.x, j.y, d.x + d.facing * 10, d.y) < 26) { j.hit = 2; d.stun = 0.7; this.breath -= 3; Game.toast('Jellyfish sting!', { color: '#ff9fd6', size: 30, y: 130 }); SFX.play('sting'); Game.shake(4); this.say('jelly', 0.6); }
    // the shark
    if (!this.shark && !this.sharkDone && this.sharkAt != null && this.elapsed() >= this.sharkAt && d.y > BH.SURF + 80 && Math.abs(d.x - BH.BOATX) > 420 && !this.out) this.startShark();

    }
    this.target = target;
    const reach = target && (d.x - target.x) * target.dir > 4 && dist(d.x, d.y, target.x + target.dir * 52, target.y) < 46;
    this.inReach = !!reach;

      this.parts.burst(target.x, target.y, 10, { color: 'rgba(255,255,255,0.7)', kind: 'bubble', min: 20, max: 60, life: 1 });

    } else if (held && target.kind === 'lobster') {

      else target.coax += dt * 0.5 * this.perks.coax;

      if (target.nextTwitch <= 0 && target.twitch <= 0) { target.twitch = 0.6; target.badHold = 0; target.nextTwitch = rand(0.8, 1.9); SFX.tone(300, 0.06, { type: 'square', vol: 0.05 }); }
      if (target.coax >= 1) this.emerge(target);

  }
  updateIntro(dt) {
    const I = this.intro, d = this.diver; I.t += dt;
    // a back-roll off the gunwale
    if (I.t < 0.5) { d.x = BH.BOATX + 70; d.y = BH.SURF - 26; }
    else if (I.t < 1.15) { const k = (I.t - 0.5) / 0.65; d.x = BH.BOATX + 70 + k * 30; d.y = BH.SURF - 26 + k * k * 96; }
    else { d.vx = 40; d.vy = 30; this.intro = null; this.wasUnder = false; return; }
    if (I.t >= 0.86 && !I.splash) { I.splash = true; this.parts.burst(d.x, BH.SURF, 22, { color: ['#ffffff', '#cfefff'], angle: -Math.PI / 2, spread: 1.1, min: 80, max: 220, g: 500, life: 0.8 }); SFX.play('splash'); }
  }
  updateCam(dt) {
    const d = this.diver;
    this.cam = approach(this.cam, clamp(d.x - Game.W * 0.45, 0, this.WW - Game.W), 6, dt);
    this.camY = approach(this.camY, clamp(d.y - Game.H * 0.5, 0, this.maxCamY()), 5, dt);
  }
  updateScenery(dt, d, t) {
    for (const j of this.jellies) { j.ph += dt; j.x += Math.sin(j.ph * 0.3) * 10 * dt - this.weather.drift * 6 * dt; j.y += Math.sin(j.ph * 0.9) * 8 * dt; j.hit = Math.max(0, j.hit - dt); }
    this.cuda.x += this.cuda.dir * 26 * dt; if (this.cuda.x > this.WW - 200 || this.cuda.x < 300) this.cuda.dir *= -1;
    for (const s of this.schools) { s.ph += dt * 0.5; s.x = s.cx + Math.cos(s.ph) * 70; s.y = s.cy + Math.sin(s.ph * 1.3) * 18; if (dist(s.x, s.y, d.x, d.y) < 70) s.x += (s.x - d.x) * 0.6; }
    const tu = this.turtle; tu.t += dt; tu.x += tu.dir * 26 * dt; tu.y += Math.sin(tu.t * 0.5) * 6 * dt; if (tu.x < 200 || tu.x > this.WW - 200) tu.dir *= -1;
    const ry = this.ray; if (!ry.on) { ry.wait -= dt; if (ry.wait <= 0) { ry.on = true; ry.x = -200; ry.y = rand(150, 240); } } else { ry.t += dt; ry.x += 55 * dt; if (ry.x > Game.W + 260) { ry.on = false; ry.wait = rand(12, 22); } }
    for (const f of this.farFish) { f.x += f.sp * dt; if (f.x > 1500) f.x = -100; if (f.x < -100) f.x = 1500; }
    for (const c of this.critters) {
      c.t += dt;
      const near = dist(c.x, c.y, d.x, d.y) < 90;
      if (c.nib > 0) { c.nib -= dt; if (chance(dt * 6)) this.parts.add({ x: c.x + Math.sign(c.vx) * c.len * 0.5, y: c.y + 4, vx: rand(-10, 10), vy: rand(10, 30), life: 0.7, size: 1.5, color: 'rgba(255,255,240,0.8)' }); }
      else { c.x += c.vx * (near ? 3 : 1) * dt; if (Math.abs(c.x - c.cx) > c.range) { c.vx = -Math.sign(c.x - c.cx) * Math.abs(c.vx); } if (c.key === 'parrot' && chance(dt * 0.15)) c.nib = 1.4; }
      c.y += Math.sin(c.t * 1.3) * 4 * dt;
    }
    for (const c of this.crabs) {
      c.t += dt; const near = Math.abs(c.x - d.x) < 90 && d.y > this.baseFloor(c.x) - 120;
      if (near) { c.flee = 0.8; c.dir = c.x > d.x ? 1 : -1; }
      if (c.flee > 0) { c.flee -= dt; c.x += c.dir * 120 * dt; }
      else if (c.pause > 0) c.pause -= dt;
      else { c.x += c.dir * 24 * dt; if (chance(dt * 0.4)) { c.pause = rand(0.5, 2); if (chance(0.4)) c.dir *= -1; } }
      c.x = clamp(c.x, 40, this.WW - 40); if (this.groundAt(c.x) < this.baseFloor(c.x) - 2) { c.dir *= -1; c.x += c.dir * 6; }
    }
    const n = this.nurse; n.t += dt; n.zT -= dt;
    if (n.zT <= 0) { n.zT = 1.6; this.parts.add({ kind: 'bubble', x: n.x + n.dir * 50, y: n.y - 10, vy: -26, vx: rand(-4, 4), life: 2.2, size: 2.5 }); }
    if (n.move <= 0 && dist(n.x, n.y, d.x, d.y) < 70) { n.move = 2.2; n.dir *= -1; this.fl.add(n.x - this.cam, n.y - this.camY - 40, 'zzz… huh?', '#ffffff', 16); }
    if (n.move > 0) { n.move -= dt; n.x += n.dir * 60 * dt; }
    if (this.goliath) this.goliath.t += dt;
    const o = this.octo; o.t += dt;
    if (o.state === 'hide' && dist(o.x, o.y, d.x, d.y) < 95) {
      o.state = 'flee'; o.vx = (o.x > d.x ? 1 : -1) * 230; o.vy = -150; SFX.noise(0.4, { filter: 'lowpass', f: 600, vol: 0.2 });
      for (let i = 0; i < 26; i++) this.parts.add({ x: o.x + rand(-10, 10), y: o.y + rand(-10, 10), vx: rand(-40, 40), vy: rand(-30, 30), drag: 1.5, life: rand(1.6, 2.6), size: rand(8, 16), color: 'rgba(18,14,30,0.55)' });
      this.fl.add(o.x - this.cam, o.y - this.camY - 40, 'INKED!', '#c9b8ff', 22); this.say('octo', 0.6);
    }
    if (o.state === 'flee') { o.x += o.vx * dt; o.y += o.vy * dt; o.vx *= 1 - dt * 0.8; o.vy *= 1 - dt * 0.8; o.a -= dt * 0.5; if (o.a <= 0) o.state = 'gone'; }
    for (const p of this.snow) { p.y += p.vy * dt; p.ph += dt; if (p.y > 640) { p.y = -10; p.x = rand(0, 1400); } }
  }

  /* ---------- the shark ---------- */
  startShark() {
    const d = this.diver, boatDir = Math.sign(BH.BOATX - d.x) || 1;
    this.shark = { x: clamp(d.x - boatDir * (Game.W * 0.62 + 60), -260, this.WW + 260), y: clamp(d.y + rand(-50, 30), BH.SURF + 60, this.site.floor - 70), ang: boatDir > 0 ? 0 : Math.PI, t: 0, lunge: 0, nextLunge: 3, mouth: 0, state: 'hunt', leaveT: 0 };

  /* ---------- drawing ---------- */
