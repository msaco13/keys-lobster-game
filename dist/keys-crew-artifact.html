    let ak = 1; if (m) ak = m.phase === 'up' ? Math.max(0, 1 - m.t / 0.7) : m.phase === 'go' ? 0 : Math.min(1, m.t / 0.6);
    if (ak > 0.02) {
      const ax = boatX - 92, ay = S + 6, ex = ax - 300 * ak, ey = ay + 260 * ak;
      const ag = ctx.createLinearGradient(ax, ay, ex, ey); ag.addColorStop(0, 'rgba(235,225,195,0.75)'); ag.addColorStop(1, 'rgba(235,225,195,0)');
      ctx.strokeStyle = ag; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(ax - 80 * ak, ay + 140 * ak, ex, ey); ctx.stroke();
    }
    const hand = drawAnglerSide(ctx, this.ch, boatX + 78, S - 8 + bob, 15, { lean: this.slam > 0 ? -0.35 : 0.05, t });
    drawBoatSide(ctx, boatX, S + 6 + bob, 0.55, { flip: true, crew: this.others, t, rot });
    drawWaterline(ctx, Game.W, S, t, 'rgba(255,255,255,0.7)', 2.5);
    const dip = this.slam > 0 ? 34 : this.twitch > 0 ? 12 : 0;
    const tipX = hand.x + 76, tipY = hand.y - 62 + dip;
    ctx.strokeStyle = '#1d1f22'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(hand.x - 14, hand.y + 10); ctx.quadraticCurveTo(hand.x + 40, hand.y - 40 + dip * 0.4, tipX, tipY); ctx.stroke();
    // glow from the deep-drop light
    if (this.baitDepth > 6) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gy = by - 22, gg = ctx.createRadialGradient(bsx, gy, 2, bsx, gy, 120); gg.addColorStop(0, 'rgba(120,230,255,0.24)'); gg.addColorStop(0.4, 'rgba(80,190,230,0.08)'); gg.addColorStop(1, 'rgba(80,190,230,0)');
      ctx.fillStyle = gg; ctx.fillRect(bsx - 120, gy - 120, 240, 240); ctx.restore();
    }
    ctx.strokeStyle = 'rgba(240,240,240,0.78)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.quadraticCurveTo(bsx - 20, S + 10, bsx, by - 14); ctx.stroke();
    // light, sinker, bait, hook
    if (this.baitDepth > 2) { ctx.fillStyle = '#d8fff6'; rr(ctx, bsx - 2, by - 31, 4, 11, 2); ctx.fill(); ctx.fillStyle = 'rgba(120,255,220,0.5)'; ell(ctx, bsx, by - 25.5, 5, 7); ctx.fill(); }
    ctx.fillStyle = '#596067'; ell(ctx, bsx, by - 14, 3, 5); ctx.fill();
    if (this.baitOn) {
      if (this.baitType === 'squid') { ctx.fillStyle = '#f2d6dc'; ctx.beginPath(); ctx.moveTo(bsx, by - 4); ctx.quadraticCurveTo(bsx + 8 + Math.sin(t * 6) * 3, by + 6, bsx + 2, by + 16); ctx.lineTo(bsx - 2, by + 2); ctx.fill(); }
      else { ctx.save(); ctx.translate(bsx + 6, by + 4); drawFish(ctx, 'whitegrunt', 22, { t, wig: 1, speed: 16 }); ctx.restore(); }
    }
    ctx.strokeStyle = '#c9cfd4'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(bsx, by + 2, 4, 0, Math.PI); ctx.stroke();
    // where you're sending it
    if (this.baitOn && !this.reeling && !m) {
      const td = Math.min(this.targetDepth, this.maxDepth()), ty = this.yOf(td);
      if (Math.abs(td - this.baitDepth) > 1.5 || this.drag) { ctx.strokeStyle = 'rgba(255,200,69,0.6)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bsx - 60, ty); ctx.lineTo(bsx + 60, ty); ctx.stroke(); ctx.setLineDash([]); }
    }
    if (this.baitDepth > 2) {
      const onBottom = this.baitDepth >= this.maxDepth() - 0.3;
      text(ctx, Math.round(this.baitDepth) + ' ft' + (onBottom ? ' · bottom' : ''), bsx + 16, by - 10, { size: 15, color: '#fff', weight: 800, stroke: 'rgba(0,0,0,0.55)', sw: 4 });
    }
    const f = this.activeFish();
    if (f && f.state === 'bite') { ctx.strokeStyle = PAL.sun; ctx.lineWidth = 4; const r = 26 + Math.sin(t * 30) * 4; ell(ctx, bsx, by, r, r); ctx.stroke(); }
  }

  /* ---------- HUD: fish finder, bait, moving ---------- */
  drawHud(ctx, W, H) {
    this.drawTopBar(ctx);
    const cw = this.colW(), cx = this.colX(), sw = this.sceneW(), mid = this.baitSX();
    const baitH = 122, sonH = H - 12 - baitH - 10 - 10;
    this.drawSonar(ctx, cx, 10, cw, sonH);
    this.drawBaitPanel(ctx, cx, H - 12 - baitH, cw, baitH);
    // moving the boat
    const mw = Math.min(124, sw * 0.27), my = H - 60, m = this.move;
    UI.button(ctx, 'moveL', 14, my, mw, 46, '◀  Move', () => this.startMove(-1), { style: m && m.dir < 0 ? 'secondary' : 'dark', size: 18, key: 'KeyA|ArrowLeft', disabled: !m && this.bx <= BOT.XMIN + 2 });
    UI.button(ctx, 'moveR', sw - 14 - mw, my, mw, 46, 'Move  ▶', () => this.startMove(1), { style: m && m.dir > 0 ? 'secondary' : 'dark', size: 18, key: 'KeyD|ArrowRight', disabled: !m && this.bx >= BOT.XMAX - 2 });
    // messages sit in open water, clear of the bottom and the buttons
    const my0 = BOT.SURF + 104, maxW = sw - 30;
    const msg = (s) => text(ctx, s, mid, my0, { size: 21, align: 'center', color: '#fff', weight: 800, stroke: 'rgba(0,0,0,0.5)', sw: 5, maxW });
    if (m) msg(m.phase === 'up' ? 'Pulling the anchor…' : m.phase === 'go' ? 'Idling over…' : 'Dropping anchor…');
    else if (!this.baitOn && !this.reeling && this.rebaitT <= 0) UI.button(ctx, 'rebait', mid - 100, my0 - 28, 200, 56, 'REBAIT', () => this.rebait(), { style: 'coral', size: 26, key: 'KeyR|Space|Enter' });
    else if (this.reeling || this.rebaitT > 0) msg(this.reeling ? 'Reeling up…' : 'Baiting the hook…');
    else if (this.t > 1.8 && this.t < 14) {
      const l1 = Game.touch ? 'Drag up or down to set your depth · tap on the BITE' : 'Drag or ↑ ↓ to set depth · Space on the BITE';
      const l2 = Game.touch ? 'Yellow and red marks on the fish finder are fish. None? Move.' : 'Yellow and red marks on the fish finder are fish. None? A / D to move.';
      text(ctx, l1, mid, my0, { size: 17, align: 'center', color: '#fff', weight: 700, alpha: 0.92, stroke: 'rgba(0,0,0,0.55)', sw: 4, maxW });
      text(ctx, l2, mid, my0 + 23, { size: 15, align: 'center', color: '#d8ecf2', weight: 700, alpha: 0.92, stroke: 'rgba(0,0,0,0.55)', sw: 4, maxW });
    } else if (this.quietT > 7) text(ctx, 'Nothing on the fish finder. Try moving the boat.', mid, my0, { size: 17, align: 'center', color: '#d8ecf2', weight: 700, alpha: 0.65 + Math.sin(this.t * 3) * 0.25, stroke: 'rgba(0,0,0,0.55)', sw: 4, maxW });
  }
  drawSonar(ctx, x, y, w, h) {
    const t = this.t, range = this.L.range, cols = this.sonar, last = cols[cols.length - 1];
    // the unit
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; rr(ctx, x, y + 5, w, h, 16); ctx.fill();
    const bz = ctx.createLinearGradient(0, y, 0, y + h); bz.addColorStop(0, '#232b31'); bz.addColorStop(1, '#10161a');
    ctx.fillStyle = bz; rr(ctx, x, y, w, h, 16); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    text(ctx, 'FISH FINDER', x + 14, y + 22, { size: 13, color: '#8fb0bd', weight: 800 });
    if (this.move) text(ctx, ((this.moveV / BOT.SPEED) * 2.6).toFixed(1) + ' kn', x + 14, y + 39, { size: 12, color: '#6f8f9b', weight: 700 });
    else {   // a color key: what's bait, what's a fish, what's a big one
      let lx = x + 14;
      for (const [c, l] of [['#50b9ff', 'bait'], ['#ffe034', 'fish'], ['#ff3b2c', 'big']]) { ctx.fillStyle = c; rr(ctx, lx, y + 31, 7, 7, 2); ctx.fill(); lx += 10; ctx.font = fnt(12, 700); text(ctx, l, lx, y + 39, { size: 12, color: '#8fb0bd', weight: 700 }); lx += ctx.measureText(l).width + 8; }
    }
    text(ctx, (last ? last.bot : this.L.base).toFixed(1), x + w - 34, y + 36, { size: 28, align: 'right', color: '#f4f8fa', weight: 800 });
    text(ctx, 'ft', x + w - 14, y + 36, { size: 14, align: 'right', color: '#8fb0bd', weight: 800 });
    // the screen
    const sx = x + 10, sy = y + 48, sw = w - 20, sh = h - 48 - 54, scaleW = 30, hw = sw - scaleW;
    this.sonarRect = { x: sx, y: sy, w: sw, h: sh, range };
    const Y = (ft) => sy + (ft / range) * sh, n = BOT.COLS, cw = hw / n, off = n - cols.length, X = (i) => sx + (i + off) * cw;
    ctx.save(); rr(ctx, sx, sy, sw, sh, 8); ctx.clip();
    const bg = ctx.createLinearGradient(0, sy, 0, sy + sh); bg.addColorStop(0, '#0d3a8c'); bg.addColorStop(1, '#071d55');
    ctx.fillStyle = bg; ctx.fillRect(sx, sy, sw, sh);
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; for (let ft = 20; ft < range; ft += 20) ctx.fillRect(sx, Y(ft), hw, 1);
    // surface clutter and weak scatter
    ctx.fillStyle = 'rgba(90,200,255,0.55)'; ctx.beginPath();
    for (let i = 0; i < cols.length; i++) { const c = cols[i]; for (const d of c.surf) ctx.rect(X(i), Y(d) - 1, cw + 0.6, 2); for (const d of c.noise) ctx.rect(X(i), Y(d), 1.6, 1.6); }
    ctx.fill();
    // the bottom: a hard red return fading to yellow, green and blue below it
    const bands = [[0, (c) => 1.0 + 2.4 * c.hard, '#ff3b2c'], [(c) => 1.0 + 2.4 * c.hard, (c) => 2.8 + 2.6 * c.hard, '#ff9a20'], [(c) => 2.8 + 2.6 * c.hard, (c) => 5.2 + 2.6 * c.hard, '#ffe034'], [(c) => 5.2 + 2.6 * c.hard, (c) => 8.6 + 2.6 * c.hard, '#4fcf5a'], [(c) => 8.6 + 2.6 * c.hard, () => 60, '#145e86']];
    const fv = (v, c) => (typeof v === 'function' ? v(c) : v);
    for (const [a, b, col] of bands) {
      if (!cols.length) break;
      ctx.fillStyle = col; ctx.beginPath();
      for (let i = 0; i < cols.length; i++) { const c = cols[i], yy = Y(c.bot + fv(a, c)); if (i) ctx.lineTo(X(i), yy); else ctx.moveTo(X(i), yy); ctx.lineTo(X(i) + cw, yy); }
      for (let i = cols.length - 1; i >= 0; i--) { const c = cols[i], yy = Y(c.bot + fv(b, c)); ctx.lineTo(X(i) + cw, yy); ctx.lineTo(X(i), yy); }
      ctx.closePath(); ctx.fill();
    }
    // bait clouds and fish arches: bigger fish paint bigger, redder marks (batched into one path per color)
    const P = { cg: new Path2D(), cb: new Path2D(), g: new Path2D(), y1: new Path2D(), y2: new Path2D(), o: new Path2D(), r: new Path2D() };
    for (let i = 0; i < cols.length; i++) {
      const c = cols[i], px = X(i);
      for (const d of c.cloud) ((d * 7) % 3 < 1 ? P.cg : P.cb).rect(px, Y(d) - 1, cw + 0.8, 2);
      for (const [d, th, s] of c.fish) {
        const yy = Y(d), hp = Math.max(3, (th / range) * sh * 1.25);
        (s < 0.3 ? P.g : P.y1).rect(px, yy - hp / 2, cw + 0.7, hp);
        if (s > 0.15) { const h2 = hp * 0.62; (s < 0.5 ? P.y2 : P.o).rect(px, yy - h2 / 2, cw + 0.7, h2); }
        if (s > 0.42) { const h3 = hp * 0.34; P.r.rect(px, yy - h3 / 2, cw + 0.7, h3); }
      }
    }
    for (const [k, col] of [['cg', 'rgba(120,235,170,0.75)'], ['cb', 'rgba(80,185,255,0.8)'], ['g', '#46d36a'], ['y1', '#ffe034'], ['y2', '#ffe034'], ['o', '#ff9a20'], ['r', '#ff3b2c']]) { ctx.fillStyle = col; ctx.fill(P[k]); }
    // your bait's track
    ctx.strokeStyle = 'rgba(240,248,255,0.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); let pen = false;
    for (let i = 0; i < cols.length; i++) { const c = cols[i]; if (c.bait < 0) { pen = false; continue; } const yy = Y(c.bait); if (pen) ctx.lineTo(X(i) + cw, yy); else ctx.moveTo(X(i), yy); pen = true; }
    ctx.stroke();
    // depth of the strongest mark under the boat right now
    const now = this.sonarMarks(6)[0];
    if (now && now.s > 0.05) text(ctx, Math.round(now.ft) + '′', sx + hw - 10, Y(now.ft) - 7, { size: 13, align: 'right', color: '#fff', weight: 800, stroke: 'rgba(0,10,40,0.8)', sw: 3 });
    // where your bait is headed
    if (!this.move) {
      const td = Math.min(this.targetDepth, this.maxDepth()), ty = Y(td);
      ctx.strokeStyle = 'rgba(255,200,69,0.75)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(sx, ty); ctx.lineTo(sx + hw, ty); ctx.stroke(); ctx.setLineDash([]);
    }
    // depth scale
    ctx.fillStyle = 'rgba(2,12,36,0.6)'; ctx.fillRect(sx + hw, sy, scaleW, sh);
    for (let ft = 0; ft <= range; ft += 20) { const yy = Y(ft); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(sx + hw, yy, 5, 1.5); if (ft) text(ctx, String(ft), sx + sw - 4, yy + 4.5, { size: 12, align: 'right', color: '#e6f0f5', weight: 700 }); }
    if (!this.move) {
      const td = Math.min(this.targetDepth, this.maxDepth()), ty = clamp(Y(td), sy + 9, sy + sh - 9);
      ctx.fillStyle = PAL.sun; ctx.beginPath(); ctx.moveTo(sx + hw - 6, ty); ctx.lineTo(sx + hw + 2, ty - 8); ctx.lineTo(sx + sw, ty - 8); ctx.lineTo(sx + sw, ty + 8); ctx.lineTo(sx + hw + 2, ty + 8); ctx.closePath(); ctx.fill();
      text(ctx, String(Math.round(td)), sx + hw + 16, ty + 1, { size: 13, align: 'center', base: 'middle', color: PAL.ink, weight: 800 });
    }
    // glass
    const gl = ctx.createLinearGradient(sx, sy, sx + sw * 0.6, sy + sh * 0.5); gl.addColorStop(0, 'rgba(255,255,255,0.07)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(sx, sy, sw, sh);
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; rr(ctx, sx, sy, sw, sh, 8); ctx.stroke();
    if (this.move) text(ctx, 'MOVING', sx + 10, sy + 20, { size: 13, color: PAL.sun, weight: 800, stroke: 'rgba(0,0,0,0.5)', sw: 3 });
    if (this.alarmT > 0 && Math.sin(t * 18) > -0.3) {   // fish alarm: something just swam under the boat
      ctx.save(); ctx.translate(sx + hw - 22, sy + 16); ctx.fillStyle = 'rgba(0,10,40,0.7)'; rr(ctx, -17, -10, 34, 20, 8); ctx.fill(); drawFish(ctx, 'mutton', 22, { sil: PAL.sun }); ctx.restore();
    }
    // the track: the bottom you've crossed so far, your catches, and where the boat sits on the strip
    const tx = x + 10, ty = y + h - 46, tw = w - 20, th = 36, [lo, hi] = this.L.track;
    ctx.fillStyle = '#0a1115'; rr(ctx, tx, ty, tw, th, 7); ctx.fill();
    const TX = (wx) => tx + 8 + (wx / BOT.STRIP) * (tw - 16), TY = (ft) => ty + 6 + clamp((ft - lo) / (hi - lo), 0, 1) * (th - 12);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([2, 4]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tx + 8, ty + th - 8); ctx.lineTo(tx + tw - 8, ty + th - 8); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#7fd3ea'; ctx.lineWidth = 1.6; ctx.beginPath(); pen = false;
    for (let i = 0; i < this.track.length; i++) { const v = this.track[i]; if (v == null) { pen = false; continue; } const px = TX(i * 25), py = TY(v); if (pen) ctx.lineTo(px, py); else ctx.moveTo(px, py); pen = true; }
    ctx.stroke();
    for (const wp of this.wps) { ctx.fillStyle = wp.big ? PAL.coral : PAL.sun; ell(ctx, TX(wp.x), ty + 8, 3.2, 3.2); ctx.fill(); }
    const bxp = TX(this.bx), cone = (26 + this.L.base) / BOT.STRIP * (tw - 16);
    ctx.fillStyle = 'rgba(255,200,69,0.18)'; ctx.fillRect(bxp - cone, ty + 3, cone * 2, th - 6);
    ctx.fillStyle = PAL.sun; ctx.beginPath(); ctx.moveTo(bxp - 6, ty + 2); ctx.lineTo(bxp + 6, ty + 2); ctx.lineTo(bxp, ty + 10); ctx.closePath(); ctx.fill();
    ctx.fillRect(bxp - 0.75, ty + 8, 1.5, th - 12);
  }
  drawBaitPanel(ctx, x, y, w, h) {
    panel(ctx, x, y, w, h, { r: 16 });
    const status = !this.baitOn ? (this.reeling || this.rebaitT > 0 ? 'Rebaiting' : 'Hook’s bare') : this.baitDepth >= this.maxDepth() - 0.3 ? 'On the bottom' : this.settled ? 'Fishing ' + Math.round(this.baitDepth) + ' ft' : this.move ? 'Up' : 'Dropping';
    text(ctx, 'BAIT', x + 14, y + 22, { size: 13, color: '#cfe3ea', weight: 800 });
    text(ctx, status, x + w - 14, y + 22, { size: 13, align: 'right', color: this.baitOn ? '#9fb8c2' : PAL.warn, weight: 700 });
    const bw = (w - 28 - 8) / 2, wreck = this.variant === 'wreck';
    UI.button(ctx, 'squid', x + 14, y + 30, bw, 46, 'Squid', () => { if (this.baitType !== 'squid') this.rebait('squid'); }, { style: this.baitType === 'squid' ? 'primary' : 'ghost', size: 18, sub: wreck ? 'muttons' : 'snapper · hogs', key: 'Digit1' });
    UI.button(ctx, 'pinfish', x + 22 + bw, y + 30, bw, 46, 'Pinfish', () => { if (this.baitType !== 'pinfish') this.rebait('pinfish'); }, { style: this.baitType === 'pinfish' ? 'primary' : 'ghost', size: 18, sub: wreck ? 'AJs · big fish' : 'grouper · AJs', key: 'Digit2' });
    const ready = this.chumCd <= 0;
    UI.button(ctx, 'chum', x + 14, y + 84, w - 28, 30, ready ? 'Drop chum' : 'Chum ' + Math.ceil(this.chumCd) + 's', () => this.dropChum(), { style: 'secondary', size: 16, disabled: !ready, key: 'KeyC' });
  }
}

'use strict';
/* Keys Crew — trolling offshore, seen from above. Two spots run on this scene.
   The Weedline (variant 'weed'): sargassum, floating debris and trap floats. Frigate birds circling
   high mean mahi below, diving terns mean bonita and blackfin, a lone log can hold a bull, a tripletail
   can hide under a float, and now and then something hits out of the blue.
   The Hump (variant 'hump'): a seamount where the current rips up over the top. Bait balls up, tuna
   bust under the bird piles, wahoo and amberjack patrol the rip, and the odd billfish shows up.
   Fish stay hidden in deep water until you're close or they light up on a lure: read the signs and
   steer so the spread crosses them. Stay off the trap floats. */

const LURES = [
  { Ld: 170, off: -36, color: '#ff4fa0', head: '#ffd6ea', name: 'Pink skirt' },
  { Ld: 240, off: 36, color: '#36c8ff', head: '#d9f5ff', name: 'Blue ballyhoo' },
  { Ld: 310, off: 0, color: '#ffe14a', head: '#fff7cf', name: 'Shotgun' }
];

/* How each fish behaves behind a boat. notice: how far it sees a lure (px). eager: how keen it is when a lure
   runs right over it (it falls off fast with distance, so the spread has to go through the fish, not past them).
   speed: chase speed. vis: how easy it is to spot from the boat. size: drawn length. */
const TROLL_FISH = {
  mahi: { notice: 46, eager: 5.5, speed: 250, vis: 1, size: 1 },
  tripletail: { notice: 36, eager: 4.5, speed: 170, vis: 0.5, size: 0.85 },
  bonita: { notice: 44, eager: 5, speed: 300, vis: 0.8, size: 0.85 },
  blackfin: { notice: 44, eager: 4.8, speed: 300, vis: 0.85, size: 1 },

  kingfish: { notice: 46, eager: 4.6, speed: 300, vis: 0.75, size: 1.05 },

// Top-down looks. dim: the dark shape you see cruising deep. back/edge: dark back and lighter flanks once it
// lights up on a lure. w: body width / length, ped: tail-stock width, head and tail shapes.
const TROLL_LOOK = {
  mahi: { w: 0.22, ped: 0.14, head: 'blunt', tail: 'fork', dim: '#123f3a', back: '#0d8a66', edge: '#a4ec58', fin: '#2f7fe6', tailC: '#f2d43a' },
  tripletail: { w: 0.4, ped: 0.26, head: 'point', tail: 'round', dim: '#3b3422', back: '#4f4022', edge: '#b9a062', fin: '#4a3c20', tailC: '#5a4a28' },
  bonita: { w: 0.25, ped: 0.1, head: 'point', tail: 'lunate', dim: '#0e2a4c', back: '#1d4472', edge: '#c9d8e4', fin: '#2a4a70', tailC: '#203f66' },

   pushes the skiff along it (◀ ▶, or A / D). Fish are few and hard to see: tails, wakes,
   nervous water, rolling tarpon, pops on the roots and mud puffs give them away, and the poler
   calls what he sees by the clock. Press and hold where you want the fly (the circle tightens),
   release to cast. Lead the fish, strip in its rhythm, and set it when it eats. */

  bridge: { tarpon: 3.2, jack: 2.6, ladyfish: 2.4, snook: 2, mangrove: 2.2, permit: 1.3 },
  glades: { snook: 3.2, redfish: 3, blackdrum: 2.2, tarpon: 1.6, trout: 2.2, jack: 1.6 }

    hint: 'Look for tails and nervous water. I’ll call ’em by the clock.' },
  bridge: { clarity: 0.6, shadow: 0.3, caustic: 0, mud: '#cfd2b4', shadeCol: '#0b2a2a', critters: ['ray', 'cuda', 'turtle'],
    hint: 'Tide’s ripping. Cast up-current of them and let it swing.' },
  glades: { clarity: 0.55, shadow: 0.35, caustic: 0, mud: '#b9a97e', shadeCol: '#191d12', critters: ['ray', 'manatee', 'ray'],

/* ---------- the island chain ---------- */

'use strict';
/* Keys Crew — menus and the trip flow: title, crew pick, turn hand-offs, results,
   end of day, logbook, how to play. The boat ride between spots lives in sea.js. */

const SCENE_FOR = { bughunt: () => BugHuntScene, bottom: () => BottomScene, troll: () => TrollScene, flats: () => FlatsScene };  // keyed by spot mode
const WATER_F = [72, 72, 75, 78, 82, 85, 87, 88, 87, 84, 79, 75];

function launchTurn() {
  const c = Trip.cur, spot = c.spot, ch = c.mode === 'crew' ? c.crew[c.turn] : c.crew[0];
  const S = SCENE_FOR[spotMode(spot)]();
  Game.go(new S({ ch, spot, len: c.sessionLen, weather: c.weather, onEnd: (res) => {
    Trip.record(ch, spot, res);
    // move the trip on as soon as the turn counts, so leaving from the results screen
    // (or closing the tab there) never hands the same angler the same turn twice
    Game.go(new ResultsScene(ch, spot, res, advanceTrip()));
  } }));
}
// where the trip goes after the turn in progress: 'turn' (next angler, same spot), 'sea' or 'home'. Changes nothing.
function tripNext(c) {
  if (c.mode !== 'crew') return 'sea';
  if (c.turn + 1 < c.crew.length) return 'turn';
  return (c.done.includes(c.spot) ? c.done.length : c.done.length + 1) >= c.spotsNeeded ? 'home' : 'sea';
}
// count the finished turn: next angler up, or the spot is done and everyone's back on the boat. Saves.
function advanceTrip() {
  const c = Trip.cur, kind = tripNext(c);

/* ================= RESULTS ================= */
class ResultsScene {
  // next: what advanceTrip() returned when the turn was counted. Without it (a results screen opened by hand)
  // the trip moves on when the player leaves this screen.
  constructor(ch, spot, res, next) {
    this.ch = ch; this.spot = spot; this.res = res; this.t = 0; this.parts = new Particles(); this.shown = 0; this.caption = res.best ? captionFor(res.best, Trip.cur.weather) : null; this.comments = randi(1, 9);
    const c = Trip.cur; this.advanced = !!next; this.nextKind = next || tripNext(c);
    this.nextUp = this.nextKind === 'turn' ? c.crew[this.advanced ? c.turn : c.turn + 1] : null;
  }
  leave(toTitle) { if (this.left) return; this.left = true; if (!this.advanced) advanceTrip(); if (toTitle) Game.go(new TitleScene()); else goNext(this.nextKind); }
  enter() {
    SFX.setAmbient(0.4, false); Music.play('title');
    if (this.res.total > 0) this.parts.burst(Game.W * 0.72, 120, 40, { kind: 'confetti', color: [PAL.sun, PAL.coral, '#42d3c4', '#fff'], min: 100, max: 380, g: 400, lifeMin: 1.4, lifeMax: 2.4, sMin: 3, sMax: 6, drag: 0.5 });
  }
  update(dt) {
    this.t += dt; this.parts.update(dt);
    const n = Math.min(this.res.lines.length, Math.floor(this.t / 0.22));
    if (n > this.shown) { this.shown = n; SFX.play(this.res.lines[n - 1].pts < 0 ? 'warn' : 'tick'); }
  }
  nextLabel() { return this.nextKind === 'turn' ? 'Next up: ' + CHARS[this.nextUp].name : this.nextKind === 'home' ? 'Run home' : 'Back to the boat'; }
  draw(ctx) {
    const W = Game.W, H = Game.H, C = CHARS[this.ch], r = this.res;
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d5f86'); g.addColorStop(1, '#062a3f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const cardW = Math.min(330, W * 0.36), lw = W - cardW - 70;
    text(ctx, r.header || SPOTS[this.spot].name, 30, 52, { display: true, size: 34, color: '#fff', maxW: lw });
    text(ctx, C.name + ' · ' + SPOTS[this.spot].kind, 30, 80, { size: 17, color: C.color, weight: 800 });
    const maxRows = 9, lines = r.lines.slice(0, this.shown), start = Math.max(0, lines.length - maxRows);
    let y = 120;
    if (start > 0) { text(ctx, '… ' + start + ' more above', 30, y - 4, { size: 14, color: '#9fb8c2', weight: 700 }); y += 14; }
    for (let i = start; i < lines.length; i++) {
      const l = lines[i];
      if (l.key) { ctx.save(); ctx.translate(48, y - 6); if (l.key === 'lobster') drawLobsterSide(ctx, 22, {}); else drawFish(ctx, l.key, 36, { wig: 0 }); ctx.restore(); }
      text(ctx, l.label, l.key ? 80 : 30, y, { size: 18, color: l.pts < 0 ? '#ff9a8a' : '#fff', weight: 600, maxW: lw - 130 });
      text(ctx, (l.pts > 0 ? '+' : '') + l.pts, 30 + lw, y, { size: 19, align: 'right', color: l.pts < 0 ? PAL.bad : PAL.sun, weight: 800 });
      y += 34;
    }
    if (!r.lines.length) text(ctx, 'Skunked. The fish won this round.', 30, y, { size: 20, color: '#cfe3ea', weight: 600 });
    const done = this.shown >= r.lines.length;
    if (done) {
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(30, H - 132, lw, 2);
      text(ctx, 'Turn total', 30, H - 96, { size: 22, color: '#fff', weight: 800 });
      text(ctx, r.total.toLocaleString(), 30 + lw, H - 92, { size: 38, align: 'right', color: PAL.sun, weight: 800 });
      const nw = Math.min(320, lw - 110);
      UI.button(ctx, 'next', 30, H - 70, nw, 56, this.nextLabel(), () => this.leave(), { style: 'primary', size: 21, key: 'Enter|Space' });
      UI.button(ctx, 'title', 40 + nw, H - 66, 100, 48, 'Title', () => this.leave(true), { style: 'ghost', size: 17 });
    } else UI.region('skip', 0, 0, W, H, () => { this.t = 99; });
    const cx = W - cardW - 24;
    if (r.best) {
      const ch = bragCardHeight(cardW), s = Math.min(1, (H - 40) / ch);
      ctx.save(); ctx.translate(cx + cardW * (1 - s) / 2, 20); ctx.scale(s, s);
      drawBragCard(ctx, 0, 0, cardW, r.best, { t: this.t, under: spotMode(this.spot) === 'bughunt', place: (SPOTS[this.spot] && SPOTS[this.spot].place) || 'Florida Keys', crew: Trip.cur.crew, caption: this.caption, weather: Trip.cur.weather, comments: this.comments });
      ctx.restore();
    } else {
      panel(ctx, cx, 40, cardW, 300, { r: 18 });
      ctx.save(); ctx.translate(cx + cardW / 2, 200); crewAvatar(ctx, this.ch, 0, -40, 70, { expr: 'smile' }); ctx.restore();
      text(ctx, 'Next time.', cx + cardW / 2, 290, { display: true, size: 28, align: 'center', color: '#fff' });
    }
    this.parts.draw(ctx);
  }
}

/* ================= END OF DAY ================= */
class DayEndScene {
  constructor() {
    this.t = 0; const c = Trip.cur; this.c = c; this.parts = new Particles();
    this.order = c.crew.slice().sort((a, b) => c.scores[b] - c.scores[a]);
    const fish = c.catches.filter((k) => k.key !== 'lobster'), bugs = c.catches.filter((k) => k.key === 'lobster');
    const top = (arr, f) => arr.reduce((b, x) => (!b || f(x) > f(b) ? x : b), null);
    this.awards = [];
    const bf = top(fish, (x) => x.weight); if (bf) this.awards.push(['Biggest fish', bf.ch, bf.name + ' · ' + fmtLb(bf.weight)]);
    const bb = top(bugs, (x) => x.weight); if (bb) this.awards.push(['Biggest bug', bb.ch, (bb.cl ? bb.cl.toFixed(2) + '" · ' : '') + fmtLb(bb.weight)]);
    if (c.crew.length > 1) { const counts = {}; c.catches.forEach((k) => (counts[k.ch] = (counts[k.ch] || 0) + 1)); const mc = c.crew.reduce((b, ch) => ((counts[ch] || 0) > (counts[b] || 0) ? ch : b), c.crew[0]); if (counts[mc]) this.awards.push(['Most catches', mc, counts[mc] + ' landed']); }
  }
  enter() {
    const c = this.c;
    if (c.mode === 'crew') { Records.addTrip({ date: c.date, crew: c.crew, scores: c.scores, winner: this.order[0] }); Trip.clear(); }
    SFX.play('slam'); SFX.setAmbient(0.6, false); Music.play('sunset');
    this.parts.burst(Game.W / 2, 160, 80, { kind: 'confetti', color: [PAL.sun, PAL.coral, '#42d3c4', '#fff'], min: 120, max: 460, g: 380, lifeMin: 1.8, lifeMax: 3, sMin: 3, sMax: 7, drag: 0.5 });
  }
  update(dt) { this.t += dt; this.parts.update(dt); }
  draw(ctx) {
    const W = Game.W, H = Game.H, t = this.t, c = this.c;
    const hz = oceanBackdrop(ctx, W, H, t, 'sunset');
    drawBoatSide(ctx, W * 0.84 - t * 6 % 60, hz + 40, 0.42, { crew: c.crew, t });
    ctx.fillStyle = 'rgba(10,14,40,0.35)'; ctx.fillRect(0, 0, W, H);
    // the high-five
    const hx = W * 0.5, hy = 128;
    if (c.crew.length > 1) {
      const a = this.order[0], b = this.order[1];
      ctx.save(); ctx.translate(hx - 90, hy + 40); drawTorso(ctx, CHARS[a], 0, 20, 90, 70); limb(ctx, [[30, 30], [62, -10], [84, -46]], 14, CHARS[a].shirt); drawHead(ctx, CHARS[a], 0, -8, 28, { expr: 'grin' }); ctx.restore();
      ctx.save(); ctx.translate(hx + 90, hy + 40); drawTorso(ctx, CHARS[b], 0, 20, 90, 70); limb(ctx, [[-30, 30], [-62, -10], [-84, -46]], 14, CHARS[b].sleeve === 'mahi' ? '#5ec05a' : CHARS[b].shirt); drawHead(ctx, CHARS[b], 0, -8, 28, { expr: CHARS[b].expr }); ctx.restore();
      const clap = Math.abs(Math.sin(t * 2.2));
      ctx.fillStyle = CHARS[a].skin; ell(ctx, hx - 6 - clap * 4, hy - 8, 11, 13); ctx.fill(); ctx.fillStyle = CHARS[b].skin; ell(ctx, hx + 6 + clap * 4, hy - 8, 11, 13); ctx.fill();
      if (clap < 0.2) { ctx.strokeStyle = PAL.sun; ctx.lineWidth = 3; for (let i = 0; i < 8; i++) { const an = (i / 8) * TAU; ctx.beginPath(); ctx.moveTo(hx + Math.cos(an) * 20, hy - 8 + Math.sin(an) * 20); ctx.lineTo(hx + Math.cos(an) * 32, hy - 8 + Math.sin(an) * 32); ctx.stroke(); } }
    } else { ctx.save(); ctx.translate(hx, hy + 30); crewAvatar(ctx, c.crew[0], 0, 0, 64, { expr: 'grin' }); ctx.restore(); }
    text(ctx, 'Out. 🙌', hx, 50, { display: true, size: 46, align: 'center', color: '#fff', stroke: '#1d1636', sw: 8 });
    // standings
    const bw = Math.min(380, W * 0.42), bx = 24, by = 262, rowH = 44;
    panel(ctx, bx, by, bw, 50 + this.order.length * rowH, { r: 18 });
    text(ctx, c.mode === 'crew' ? 'FINAL BOARD' : 'YOUR DAY', bx + 18, by + 30, { size: 15, color: '#cfe3ea', weight: 800 });
    this.order.forEach((ch, i) => {
      const y = by + 50 + i * rowH;
      crewAvatar(ctx, ch, bx + 40, y + 10, 19);
      const lead = this.order.length > 1 && c.scores[this.order[0]] > 0, tied = lead && c.scores[this.order[0]] === c.scores[this.order[1]];
      if (i === 0 && lead && !tied) drawCrown(ctx, bx + 40, y - 12, 11);
      text(ctx, CHARS[ch].name, bx + 72, y + 8, { size: 20, color: '#fff', weight: 800 });
      if (i === 0 && lead) text(ctx, tied ? 'Tied at the top' : 'Captain of the Day', bx + 72, y + 28, { size: 14, color: PAL.sun, weight: 800 });
      text(ctx, c.scores[ch].toLocaleString(), bx + bw - 18, y + 16, { size: 24, align: 'right', color: PAL.sun, weight: 800 });
    });
    const ax = W - Math.min(380, W * 0.42) - 24, aw = W - ax - 24;
    panel(ctx, ax, by, aw, 50 + Math.max(1, this.awards.length) * rowH, { r: 18 });
    text(ctx, 'AWARDS', ax + 18, by + 30, { size: 15, color: '#cfe3ea', weight: 800 });
    if (!this.awards.length) text(ctx, 'No fish today. Same time next week?', ax + 18, by + 70, { size: 17, color: '#fff', weight: 600 });
    this.awards.forEach(([title, ch, detail], i) => {
      const y = by + 50 + i * rowH; crewAvatar(ctx, ch, ax + 38, y + 10, 18);
      text(ctx, title + ': ' + CHARS[ch].name, ax + 66, y + 8, { size: 18, color: '#fff', weight: 800, maxW: aw - 80 });
      text(ctx, detail, ax + 66, y + 28, { size: 14, color: '#cfe3ea', weight: 600, maxW: aw - 80 });
    });
    text(ctx, 'Same crew. Same water. See you next season.', W / 2, 86, { size: 18, align: 'center', color: '#ffe3c0', weight: 700, alpha: 0.95 });
    const solo = c.mode !== 'crew';
    UI.button(ctx, 'again', W / 2 - 250, H - 66, 160, 50, solo ? 'New day' : 'New trip', () => Game.go(solo ? new SoloSetupScene() : new CrewSetupScene()), { style: 'primary', size: 19, key: 'Enter' });
    UI.button(ctx, 'log', W / 2 - 80, H - 66, 160, 50, 'Logbook', () => Game.go(new LogbookScene()), { style: 'secondary', size: 19 });
    UI.button(ctx, 'title', W / 2 + 90, H - 66, 160, 50, 'Title', () => Game.go(new TitleScene()), { style: 'ghost', size: 19, key: 'Escape' });
    this.parts.draw(ctx);
  }
}

/* ================= LOGBOOK ================= */
class LogbookScene {
  constructor() { this.t = 0; this.scroll = 0; this.drag = null; this.rec = Records.all(); this.trips = Records.trips(); this.onWheel = (e) => { this.scroll += e.deltaY * 0.6; }; }
  enter() { window.addEventListener('wheel', this.onWheel, { passive: true }); Music.play('title'); }
  exit() { window.removeEventListener('wheel', this.onWheel); }
  pointerDown(p) { this.drag = { id: p.id, y: p.y, s: this.scroll }; }
  pointerMove(p) { if (this.drag && this.drag.id === p.id) this.scroll = this.drag.s - (p.y - this.drag.y); }
  pointerUp() { this.drag = null; }
  keyDown(c) { if (c === 'ArrowDown') this.scroll += 60; if (c === 'ArrowUp') this.scroll -= 60; }
  update(dt) { this.t += dt; }
  draw(ctx) {
    const W = Game.W, H = Game.H;
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#f3ead2'); g.addColorStop(1, '#e2d3ad'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,90,50,0.12)'; ctx.lineWidth = 1; for (let y = 90; y < H; y += 34) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    const lw = Math.min(560, W * 0.58), rows = SPECIES_ORDER.length, contentH = 110 + rows * 40;
    this.scroll = clamp(this.scroll, 0, Math.max(0, contentH - H + 20));
    ctx.save(); ctx.beginPath(); ctx.rect(0, 80, W, H - 80); ctx.clip(); ctx.translate(0, -this.scroll);
    text(ctx, 'PERSONAL BESTS', 30, 112, { size: 15, color: '#7a5a2a', weight: 800 });
    SPECIES_ORDER.forEach((k, i) => {
      const y = 140 + i * 40, r = this.rec[k];
      ctx.globalAlpha = r ? 1 : 0.4;
      ctx.save(); ctx.translate(58, y); if (k === 'lobster') drawLobsterSide(ctx, 26, {}); else drawFish(ctx, k, 44, { wig: 0, sil: r ? null : '#8a7a5a' }); ctx.restore();
      text(ctx, r ? SPECIES[k].name : '???', 100, y + 6, { size: 18, color: '#2a2418', weight: 700 });
      if (r) {
        text(ctx, fmtLb(r.w), 100 + lw * 0.52, y + 6, { size: 18, color: '#b8401f', weight: 800 });
        text(ctx, CHARS[r.ch] ? CHARS[r.ch].name : r.ch, 100 + lw * 0.72, y + 6, { size: 16, color: '#2a2418', weight: 700 });
      }
      ctx.globalAlpha = 1;
    });
    ctx.restore();
    const tx = Math.min(W - 300, 100 + lw + 40), tw = W - tx - 24;
    if (tw > 200) {
      text(ctx, 'RECENT TRIPS', tx, 112, { size: 15, color: '#7a5a2a', weight: 800 });
      if (!this.trips.length) para(ctx, 'Finish a crew trip and it shows up here.', tx, 140, tw, { size: 16, color: '#4a3e2a', weight: 600 });
      this.trips.slice(0, 7).forEach((tr, i) => {
        const y = 140 + i * 56;
        text(ctx, new Date(tr.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }), tx, y + 4, { size: 15, color: '#7a5a2a', weight: 700 });
        text(ctx, (CHARS[tr.winner] ? CHARS[tr.winner].name : tr.winner) + ' took it · ' + tr.crew.map((c) => (CHARS[c] ? CHARS[c].name : c) + ' ' + (tr.scores[c] || 0)).join(' · '), tx, y + 26, { size: 15, color: '#2a2418', weight: 700, maxW: tw });
      });
    }
    ctx.fillStyle = '#0c2734'; ctx.fillRect(0, 0, W, 80);
    text(ctx, 'Logbook', 30, 54, { display: true, size: 36, color: '#fff' });
    text(ctx, 'Saved on this device · ' + Object.keys(this.rec).length + ' of ' + SPECIES_ORDER.length + ' species · ' + Charts.known().size + ' of ' + SPOT_ORDER.length + ' spots found', 210, 52, { size: 15, color: '#9fb8c2', weight: 600, maxW: W - 380 });
    UI.button(ctx, 'back', W - 140, 18, 120, 44, 'Back', () => Game.go(new TitleScene()), { style: 'ghost', size: 18, key: 'Escape' });
  }
}

const HOWTO = [
  { title: 'The trip', art: 'boat', lines: ['Crew Trip: pass one phone around. The captain drives the boat to a spot, then everyone fishes it.', 'Bigger fish and bigger bugs score more. Trophies, slams and clean releases add bonuses.', 'Full day is four spots, half day is two. Then run home at sunset. Most points is Captain of the Day.', 'Each angler has perks. Michael dives longer, Jorge gets more bites, Jemel reels harder.'] },
  { title: 'Running the boat', art: 'boat', lines: ['Hold and drag where you want the boat to go (or ← →). The throttle is on the right: STOP, IDLE, SLOW, CRUISE, FULL.', 'Open the Chart to pick a spot. Set course and the autopilot drives, and you can take over any time.', 'Watch the depth. Light water is shallow: slow down or you run aground. No-wake zones mean SLOW or FWC pulls you over.', 'Only four spots are charted. Find the rest by exploring: run past a ? on the chart to discover it.'] },
  { title: 'Bug Hunt', art: 'lobster', lines: ['Swim down and look for antennae poking out of holes. Not every hole has a bug in it.', 'Hold on the hole (or the TICKLE button) to coax the bug out. When it twitches, let go or it backs in.', 'When it walks out, click or tap the bug to swing your net. If it crouches, it’s about to tail-flip backward.', 'Pro move: put the net down behind it, and it flips right in. Gauge every bug: past the 3" gauge and no eggs.'] },
  { title: 'Bottom fishing', art: 'grouper', lines: ['Watch the fish finder on the right. Arches are fish (red means big), blue speckle is bait.', 'Drag up or down (or on the fish finder) to drop your bait to the marks. Squid for snapper, pinfish for grouper and jacks.', 'Small twitches are nibbles. Wait. When the rod slams down, tap to set the hook.', 'Nothing on the finder? Tap Move ◀ ▶ to idle along the ledge or the wreck until it lights up.'] },
  { title: 'Trolling', art: 'mahi', lines: ['Drag up and down to steer. Your lures follow the path the boat took.', 'Frigate birds and weed lines mean mahi. Diving terns and bait balls mean tuna.', 'The fish are out there, but you have to find them. Read the birds and the weed.', 'Trap floats wrap your prop and foul your lures. Tripletail like to hide under them.'] },
  { title: 'The backcountry', art: 'bonefish', lines: ['Your buddy poles the skiff (◀ ▶ at the bottom right) and calls fish by the clock: 12 is straight ahead.', 'Look for tails, wakes, mud puffs and rolling tarpon. Press and hold where you want the fly, then let go to cast.', 'Land it a few feet in front of the fish. Too close, behind it, or the line across its back, and it spooks.', 'Tap to strip in the fish’s rhythm. When it eats, tap to set. At the bridge, the tide carries your fly.'] },
  { title: 'Fighting a fish', art: 'fight', lines: ['Hold to reel. Keep the drag needle in the green.', 'When it runs, let go. Holding on a hard run snaps the line.', 'When it jumps, let go. That’s bowing to the fish, and it earns a bonus.', 'Too much slack and it spits the hook. Take too long and a shark might take it.'] }
];
class HowToScene {
  constructor() { this.t = 0; this.page = 0; }
  enter() { Music.play('title'); }
  update(dt) { this.t += dt; }
  keyDown(c) { if (c === 'ArrowRight') this.page = Math.min(HOWTO.length - 1, this.page + 1); if (c === 'ArrowLeft') this.page = Math.max(0, this.page - 1); }
  draw(ctx) {
    const W = Game.W, H = Game.H, P = HOWTO[this.page], t = this.t;
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d5f86'); g.addColorStop(1, '#062a3f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    text(ctx, P.title, 40, 70, { display: true, size: 44, color: '#fff' });
    text(ctx, (this.page + 1) + ' / ' + HOWTO.length, W - 40, 66, { size: 18, align: 'right', color: '#9fb8c2', weight: 700 });
    const ax = W * 0.74, ay = H * 0.46;
    drawSunburst(ctx, ax, ay, 220, t, 'rgba(255,200,69,0.1)');
    ctx.save(); ctx.translate(ax, ay);
    if (P.art === 'boat') drawBoatSide(ctx, 0, 60, 0.7, { crew: CHAR_ORDER, t });
    else if (P.art === 'lobster') drawLobsterSide(ctx, 150, { t });
    else if (P.art === 'grouper') drawFish(ctx, 'blackgrouper', 220, { t });
    else if (P.art === 'mahi') drawFish(ctx, 'mahi', 240, { t });
    else if (P.art === 'bonefish') drawFish(ctx, 'bonefish', 210, { t });
    else { drawFish(ctx, 'tarpon', 230, { t }); }
    ctx.restore();
    let y = 130; const mw = W * 0.56;
    P.lines.forEach((l) => { ctx.fillStyle = PAL.sun; ell(ctx, 50, y - 6, 5, 5); ctx.fill(); y += para(ctx, l, 66, y, mw - 30, { size: 19, weight: 600, color: '#fff', lh: 25 }) + 16; });
    UI.button(ctx, 'back', 30, H - 70, 120, 48, 'Done', () => Game.go(new TitleScene()), { style: 'ghost', size: 18, key: 'Escape' });
    // Done (Esc) always leaves; Previous / Next page through, and the last page's button leaves too
    UI.button(ctx, 'prev', W - 290, H - 70, 120, 48, 'Previous', () => (this.page = Math.max(0, this.page - 1)), { style: 'secondary', size: 18, disabled: this.page === 0 });
    if (this.page < HOWTO.length - 1) UI.button(ctx, 'next', W - 160, H - 70, 130, 48, 'Next', () => (this.page += 1), { style: 'primary', size: 18, key: 'Enter|Space' });
    else UI.button(ctx, 'next', W - 160, H - 70, 130, 48, 'Got it', () => Game.go(new TitleScene()), { style: 'primary', size: 18, key: 'Enter|Space' });
  }
}

'use strict';
/* Keys Crew — boot. Waits briefly for the fonts, restores a trip across live updates, starts the title. */
(function boot() {
  const hot = window.claude && window.claude.hot;
  const start = (data) => {
    if (data && data.trip && data.trip.crew) { Trip.cur = data.trip; Trip.save(); }
    Game.init(new TitleScene());
    World.warm();   // build the map in the background while the title screen is up
  };
  const go = () => {
    try { if (hot && hot.snapshot) hot.snapshot(() => ({ trip: Trip.cur && Trip.cur.mode === 'crew' ? Trip.cur : null })); } catch (e) { /* optional */ }
    if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  };
  let fonts = Promise.resolve();
  try {
    if (document.fonts && document.fonts.load) {
      fonts = Promise.race([
        Promise.all([dfnt(40), fnt(20, 500), fnt(20, 700), fnt(20, 800)].map((f) => document.fonts.load(f))),
        new Promise((r) => setTimeout(r, 1500))
      ]);
    }
  } catch (e) { /* fall back to system fonts */ }
  fonts.then(go, go);
})();
