<meta name="theme-color" content="#0c2734">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Keys Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Shrikhand&display=swap">
<style>
  /* One full-screen canvas. The game commits to a single sunlit-water look in both themes. */
  :root { --bg: #041d29; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  html { box-sizing: border-box; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #wrap { position: relative; width: 100%; height: 100%; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Keys Crew, a Florida Keys lobstering and fishing game"></canvas></div>
<script>
/* ---- js/core.js ---- */
'use strict';
/* Keys Crew — core: math helpers, canvas + loop, input, immediate-mode buttons,
   synthesized audio, local storage, particles. Everything is drawn on one canvas
   in a logical space that is always 540 units tall and 720–1280 units wide. */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const approach = (v, target, rate, dt) => v + (target - v) * (1 - Math.exp(-rate * dt));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; t = clamp(t, 0, 1); return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
function angleDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtLb(w) { return (w >= 100 ? Math.round(w) : w.toFixed(1)) + ' lb'; }
function longDate(d = new Date()) { return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }

const FONT_D = '"Shrikhand", Georgia, "Times New Roman", serif';
const FONT_UI = '"Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
const fnt = (size, weight = 700) => `${weight} ${size}px ${FONT_UI}`;
const dfnt = (size) => `400 ${size}px ${FONT_D}`;

// Sun-bleached Keys palette: gelcoat white, deep Gulf Stream navy, lobster orange, sun yellow.
const PAL = {
  ink: '#0c2734', inkSoft: '#355564', panel: 'rgba(7,36,51,0.9)', panelLine: 'rgba(255,255,255,0.16)',
  foam: '#f7f3e8', sand: '#efdcae', coral: '#ff6a3d', sun: '#ffc845', sunDeep: '#c98b12',
  sea: '#0e7fa1', deep: '#08405e', shallow: '#62d0cf', good: '#3ccf7c', warn: '#ffad1f', bad: '#ff4f4f', mute: '#9fb8c2'
};

function text(ctx, s, x, y, o = {}) {
  let size = o.size || 20;
  const setFont = () => { ctx.font = o.display ? dfnt(size) : fnt(size, o.weight || 700); };
  setFont();
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.maxW) { while (size > 8 && ctx.measureText(s).width > o.maxW) { size -= 1; setFont(); } }
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(s, x + (o.sx || 0), y + (o.sy == null ? 3 : o.sy)); }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || 4; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || '#fff';
  ctx.fillText(s, x, y);
  if (o.alpha != null) ctx.globalAlpha = 1;
  return size;
}
function wrapText(ctx, s, maxW) {
  const words = String(s).split(' '); const lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function para(ctx, s, x, y, maxW, o = {}) {
  ctx.font = fnt(o.size || 18, o.weight || 500);
  const lines = wrapText(ctx, s, maxW); const lh = o.lh || (o.size || 18) * 1.3;
  lines.forEach((l, i) => text(ctx, l, x, y + i * lh, Object.assign({}, o, { size: o.size || 18, weight: o.weight || 500 })));
  return lines.length * lh;
}
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(ctx, x, y, w, h, o = {}) {
  ctx.save();
  if (o.shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(ctx, x, y + 5, w, h, o.r || 18); ctx.fill(); }
  ctx.fillStyle = o.fill || PAL.panel; rr(ctx, x, y, w, h, o.r || 18); ctx.fill();
  ctx.strokeStyle = o.line || PAL.panelLine; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

/* ---------- storage (per-browser conveniences only) ---------- */
const Store = {
  get(k, d) { try { const v = window.localStorage.getItem('keyscrew_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { window.localStorage.setItem('keyscrew_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { window.localStorage.removeItem('keyscrew_' + k); } catch (e) { /* storage unavailable */ } }
};

/* ---------- audio: everything is synthesized, nothing to download ---------- */
const SFX = {
  ac: null, master: null, muted: false, nb: null, drag: null, amb: null,
  init() { this.muted = !!Store.get('muted', false); },
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const ac = this.ac = new AC();
      this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.55; this.master.connect(ac.destination);
      const len = ac.sampleRate * 2; const buf = ac.createBuffer(1, len, ac.sampleRate); const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nb = buf;
      // reel drag scream: band-passed noise chopped by a square LFO
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 1.4;
      const am = ac.createGain(); am.gain.value = 0.5;
      const lfo = ac.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 40;
      const lfoG = ac.createGain(); lfoG.gain.value = 0.5; lfo.connect(lfoG); lfoG.connect(am.gain);
      const g = ac.createGain(); g.gain.value = 0;
      src.connect(bp); bp.connect(am); am.connect(g); g.connect(this.master); src.start(); lfo.start();
      this.drag = { g, lfo, bp };
      // ambient wash of the sea
      const s2 = ac.createBufferSource(); s2.buffer = buf; s2.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
      const g2 = ac.createGain(); g2.gain.value = 0;
      s2.connect(lp); lp.connect(g2); g2.connect(this.master); s2.start();
      this.amb = { g: g2, lp };
    } catch (e) { this.ac = null; }
  },
  setMuted(m) { this.muted = m; Store.set('muted', m); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ac.currentTime, 0.05); },
  setDrag(level, pitch = 1) {
    if (!this.drag) return; const t = this.ac.currentTime;
    this.drag.g.gain.setTargetAtTime(clamp(level, 0, 1) * 0.2, t, 0.04);
    this.drag.lfo.frequency.setTargetAtTime(26 + 34 * pitch, t, 0.05);
    this.drag.bp.frequency.setTargetAtTime(2000 + 1400 * pitch, t, 0.05);
  },
  setAmbient(level, under) {
    if (!this.amb) return; const t = this.ac.currentTime;
    this.amb.g.gain.setTargetAtTime(level * 0.06, t, 0.4);
    this.amb.lp.frequency.setTargetAtTime(under ? 240 : 650, t, 0.4);
  },
  tone(f, dur, o = {}) {
    const ac = this.ac; if (!ac || this.muted) return;
    const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = ac.createGain(); const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(dur, o = {}) {
    const ac = this.ac; if (!ac || this.muted || !this.nb) return;
    const t = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(); src.buffer = this.nb;
    const f = ac.createBiquadFilter(); f.type = o.filter || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = ac.createGain(); const v = o.vol == null ? 0.25 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
  },
  steel(f, delay, vol = 0.16) { // steel-pan-ish bell
    this.tone(f, 0.55, { delay, vol, type: 'sine' });
    this.tone(f * 2.01, 0.3, { delay, vol: vol * 0.35, type: 'sine' });
    this.tone(f * 3.9, 0.12, { delay, vol: vol * 0.12, type: 'triangle' });
  },
  play(name) {
    if (!this.ac || this.muted) return;
    switch (name) {
      case 'click': this.tone(700, 0.06, { type: 'triangle', vol: 0.12 }); break;
      case 'splash': this.noise(0.4, { f: 1600, to: 300, vol: 0.32 }); break;
      case 'bigsplash': this.noise(0.8, { f: 1400, to: 200, vol: 0.5 }); this.tone(90, 0.3, { vol: 0.2, to: 50 }); break;
      case 'plop': this.tone(320, 0.09, { to: 110, vol: 0.22 }); this.noise(0.12, { f: 900, vol: 0.08 }); break;
      case 'nibble': this.tone(420, 0.04, { type: 'square', vol: 0.05 }); this.tone(380, 0.04, { type: 'square', vol: 0.05, delay: 0.08 }); break;
      case 'bite': this.tone(150, 0.16, { vol: 0.4, to: 60 }); this.noise(0.1, { f: 400, vol: 0.2 }); break;
      case 'hookset': this.noise(0.14, { filter: 'highpass', f: 1800, vol: 0.25 }); this.tone(220, 0.12, { to: 520, type: 'sawtooth', vol: 0.1 }); break;
      case 'snap': this.noise(0.09, { filter: 'highpass', f: 3000, vol: 0.5 }); this.tone(1300, 0.16, { to: 180, type: 'square', vol: 0.1 }); break;
      case 'catch': [523, 659, 784, 1046].forEach((f, i) => this.steel(f, i * 0.09)); break;
      case 'trophy': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.steel(f, i * 0.1, 0.18)); break;
      case 'coin': this.tone(988, 0.08, { type: 'square', vol: 0.05 }); this.tone(1319, 0.14, { type: 'square', vol: 0.05, delay: 0.07 }); break;
      case 'bubble': this.tone(rand(500, 900), 0.09, { to: 1500, vol: 0.06 }); break;
      case 'warn': this.tone(880, 0.12, { type: 'square', vol: 0.06 }); break;
      case 'sting': this.noise(0.2, { filter: 'highpass', f: 2500, vol: 0.2 }); this.tone(1500, 0.2, { to: 600, type: 'sawtooth', vol: 0.08 }); break;
      case 'chomp': this.tone(110, 0.16, { type: 'sawtooth', vol: 0.18, to: 60 }); this.noise(0.12, { f: 700, vol: 0.25 }); break;
      case 'tickle': this.tone(1700 + Math.random() * 500, 0.03, { type: 'triangle', vol: 0.035 }); break;
      case 'net': this.noise(0.28, { filter: 'bandpass', f: 700, to: 2200, vol: 0.22 }); break;
      case 'fail': this.tone(392, 0.18, { type: 'triangle', vol: 0.12 }); this.tone(330, 0.18, { type: 'triangle', vol: 0.12, delay: 0.16 }); this.tone(247, 0.35, { type: 'triangle', vol: 0.12, delay: 0.32 }); break;
      case 'cast': this.noise(0.32, { filter: 'bandpass', f: 3200, to: 700, vol: 0.14 }); break;
      case 'strip': this.noise(0.05, { filter: 'highpass', f: 2500, vol: 0.05 }); break;
      case 'horn': this.tone(196, 0.5, { type: 'sawtooth', vol: 0.07 }); this.tone(247, 0.5, { type: 'sawtooth', vol: 0.05 }); break;
      case 'tick': this.tone(2300, 0.02, { type: 'square', vol: 0.03 }); break;
      case 'slam': [392, 523, 659, 784, 1046, 1318, 1568].forEach((f, i) => this.steel(f, i * 0.08, 0.2)); break;
    }
  }
};

/* ---------- immediate-mode buttons ---------- */
const BTN = {
  primary: { fill: PAL.sun, shadow: PAL.sunDeep, color: PAL.ink },
  secondary: { fill: PAL.foam, shadow: '#9db3b9', color: PAL.ink },
  coral: { fill: PAL.coral, shadow: '#b8401f', color: '#fff' },
  dark: { fill: 'rgba(8,40,56,0.92)', shadow: 'rgba(0,0,0,0.35)', color: '#fff', line: 'rgba(255,255,255,0.22)' },
  ghost: { fill: 'rgba(255,255,255,0.08)', shadow: 'rgba(0,0,0,0)', color: '#fff', line: 'rgba(255,255,255,0.45)' }
};
const UI = {
  regions: [], prev: [], active: null,
  reset() { this.regions = []; this.prev = []; this.active = null; },
  beginFrame() { this.prev = this.regions; this.regions = []; },
  hit(x, y) {
    for (let i = this.prev.length - 1; i >= 0; i--) {
      const r = this.prev[i];
      if (!r.disabled && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
    }
    return null;
  },
  byId(id) { for (let i = this.prev.length - 1; i >= 0; i--) if (this.prev[i].id === id) return this.prev[i]; return null; },
  region(id, x, y, w, h, fn, o = {}) { this.regions.push({ id, x, y, w, h, fn, key: o.key, disabled: o.disabled }); },
  button(ctx, id, x, y, w, h, label, fn, o = {}) {
    const st = BTN[o.style || 'primary'];
    const pressed = this.active && this.active.id === id && this.active.inside;
    const dy = pressed ? 3 : 0; const r = o.r == null ? Math.min(16, h / 2) : o.r;
    ctx.save();
    if (o.disabled) ctx.globalAlpha = 0.45;
    if (st.shadow !== 'rgba(0,0,0,0)') { ctx.fillStyle = st.shadow; rr(ctx, x, y + 4, w, h, r); ctx.fill(); }
    ctx.fillStyle = o.fill || st.fill; rr(ctx, x, y + dy, w, h, r); ctx.fill();
    if (st.line || o.line) { ctx.strokeStyle = o.line || st.line; ctx.lineWidth = 2; ctx.stroke(); }
    if (o.selected) { ctx.strokeStyle = PAL.sun; ctx.lineWidth = 3; rr(ctx, x - 3, y - 3 + dy, w + 6, h + 6, r + 3); ctx.stroke(); }
    const cx = x + w / 2; let cy = y + h / 2 + dy;
    if (o.icon) { o.icon(ctx, x + h * 0.55, cy, h * 0.5); }
    const tx = o.icon ? x + h * 0.95 + (w - h * 0.95) / 2 : cx;
    if (o.sub) {
      text(ctx, label, tx, cy - 7, { size: o.size || 20, align: 'center', base: 'middle', color: o.color || st.color, weight: 800, maxW: w - 20 });
      text(ctx, o.sub, tx, cy + 13, { size: 13, align: 'center', base: 'middle', color: o.color || st.color, weight: 600, alpha: 0.75, maxW: w - 16 });
    } else {
      text(ctx, label, tx, cy + 1, { size: o.size || 20, align: 'center', base: 'middle', color: o.color || st.color, weight: 800, maxW: w - 18 });
    }
    ctx.restore();
    this.regions.push({ id, x, y, w, h, fn, key: o.key, disabled: o.disabled });
  }
};

/* ---------- particles + floating score text ---------- */
class Particles {
  constructor() { this.list = []; }
  add(p) { this.list.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, t: 0, size: 3, color: '#fff', drag: 0, kind: 'dot', rot: 0, vr: 0 }, p)); }
  burst(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle == null ? rand(0, TAU) : o.angle + rand(-(o.spread || 0.6), o.spread || 0.6);
      const s = rand(o.min || 40, o.max || 160);
      this.add(Object.assign({}, o, { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(o.lifeMin || 0.4, o.lifeMax || 0.9), size: rand(o.sMin || 2, o.sMax || 5), rot: rand(0, TAU), vr: rand(-8, 8), color: Array.isArray(o.color) ? pick(o.color) : o.color }));
    }
  }
  update(dt) {
    for (const p of this.list) {
      p.t += dt; if (p.drag) { p.vx *= 1 - Math.min(1, p.drag * dt); p.vy *= 1 - Math.min(1, p.drag * dt); }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    this.list = this.list.filter((p) => p.t < p.life);
  }
  draw(ctx) {
    for (const p of this.list) {
      const k = 1 - p.t / p.life;
      ctx.globalAlpha = clamp(k * (p.alpha || 1), 0, 1);
      if (p.kind === 'bubble') {
        ctx.strokeStyle = 'rgba(230,250,255,0.9)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(p.x - p.size * 0.35, p.y - p.size * 0.35, p.size * 0.3, 0, TAU); ctx.fill();
      } else if (p.kind === 'ring') {
        ctx.strokeStyle = p.color; ctx.lineWidth = p.lw || 2;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size + p.t * (p.grow || 60), (p.size + p.t * (p.grow || 60)) * (p.flat || 1), 0, 0, TAU); ctx.stroke();
      } else if (p.kind === 'confetti') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8); ctx.restore();
      } else {
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.shrink ? k : 1), 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
}
class Floaters {
  constructor() { this.list = []; }
  add(x, y, s, color = '#fff', size = 22) { this.list.push({ x, y, s, color, size, t: 0 }); }
  update(dt) { for (const f of this.list) f.t += dt; this.list = this.list.filter((f) => f.t < 1.3); }
  draw(ctx) {
    for (const f of this.list) {
      const k = f.t / 1.3; const sc = f.t < 0.15 ? easeBack(f.t / 0.15) : 1;
      ctx.save(); ctx.translate(f.x, f.y - k * 46); ctx.scale(sc, sc);
      text(ctx, f.s, 0, 0, { size: f.size, align: 'center', base: 'middle', color: f.color, stroke: 'rgba(5,30,42,0.85)', sw: 5, weight: 800, alpha: 1 - Math.max(0, k - 0.6) / 0.4 });
      ctx.restore();
    }
  }
}

/* ---------- input ---------- */
const Input = {
  pointers: new Map(), keys: new Set(),
  held(...codes) { for (const c of codes) if (this.keys.has(c)) return true; return false; },
  anyGameplayPointer() { for (const p of this.pointers.values()) if (!p.ui && p.scene === Game.scene) return p; return null; }
};

/* ---------- game shell ---------- */
const Game = {
  W: 960, H: 540, scale: 1, ox: 0, oy: 0, dpr: 1, cw: 1, ch: 1,
  canvas: null, ctx: null, wrap: null, scene: null, t: 0, last: 0,
  fade: 0, fadeDir: 0, next: null, shakeT: 0, shakeAmt: 0, toasts: [],
  reduced: false, portrait: false, touch: false, error: null,

  init(first) {
    const c = this.canvas = document.getElementById('game');
    this.ctx = c.getContext('2d'); this.wrap = c.parentElement;
    this.touch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;

      text(ctx, 'Something broke: ' + String(this.error.message || this.error).slice(0, 120), 12, this.H - 12, { size: 15, color: '#fff' });
    }
    if (this.fade > 0) { ctx.fillStyle = `rgba(3,22,32,${this.fade})`; ctx.fillRect(0, 0, this.W, this.H); }
    ctx.restore();

  },
  drawToasts(ctx) {

      const h = t.size + (t.sub ? 34 : 12);

      for (let guard = 0; guard < 6; guard++) { const hit = placed.find((p) => Math.abs(p.y - y) < (p.h + h) / 2); if (!hit) break; y = hit.y + (hit.h + h) / 2 + 4; }

      ctx.restore();
    }
  }
};

function rollWeight(key, perks) {
  const sp = SPECIES[key]; const k = 2.3 / ((perks && perks.trophy) || 1);
  const r = Math.pow(Math.random(), k);
  return Math.round((sp.min + (sp.max - sp.min) * r) * 10) / 10;
}
function sizeNorm(key, w) { const sp = SPECIES[key]; return clamp((w - sp.min) / (sp.max - sp.min), 0, 1); }

// Build a scored catch record. extras: [{label, pts}]
function makeCatch(key, weight, ch, spot, extras = []) {
  const sp = SPECIES[key];
  const lines = [{ label: fmtLb(weight) + ' × ' + sp.mult, pts: Math.round(weight * sp.mult) }];
  const trophy = sizeNorm(key, weight) >= 0.72;
  if (trophy) lines.push({ label: 'Trophy', pts: Math.round(weight * sp.mult * 0.2) });
  if (sp.release && sp.relBonus) lines.push({ label: 'Clean release', pts: sp.relBonus });
  for (const e of extras) lines.push(e);
  const pts = lines.reduce((a, l) => a + l.pts, 0);
  return { key, name: sp.name, weight, ch, spot, trophy, released: !!sp.release, lines, pts, at: Date.now() };
}

/* ---------- trip state (saved after every turn so a phone nap doesn't wipe the day) ---------- */
const Trip = {
  cur: null,
  start(o) {
    const scores = {}; o.crew.forEach((c) => (scores[c] = 0));
    this.cur = {
      id: Date.now(), mode: o.mode, crew: o.crew.slice(), plan: o.plan,
      spotsNeeded: o.plan === 'full' ? 4 : o.plan === 'half' ? 2 : 0,
      sessionLen: o.sessionLen, weather: rollWeather(), date: new Date().toISOString(),
      done: [], spot: null, turn: 0, scores, catches: [], turns: []
    };
    this.save();
  },
  save() { if (this.cur && this.cur.mode === 'crew') Store.set('trip', this.cur); },
  load() { const t = Store.get('trip', null); return t && t.crew && t.scores ? t : null; },
  resume() { this.cur = this.load(); return !!this.cur; },
  clear() { Store.del('trip'); },
  get player() { return this.cur.crew[this.cur.turn]; },
  record(ch, spot, res) {
    const c = this.cur; c.scores[ch] = (c.scores[ch] || 0) + res.total;
    for (const k of res.catches) c.catches.push(k);
    c.turns.push({ ch, spot, total: res.total, n: res.catches.length });
    Records.add(res.catches);
    this.save();
  },
  leader() {
    const c = this.cur; let best = null;
    for (const ch of c.crew) if (!best || c.scores[ch] > c.scores[best]) best = ch;
    return best;
  }
};

const Records = {
  all() { return Store.get('records', {}); },
  add(catches) {
    const rec = this.all(); let changed = false;
    for (const k of catches) {
      if (!k || !k.weight || k.fine) continue;
      const r = rec[k.key];
      if (!r || k.weight > r.w) { rec[k.key] = { w: k.weight, ch: k.ch, date: new Date().toISOString() }; changed = true; k.pb = true; }
    }
    if (changed) Store.set('records', rec);
  },
  isRecord(key, w) { const r = this.all()[key]; return !r || w > r.w; },
  trips() { return Store.get('trips', []); },
  addTrip(t) { const list = this.trips(); list.unshift(t); Store.set('trips', list.slice(0, 12)); }
};

'use strict';
/* Keys Crew — the fish fight. Shared by bottom fishing, trolling and the flats.
   Hold to reel. Let go when it runs. Bow when it jumps. Turn grouper off the reef. */

const LOSS_TEXT = {
  snap: ['SNAP!', 'Too much pressure while it was running. Let go on the runs.'],
  slack: ['Spit the hook', 'Too much slack. Keep reeling between runs.'],
  jump: ['Threw the hook!', 'Let go when it jumps. Bow to the fish.'],
  rock: ['Rocked up!', 'It made the reef and cut you off. Tap faster to turn it.'],
  mangrove: ['In the mangroves!', 'It wrapped you in the roots. Tap faster to turn it.'],
  tax: ['Taxed!', 'A shark ate your fish. Only the head came back.'],
  spool: ['Spooled!', 'It took every inch of line.']
};

class FightScene {
  constructor(o) {
    this.o = o; this.key = o.sp; this.sp = SPECIES[o.sp]; this.ch = o.ch; this.C = CHARS[o.ch]; this.perks = this.C.perks;
    this.weight = o.weight; this.wn = sizeNorm(o.sp, o.weight);
    this.pw = clamp(this.sp.pow * (0.62 + 0.48 * this.wn), 0.2, 1.05);
    this.staminaSec = this.sp.stam * (0.7 + 0.8 * this.wn);
    this.kind = o.ctxType || 'offshore';
    this.d0 = this.kind === 'reef' ? (o.depth || 90) : this.kind === 'flats' ? rand(35, 50) + 25 * this.wn : rand(50, 70) + 30 * this.wn;
    this.dist = this.d0; this.maxDist = this.d0 + 130; this.unit = this.kind === 'reef' ? 'ft' : 'yds';
    this.S = 1; this.T = 0.45; this.t = 0; this.fightT = 0;
    const rock = o.rock != null ? o.rock : (this.kind === 'reef' ? (this.sp.rock || 0) : 0);
    this.rockStr = rock; this.phase = rock > 0 ? 'turn' : 'fight'; this.rockBar = 0.45; this.turnGrace = 0.7;
    this.running = false; this.runT = 0; this.runStr = 1; this.restT = rand(0.9, 1.6); this.tele = false;
    this.jumpT = 0; this.jumpDelay = 0; this.jumpHold = 0; this.jumps = 0; this.bows = 0; this.jumpX = 0;
    this.slackT = 0; this.snapT = 0; this.revealed = false;
    this.taxRisk = this.kind !== 'flats' && chance(0.22); this.shark = null;
    this.parts = new Particles(); this.fl = new Floaters();
    this.overT = 0; this.won = false; this.reason = null; this.catch = null; this.landT = 0; this.crankFx = 0;
    this.fx = 0; this.fy = 0; this.fang = 0;
  }
  enter() {
    Game.toasts = [];
    SFX.play('hookset'); Game.vibrate(60);
    Game.toast('FISH ON!', { color: PAL.sun, size: 48, dur: 1.3, y: 120 });
    if (this.phase === 'turn') Game.toast(this.kind === 'flats' ? 'Heading for the roots!' : 'Diving for the reef!', { size: 26, color: '#fff', dur: 1.6, y: 175 });
  }
  exit() { SFX.setDrag(0); }
  holding() { return Input.held('Space', 'ArrowDown', 'KeyS', 'Enter') || !!Input.anyGameplayPointer(); }
  pointerDown() { this.tap(); }
  keyDown(c) { if (['Space', 'ArrowDown', 'KeyS', 'Enter'].includes(c)) this.tap(); }
  tap() {
    if (this.phase === 'turn') { this.rockBar += 0.05 * this.perks.reel; this.crankFx = 0.15; SFX.play('tick'); }
    else if (this.phase === 'over' && this.overT > 0.9) this.finish();
  }
  finish() { if (this.finished) return; this.finished = true; SFX.setDrag(0); this.o.onDone({ ok: this.won, catch: this.catch, reason: this.reason }); }

  update(dt) {
    this.t += dt; this.parts.update(dt); this.fl.update(dt); this.crankFx = Math.max(0, this.crankFx - dt);
    if (this.o.tick) this.o.tick(dt);
    if (this.phase === 'over') { this.overT += dt; if (this.overT > (this.won ? 7 : 3.5)) this.finish(); return; }
    if (this.phase === 'landing') { this.landT += dt; this.fightAnim(dt, false); if (this.landT > 0.9) this.toOver(); return; }

      if (hold) this.rockBar += dt * 0.2 * this.perks.reel;
      this.T = approach(this.T, hold ? 0.8 : 0.55, 6, dt);
      SFX.setDrag(0.5, 0.7);

    if (this.running) {

      if (this.runT <= 0) { this.running = false; this.restT = rand(1.1, 2.6) * (1.25 - this.pw * 0.45) * (1 + (1 - S) * 0.8); }
    } else {
      this.restT -= dt;

      if (this.restT <= 0) {

        this.runT = rand(0.8, 2.0) * (0.55 + this.pw) * (0.5 + 0.5 * S); this.runStr = rand(0.88, 1.1);
        if (sp.jump && this.jumps < 5 && chance(sp.jump * (0.4 + 0.6 * S))) this.jumpDelay = rand(0.15, 0.45);

    if (this.jumpT > 0) { this.jumpT -= dt; if (hold) this.jumpHold += dt; if (this.jumpT <= 0) { this.endJump(); if (this.phase === 'over') return; } }
    if (!this.revealed && (this.dist < this.d0 * 0.45 || this.jumpT > 0)) { this.revealed = true; Game.toast(`It's a ${sp.short.toLowerCase()}!`, { color: '#fff', size: 30, y: 120 }); }
    if (this.taxRisk && !this.shark && this.fightT > 16) { this.shark = { t: 10, a: 0 }; Game.toast('SHARK!', { color: '#dfe6ea', size: 42, y: 130, sub: 'Get it in before the tax man does' }); SFX.play('warn'); }
    if (this.shark) { this.shark.t -= dt; this.shark.a += dt; if (this.shark.t <= 0) return this.lose('tax'); }
    SFX.setDrag(this.running ? (hold ? 0.9 : 0.7) : hold ? 0.12 : 0, this.running ? 1 : 0.4);
    this.fightAnim(dt, hold);
    if (this.dist <= 0.5) this.land();
  }
  startJump() {
    this.jumpT = 1.15; this.jumpHold = 0; this.jumps++;
    SFX.play('bigsplash'); Game.vibrate(40);
    this.parts.burst(this.fx, this.waterY(), 22, { color: ['#ffffff', '#cfefff'], angle: -Math.PI / 2, spread: 1.0, min: 120, max: 320, g: 600, sMin: 2, sMax: 5 });
  }
  endJump() {
    this.parts.burst(this.fx, this.waterY(), 26, { color: ['#ffffff', '#cfefff'], angle: -Math.PI / 2, spread: 1.1, min: 100, max: 300, g: 600 });
    SFX.play('splash');
    if (this.jumpHold > 0.3 && chance(0.7)) { this.lose('jump'); return; }
    if (this.jumpHold <= 0.3) { this.bows++; this.fl.add(this.fx, this.waterY() - 60, 'Bowed! +40', PAL.sun, 24); SFX.play('coin'); }
  }
  land() {
    this.phase = 'landing'; this.landT = 0; this.running = false; SFX.setDrag(0); SFX.play('bigsplash');
    this.parts.burst(this.fx, this.waterY(), 30, { color: ['#ffffff', '#bfe9ff'], angle: -Math.PI / 2, spread: 1.2, min: 80, max: 260, g: 600 });
  }
  toOver() {
    const extras = [];
    if (this.bows) extras.push({ label: 'Bowed to the jump × ' + this.bows, pts: this.bows * 40 });
    if (this.shark) extras.push({ label: 'Beat the shark', pts: 75 });
    this.catch = makeCatch(this.key, this.weight, this.ch, this.o.spot, extras);
    this.isPB = Records.isRecord(this.key, this.weight);
    this.won = true; this.phase = 'over'; this.overT = 0;
    SFX.play(this.catch.trophy ? 'trophy' : 'catch'); Game.vibrate([30, 40, 30]);
    this.confetti = new Particles();
    this.confetti.burst(Game.W / 2, 200, 60, { kind: 'confetti', color: [PAL.sun, PAL.coral, '#42d3c4', '#ffffff'], min: 120, max: 420, g: 420, lifeMin: 1.4, lifeMax: 2.4, sMin: 3, sMax: 6, drag: 0.6 });
  }
  lose(reason) {
    this.reason = reason; this.won = false; this.phase = 'over'; this.overT = 0; SFX.setDrag(0);
    SFX.play(reason === 'snap' ? 'snap' : 'fail'); if (reason === 'tax') SFX.play('chomp');

  /* ----- layout + animation ----- */
  waterY() { return this.kind === 'reef' ? 236 : this.kind === 'flats' ? 300 : 270; }
  anglerX() { return this.kind === 'flats' ? 150 : 200; }
  fightAnim(dt) {
    const W = Game.W, wy = this.waterY();
    const x0 = this.anglerX() + 170, x1 = W - 130;
    let fx, fy;
    const frac = clamp(this.dist / (this.d0 * 1.35), 0, 1);
    if (this.kind === 'reef') {
      fx = lerp(x0 + 40, x1 - 120, 0.45) + Math.sin(this.t * 0.9) * 50 * (this.running ? 1.4 : 0.6);
      fy = wy + 30 + (this.dist / this.maxDist) * (Game.H - wy - 40) * 1.25;
      fy = Math.min(fy, Game.H - 40);
      if (this.phase === 'turn') fy = Game.H - 60 - this.rockBar * 120;
    } else {
      fx = lerp(x0, x1, frac) + Math.sin(this.t * 1.7) * 18;
      fy = wy + (this.kind === 'flats' ? 22 : 45) + Math.sin(this.t * 2.3) * 10;
      if (this.phase === 'turn') { fx = lerp(x0, x1, frac) + 20; fy = wy + 26; }
    }

  draw(ctx) {

    } else {

      const g = ctx.createLinearGradient(0, wy, 0, H);

      else { g.addColorStop(0, '#155ea8'); g.addColorStop(1, '#062a52'); }

        ctx.fillStyle = '#3e3a30'; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 26 - Math.sin(x * 0.02) * 12 - (x > W * 0.45 && x < W * 0.8 ? 40 : 0)); ctx.lineTo(W, H); ctx.fill();

  }
  drawRig(ctx, W, H, wy, t, lean) {
    const ax = this.anglerX();
    let hand;
    if (this.kind === 'flats') {
      hand = drawAnglerSide(ctx, this.ch, ax + 40, wy - 14, 20, { lean, t, crank: this.holding() });
      ctx.fillStyle = '#f4f5f2'; ctx.beginPath(); ctx.moveTo(-40, wy - 14); ctx.lineTo(ax + 120, wy - 12); ctx.quadraticCurveTo(ax + 140, wy - 12, ax + 150, wy - 20); ctx.lineTo(ax + 120, wy + 8); ctx.lineTo(-40, wy + 8); ctx.closePath(); ctx.fill();

  rodTip(hand) {

  drawFishBody(ctx, wy) {

  drawHud(ctx, W, H) {

    text(ctx, 'FISH', 252, 84, { size: 13, align: 'right', color: '#9fb8c2', weight: 800 });
    if (this.o.timeLeft) { const tl = this.o.timeLeft(); drawTimerPill(ctx, W / 2, 34, tl); }
    // tension meter
    const mx = W - 62, my0 = 96, my1 = 400, mh = my1 - my0, L = this.perks.line, scale = 1.25;
    const yOf = (v) => my1 - (v / scale) * mh;
    panel(ctx, mx - 30, my0 - 40, 60, mh + 70, { r: 16 });
    text(ctx, 'DRAG', mx, my0 - 18, { size: 15, align: 'center', color: '#cfe3ea', weight: 800 });
    ctx.fillStyle = 'rgba(120,170,200,0.35)'; ctx.fillRect(mx - 12, yOf(0.12), 24, yOf(0) - yOf(0.12));
    ctx.fillStyle = 'rgba(60,207,124,0.55)'; ctx.fillRect(mx - 12, yOf(0.86 * L), 24, yOf(0.38) - yOf(0.86 * L));
    ctx.fillStyle = 'rgba(255,79,79,0.6)'; ctx.fillRect(mx - 12, yOf(scale), 24, yOf(L) - yOf(scale));
    ctx.fillStyle = 'rgba(255,173,31,0.45)'; ctx.fillRect(mx - 12, yOf(L), 24, yOf(0.86 * L) - yOf(L));
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(mx - 12, my0, 24, mh);
    const ny = yOf(clamp(this.T, 0, scale));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(mx - 22, ny); ctx.lineTo(mx - 12, ny - 7); ctx.lineTo(mx - 12, ny + 7); ctx.fill();
    ctx.fillRect(mx - 12, ny - 2, 24, 4);
    // prompt
    let msg = 'HOLD TO REEL', col = '#fff';
    const danger = this.T > 0.86 * L, slack = this.slackT > 0.6;
    if (this.phase === 'turn') { msg = 'TAP TAP TAP! TURN IT!'; col = PAL.sun; }
    else if (this.jumpT > 0) { msg = 'IT JUMPED! LET GO!'; col = PAL.sun; }
    else if (this.running) { msg = danger ? 'LET GO! IT’S RUNNING' : 'IT’S RUNNING · LET IT GO'; col = danger ? PAL.bad : PAL.warn; }
    else if (this.tele) { msg = 'GET READY…'; col = PAL.warn; }
    else if (slack) { msg = 'SLACK! REEL!'; col = '#9fe0ff'; }
    else if (danger) { msg = 'TOO TIGHT!'; col = PAL.bad; }
    const pw = Math.min(W - 180, 460);
    panel(ctx, W / 2 - pw / 2, H - 70, pw, 52, { r: 26 });
    const pulse = (this.running || this.jumpT > 0 || this.phase === 'turn') ? 1 + Math.sin(this.t * 14) * 0.04 : 1;
    ctx.save(); ctx.translate(W / 2, H - 43); ctx.scale(pulse, pulse);
    text(ctx, msg, 0, 0, { size: 26, align: 'center', base: 'middle', color: col, weight: 800, maxW: pw - 30 });
    ctx.restore();
    if (this.phase === 'turn') {
      const bw = Math.min(420, W - 200), bx = W / 2 - bw / 2, by = H - 128;
      panel(ctx, bx - 14, by - 34, bw + 28, 74, { r: 16 });
      text(ctx, this.kind === 'flats' ? 'KEEP IT OUT OF THE MANGROVES' : 'PULL IT OFF THE BOTTOM', W / 2, by - 12, { size: 16, align: 'center', color: '#cfe3ea', weight: 800 });
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; rr(ctx, bx, by, bw, 20, 10); ctx.fill();
      ctx.fillStyle = this.rockBar < 0.25 ? PAL.bad : PAL.good; rr(ctx, bx, by, bw * clamp(this.rockBar, 0, 1), 20, 10); ctx.fill();
      if (this.crankFx > 0) { ctx.strokeStyle = PAL.sun; ctx.lineWidth = 3; rr(ctx, bx - 3, by - 3, bw + 6, 26, 12); ctx.stroke(); }
    }
  }
  drawOver(ctx, W, H) {
    const k = easeOut(this.overT / 0.35);
    ctx.fillStyle = `rgba(4,26,38,${0.72 * k})`; ctx.fillRect(0, 0, W, H);
    if (!this.won) {
      const [title, sub] = LOSS_TEXT[this.reason] || ['Lost it', ''];
      ctx.save(); ctx.translate(W / 2, H / 2 - 30); ctx.scale(easeBack(Math.min(1, this.overT / 0.3)), easeBack(Math.min(1, this.overT / 0.3)));
      text(ctx, title, 0, 0, { display: true, size: 60, align: 'center', base: 'middle', color: PAL.coral, stroke: '#04202d', sw: 10 });
      ctx.restore();
      text(ctx, sub, W / 2, H / 2 + 30, { size: 22, align: 'center', color: '#fff', weight: 600, maxW: W - 80 });
      if (this.overT > 0.9) text(ctx, Game.touch ? 'Tap to keep fishing' : 'Click or press Space to keep fishing', W / 2, H / 2 + 80, { size: 18, align: 'center', color: '#cfe3ea', weight: 700, alpha: 0.6 + Math.sin(this.t * 4) * 0.3 });
      return;
    }
    const c = this.catch;
    drawSunburst(ctx, W * 0.32, H * 0.5, 420, this.t, 'rgba(255,200,69,0.16)');
    if (this.confetti) { this.confetti.update(1 / 60); this.confetti.draw(ctx); }
    const sc = easeBack(Math.min(1, this.overT / 0.4));
    ctx.save(); ctx.translate(W * 0.32, H * 0.42); ctx.scale(sc, sc);
    drawHeroShot(ctx, this.ch, { kind: 'fish', key: this.key, weight: this.weight }, 0, 0, 36, this.t);
    ctx.restore();
    const px = W * 0.58, pw = Math.min(W * 0.38, 420);
    text(ctx, c.name, px, 120, { display: true, size: 40, color: '#fff', stroke: '#04202d', sw: 8, maxW: pw });
    text(ctx, fmtLb(c.weight), px, 172, { size: 44, color: PAL.sun, weight: 800, stroke: '#04202d', sw: 6 });
    let y = 210;
    const tags = [];
    if (c.trophy) tags.push(['TROPHY', PAL.coral]);
    if (this.isPB) tags.push(['NEW PERSONAL BEST', '#42d3c4']);
    if (c.released) tags.push(['RELEASED', '#7fd98f']);
    let tx = px;
    ctx.font = fnt(15, 800);
    for (const [tg, col] of tags) { const tw = ctx.measureText(tg).width + 22; ctx.fillStyle = col; rr(ctx, tx, y, tw, 28, 14); ctx.fill(); text(ctx, tg, tx + tw / 2, y + 15, { size: 15, align: 'center', base: 'middle', color: '#04202d', weight: 800 }); tx += tw + 8; }
    y += tags.length ? 52 : 18;
    for (const l of c.lines) { text(ctx, l.label, px, y, { size: 19, color: '#cfe3ea', weight: 600 }); text(ctx, '+' + l.pts, px + pw, y, { size: 19, align: 'right', color: '#fff', weight: 800 }); y += 28; }
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(px, y - 14, pw, 2);
    text(ctx, 'Total', px, y + 14, { size: 22, color: '#fff', weight: 800 });
    text(ctx, '+' + c.pts, px + pw, y + 14, { size: 28, align: 'right', color: PAL.sun, weight: 800 });
    if (this.overT > 0.9) text(ctx, Game.touch ? 'Tap to keep fishing' : 'Click or press Space to keep fishing', W / 2, H - 26, { size: 18, align: 'center', color: '#cfe3ea', weight: 700, alpha: 0.6 + Math.sin(this.t * 4) * 0.3 });
  }
}

function drawTimerPill(ctx, x, y, secs) {
  const low = secs <= 10;
  panel(ctx, x - 58, y - 20, 116, 40, { r: 20, fill: low ? 'rgba(160,30,30,0.92)' : PAL.panel });
  text(ctx, fmtTime(secs), x, y + 1, { size: 24, align: 'center', base: 'middle', color: low ? '#fff' : PAL.sun, weight: 800 });
}

/* ---- js/session.js ---- */
'use strict';
/* Keys Crew — shared plumbing for a timed turn at a spot: clock, pause, top bar,
   running a fish fight on top of the spot, and packaging the results. */

class SessionBase {
  constructor(o) {
    this.o = o; this.ch = o.ch; this.C = CHARS[o.ch]; this.perks = this.C.perks; this.spot = o.spot;
    this.weather = o.weather || { id: 'light', name: 'Light chop', vis: 1, drift: 0.5, aim: 1 };
    this.len = o.len || 120; this.timeLeft = this.len; this.t = 0;
    this.paused = false; this.ended = false; this.endT = 0; this.endReason = null;
    this.catches = []; this.extraLines = []; this.score = 0;
    this.parts = new Particles(); this.fl = new Floaters(); this.child = null;
  }
  tickTime(dt) {
    if (this.timeLeft <= 0) return;
    const before = this.timeLeft; this.timeLeft = Math.max(0, this.timeLeft - dt);
    if (before > 10 && this.timeLeft <= 10) { Game.toast('10 seconds left!', { color: PAL.sun, size: 30, y: 110 }); SFX.play('warn'); }
    if (this.timeLeft <= 0 && this.child) Game.toast('Last fish! Land it!', { color: PAL.sun, size: 30, y: 110 });
  }
  addCatch(c) { this.catches.push(c); this.score += c.pts; }
  addLine(label, pts) { this.extraLines.push({ label, pts }); this.score += pts; }
  startFight(opts) {
    const fs = new FightScene(Object.assign({
      ch: this.ch, spot: this.spot, weather: this.weather,
      tick: (dt) => this.tickTime(dt), timeLeft: () => this.timeLeft,
      onDone: (r) => { this.child = null; if (r.ok) this.addCatch(r.catch); if (this.onFightDone) this.onFightDone(r); if (this.timeLeft <= 0) this.end('time'); }
    }, opts));
    this.child = fs; fs.enter();
  }
  end(reason) {
    if (this.ended) return;
    this.ended = true; this.endT = 0; this.endReason = reason; SFX.setDrag(0);
    const msg = reason === 'limit' ? 'Limited out!' : reason === 'quit' ? 'Heading in' : 'Time’s up!';
    Game.toast(msg, { color: PAL.sun, size: 52, dur: 1.6, y: Game.H / 2 - 20 });
    SFX.play('horn');
  }
  buildResult() {
    const lines = this.catches.map((c) => ({ label: c.name + ' · ' + fmtLb(c.weight), pts: c.pts, key: c.key, trophy: c.trophy }));
    for (const l of this.extraLines) lines.push(l);
    const total = Math.max(0, lines.reduce((a, l) => a + l.pts, 0));
    let best = null; for (const c of this.catches) if (!best || c.pts > best.pts) best = c;
    return { catches: this.catches, lines, total, best, header: this.resultHeader || null };
  }
  finish() { if (this.finished) return; this.finished = true; SFX.setDrag(0); SFX.setAmbient(0); this.o.onEnd(this.buildResult()); }
  // returns true when the subclass should skip its own update
  baseUpdate(dt) {
    if (this.child) { this.child.update(dt); return true; }
    if (this.paused) return true;
    this.t += dt; this.parts.update(dt); this.fl.update(dt);
    if (this.ended) { this.endT += dt; if (this.endT > 1.7) this.finish(); return true; }
    this.tickTime(dt);
    if (this.timeLeft <= 0 && !this.child) { this.end('time'); return true; }
    return false;
  }
  togglePause() { if (this.ended || this.child) return; this.paused = !this.paused; SFX.setDrag(0); }
  basePointerDown(p) { if (this.child) { this.child.pointerDown(p); return true; } return this.paused || this.ended; }
  baseKeyDown(c) {
    if (this.child) { this.child.keyDown(c); return true; }
    if (c === 'Escape' || c === 'KeyP') { this.togglePause(); return true; }
    return this.paused || this.ended;
  }
  drawTopBar(ctx) {
    const W = Game.W;
    UI.button(ctx, 'pause', 14, 12, 46, 46, '❚❚', () => this.togglePause(), { style: 'dark', size: 16, r: 14 });
    panel(ctx, 70, 12, 196, 46, { r: 23 });
    ctx.save(); ell(ctx, 93, 35, 19, 19); ctx.clip(); ctx.fillStyle = '#7fc8e8'; ctx.fillRect(70, 12, 46, 46); drawHead(ctx, this.C, 93, 40, 15); ctx.restore();
    ctx.strokeStyle = this.C.color; ctx.lineWidth = 2.5; ell(ctx, 93, 35, 19, 19); ctx.stroke();
    text(ctx, this.C.name, 120, 31, { size: 17, weight: 800, color: '#fff' });
    text(ctx, this.score.toLocaleString() + ' pts', 120, 50, { size: 15, weight: 700, color: PAL.sun });
    drawTimerPill(ctx, W / 2, 35, this.timeLeft);
  }
  drawPause(ctx) {
    const W = Game.W, H = Game.H;
    ctx.fillStyle = 'rgba(3,22,32,0.78)'; ctx.fillRect(0, 0, W, H);
    text(ctx, 'Paused', W / 2, 150, { display: true, size: 54, align: 'center', color: '#fff' });
    text(ctx, SPOTS[this.spot].name + ' · ' + fmtTime(this.timeLeft) + ' left', W / 2, 192, { size: 20, align: 'center', color: '#cfe3ea', weight: 600 });
    UI.button(ctx, 'resume', W / 2 - 130, 236, 260, 56, 'Resume', () => { this.paused = false; }, { key: 'Escape|Enter|Space', size: 22 });
    UI.button(ctx, 'mute', W / 2 - 130, 308, 260, 50, SFX.muted ? 'Sound: off' : 'Sound: on', () => SFX.setMuted(!SFX.muted), { style: 'secondary' });
    UI.button(ctx, 'quit', W / 2 - 130, 374, 260, 50, 'End my turn now', () => { this.paused = false; this.end('quit'); }, { style: 'coral' });
    text(ctx, 'Your catches so far still count.', W / 2, 452, { size: 16, align: 'center', color: '#9fb8c2', weight: 600 });
  }
  drawChildOrNull(ctx) { if (this.child) { this.child.draw(ctx); return true; } return false; }
}

/* ---- js/bughunt.js ---- */
'use strict';
/* Keys Crew — Bug Hunt. Free-dive the patch reef for spiny lobster.
   Tickle them out of their holes (ease off when they twitch), net them on the ring,
   then gauge every bug: carapace over 3", no eggs. Six per person. */

const BH = { WW: 2900, SURF: 96, BAG: 6, BOATX: 660 };
const GAUGE_IN = 3.0;

function rollCL(perks) {
  const r = Math.random();
  if (r < 0.3) return Math.round(rand(2.45, 2.97) * 100) / 100;
  if (r < 0.42) return Math.round(rand(2.95, 3.1) * 100) / 100;
  const big = chance(0.16 * ((perks && perks.trophy) || 1));
  return Math.round((3.1 + Math.pow(Math.random(), 1.7) * (big ? 2.9 : 1.6)) * 100) / 100;
}
const lobsterWeight = (cl) => Math.round(0.034 * Math.pow(cl, 2.9) * 10) / 10;

class BugHuntScene extends SessionBase {
  constructor(o) {
    super(o);
    this.resultHeader = 'FWC check at the ramp';
    this.diver = { x: 540, y: BH.SURF + 6, vx: 0, vy: 0, facing: 1, stun: 0 };
    this.maxBreath = 24 * this.perks.breath; this.breath = this.maxBreath;
    this.bag = []; this.out = null; this.gauge = null; this.blackout = 0; this.beatT = 0;
    this.joy = null; this.actionPtr = null; this.actionPress = false; this.cam = 0; this.goodReleases = 0;
    this.others = (Trip.cur && Trip.cur.crew ? Trip.cur.crew : CHAR_ORDER).filter((c) => c !== this.ch).slice(0, 2);
    this.gen();
  }
  enter() { SFX.setAmbient(1, true); Game.toast('Bug Hunt', { color: PAL.coral, size: 46, y: 200, sub: 'Swim down, find antennae, tickle them out' }); }
  exit() { SFX.setAmbient(0); }
  baseFloor(x) { return 500 + 10 * Math.sin(x * 0.004) + 6 * Math.sin(x * 0.013 + 1); }
  groundAt(x) { for (const L of this.ledges) if (x >= L.x0 - 4 && x <= L.x1 + 4) return L.top; return this.baseFloor(x); }
  solid(x, y) { return y > this.groundAt(x) - 12; }
  gen() {
    this.ledges = []; let x = 620;
    while (x < BH.WW - 240) { const w = rand(150, 260), h = rand(62, 118); this.ledges.push({ x0: x, x1: x + w, h, seed: randi(1, 99999) }); x += w + rand(150, 260); }
    for (const L of this.ledges) {
      L.top = this.baseFloor((L.x0 + L.x1) / 2) - L.h;
      const rng = mulberry(L.seed); L.pts = [];
      L.pts.push([L.x0 - 2, this.baseFloor(L.x0) + 4], [L.x0 - 7, L.top + L.h * 0.55], [L.x0 + 4, L.top + 6]);
      for (let px = L.x0 + 20; px < L.x1 - 14; px += 18) L.pts.push([px, L.top - rng() * 9]);
      L.pts.push([L.x1 - 4, L.top + 6], [L.x1 + 7, L.top + L.h * 0.55], [L.x1 + 2, this.baseFloor(L.x1) + 4]);
      L.deco = [];
      for (let px = L.x0 + 14; px < L.x1 - 10; px += rand(22, 40)) L.deco.push({ x: px, kind: pick(['fan', 'brain', 'sponge', 'rod', 'rod', 'fan']), s: rand(0.7, 1.25), c: pick(['#8a4fb8', '#b85fa8', '#e07a3a', '#d9a441', '#7d5bd0']) });
    }
    this.dens = [];
    for (const L of this.ledges) {
      if (chance(0.88)) this.dens.push(this.makeDen(L.x0, this.baseFloor(L.x0) - rand(15, 24), -1));
      if (chance(0.88)) this.dens.push(this.makeDen(L.x1, this.baseFloor(L.x1) - rand(15, 24), 1));
      if (L.h > 88 && chance(0.55)) { const right = chance(0.5); this.dens.push(this.makeDen(right ? L.x1 : L.x0, L.top + rand(26, L.h - 48), right ? 1 : -1)); }
    }
    const order = this.dens.slice().sort(() => Math.random() - 0.5);
    order.forEach((d, i) => {
      if (i < 2) d.kind = 'moray';
      else if (i < order.length - 3) { d.kind = 'lobster'; d.extra = chance(0.3) ? 1 : 0; d.lob = this.makeLob(); }
      else d.kind = 'empty';
    });
    this.grass = []; for (let i = 0; i < 90; i++) this.grass.push({ x: rand(0, BH.WW), h: rand(10, 26), ph: rand(0, TAU) });
    this.jellies = []; for (let i = 0; i < 4; i++) this.jellies.push({ x: rand(700, BH.WW - 100), y: rand(170, 360), ph: rand(0, TAU), hit: 0 });
    this.schools = []; for (let i = 0; i < 4; i++) { const L = pick(this.ledges); const fish = []; for (let k = 0; k < randi(6, 10); k++) fish.push({ ox: rand(-50, 50), oy: rand(-26, 26), ph: rand(0, TAU) }); this.schools.push({ x: (L.x0 + L.x1) / 2, y: L.top - 40, cx: (L.x0 + L.x1) / 2, cy: L.top - 40, ph: rand(0, TAU), fish, kind: i % 2 ? 'tang' : 'sgt' }); }
    this.cuda = { x: rand(900, 2000), y: 230, dir: 1 };
  }
  makeDen(x, y, dir) { return { x, y, dir, kind: 'empty', coax: 0, spooks: 0, twitch: 0, nextTwitch: rand(0.9, 1.8), badHold: 0, state: 'in', peek: 0, peekT: rand(2, 5), lob: null, extra: 0 }; }
  makeLob() { const cl = rollCL(this.perks); return { cl, w: lobsterWeight(cl), eggs: cl > 3.0 && chance(0.14) }; }

  /* ---------- input ---------- */
  actionZone() { return { x: Game.W - 96, y: Game.H - 96, r: 66 }; }
  inAction(x, y) { const a = this.actionZone(); return dist(x, y, a.x, a.y) < a.r + 8; }
  pointerDown(p) {
    if (this.basePointerDown(p) || this.gauge || this.blackout > 0) return;
    if (this.inAction(p.x, p.y)) { this.actionPtr = p.id; this.actionPress = true; return; }
    if (!this.joy && p.y > 64) this.joy = { id: p.id, sx: p.x, sy: p.y, x: p.x, y: p.y };
  }
  pointerMove(p) { if (this.joy && this.joy.id === p.id) { this.joy.x = p.x; this.joy.y = p.y; } }
  pointerUp(p) { if (this.joy && this.joy.id === p.id) this.joy = null; if (this.actionPtr === p.id) this.actionPtr = null; }
  keyDown(c) { if (this.baseKeyDown(c) || this.gauge) return; if (c === 'Space' || c === 'KeyE') this.actionPress = true; }
  actionHeld() { return this.actionPtr != null || Input.held('Space', 'KeyE'); }

  /* ---------- update ---------- */
  update(dt) {
    if (this.gauge) { this.gauge.t += dt; this.t += dt; Game.toasts = []; return; }
    if (this.baseUpdate(dt)) return;
    const d = this.diver, t = this.t;
    if (this.blackout > 0) {
      this.blackout -= dt; d.y = approach(d.y, BH.SURF + 4, 1.5, dt);
      if (this.blackout <= 0) { d.y = BH.SURF + 4; this.breath = this.maxBreath * 0.5; this.timeLeft = Math.max(0, this.timeLeft - 6); Game.toast('Your buddy pulled you up', { color: '#fff', size: 30, y: 160, sub: 'Never push a breath-hold. Always dive with a buddy. (−6 sec)' }); }
      return;
    }
    // movement input
    let ix = 0, iy = 0;
    if (Input.held('ArrowLeft', 'KeyA')) ix -= 1; if (Input.held('ArrowRight', 'KeyD')) ix += 1;
    if (Input.held('ArrowUp', 'KeyW')) iy -= 1; if (Input.held('ArrowDown', 'KeyS')) iy += 1;
    if (this.joy) { const jx = (this.joy.x - this.joy.sx) / 55, jy = (this.joy.y - this.joy.sy) / 55; const m = Math.hypot(jx, jy); if (m > 0.12) { ix = jx / Math.max(1, m); iy = jy / Math.max(1, m); } }
    const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }
    const stunned = d.stun > 0; if (stunned) { d.stun -= dt; ix = 0; iy = 0; }
    const under = d.y > BH.SURF + 14;
    const sp = 168;
    d.vx = approach(d.vx, ix * sp, 4, dt);
    d.vy = approach(d.vy, iy * sp + (iy === 0 ? -16 : 0), 4, dt);
    if (Math.abs(ix) > 0.1) d.facing = ix > 0 ? 1 : -1;
    const drift = under ? -this.weather.drift * 16 : 0;
    let nx = d.x + (d.vx + drift) * dt, ny = d.y + d.vy * dt;
    nx = clamp(nx, 30, BH.WW - 30);
    if (this.solid(nx + d.facing * 28, d.y) || this.solid(nx, d.y)) { nx = d.x; d.vx = 0; }
    ny = clamp(ny, BH.SURF + 2, 600);
    if (this.solid(nx, ny)) { ny = this.groundAt(nx) - 12; d.vy = Math.min(0, d.vy); }
    d.x = nx; d.y = ny;
    this.cam = approach(this.cam, clamp(d.x - Game.W * 0.45, 0, BH.WW - Game.W), 6, dt);
    // breath
    if (under) { this.breath -= dt; if (chance(dt * 2.2)) this.parts.add({ kind: 'bubble', x: d.x + d.facing * 20, y: d.y - 14, vy: -50, vx: rand(-8, 8), life: 1.6, size: rand(2, 4) }); }
    else this.breath = Math.min(this.maxBreath, this.breath + dt * 9);
    if (this.breath < this.maxBreath * 0.28 && under) { this.beatT -= dt; if (this.beatT <= 0) { this.beatT = 0.75; SFX.tone(60, 0.12, { vol: 0.25 }); } }
    if (this.breath <= 0) { this.blackout = 2.2; this.breath = 0; if (this.out) this.lobsterFlees(); SFX.play('fail'); return; }
    // creatures
    for (const j of this.jellies) {
      j.ph += dt; j.x += Math.sin(j.ph * 0.3) * 10 * dt - this.weather.drift * 6 * dt; j.y += Math.sin(j.ph * 0.9) * 8 * dt; j.hit = Math.max(0, j.hit - dt);
      if (!j.hit && dist(j.x, j.y, d.x + d.facing * 10, d.y) < 26) { j.hit = 2; d.stun = 0.7; this.breath -= 3; Game.toast('Jellyfish sting!', { color: '#ff9fd6', size: 30, y: 130 }); SFX.play('sting'); Game.shake(4); }
    }
    this.cuda.x += this.cuda.dir * 26 * dt; if (this.cuda.x > BH.WW - 200 || this.cuda.x < 300) this.cuda.dir *= -1;
    for (const s of this.schools) { s.ph += dt * 0.5; s.x = s.cx + Math.cos(s.ph) * 70; s.y = s.cy + Math.sin(s.ph * 1.3) * 18; if (dist(s.x, s.y, d.x, d.y) < 70) { s.x += (s.x - d.x) * 0.6; } }
    // dens
    const hx = d.x + d.facing * 46, hy = d.y + 2;
    let target = null, best = 52;
    for (const den of this.dens) {
      if (den.kind === 'moray') { den.peekT -= dt; if (den.peekT <= 0) { den.peek = 1.4; den.peekT = rand(3, 6); } den.peek = Math.max(0, den.peek - dt); }
      const dd = dist(hx, hy, den.x + den.dir * 8, den.y);
      if (dd < best && d.facing === -den.dir && den.state === 'in' && den.kind !== 'empty') { best = dd; target = den; }
    }
    this.target = target;
    const held = this.actionHeld() && !stunned;
    this.tickling = false;
    if (target && target.kind === 'moray' && held) {
      target.peek = 1.5; d.stun = 0.9; this.breath -= 4; Game.toast('MORAY! Wrong hole.', { color: PAL.bad, size: 34, y: 130 }); SFX.play('chomp'); Game.shake(7); Game.vibrate(120);
      this.parts.burst(target.x, target.y, 10, { color: 'rgba(255,255,255,0.7)', kind: 'bubble', min: 20, max: 60, life: 1 });
    } else if (target && target.kind === 'lobster' && held && !this.out) {
      this.tickling = true;
      if (chance(dt * 18)) SFX.play('tickle');
      if (target.twitch > 0) { target.badHold += dt; if (target.badHold > 0.16) this.spook(target); }
      else target.coax += dt * 0.42 * this.perks.coax;
      target.nextTwitch -= dt;
      if (target.nextTwitch <= 0 && target.twitch <= 0) { target.twitch = 0.6; target.badHold = 0; target.nextTwitch = rand(0.8, 1.9); SFX.tone(300, 0.06, { type: 'square', vol: 0.05 }); }
      if (target.coax >= 1) this.emerge(target);
    }
    for (const den of this.dens) if (den.twitch > 0) den.twitch -= dt;
    // the lobster in the open
    if (this.out) this.updateOut(dt, d);
    if (this.actionPress) {
      this.actionPress = false;
      if (this.out && this.out.state === 'ring' && dist(this.out.x, this.out.y, d.x, d.y) < 140) this.tryNet();
      else if (!target) this.parts.burst(hx, hy, 4, { kind: 'bubble', min: 10, max: 40, life: 0.8 });
    }
  }
  spook(den) {
    den.coax = Math.max(0, den.coax - 0.4); den.spooks++; den.twitch = 0; den.badHold = 0;
    SFX.play('fail');
    if (den.spooks >= 3) { den.state = 'gone'; Game.toast('It backed in deep', { color: PAL.warn, size: 30, y: 130, sub: 'That bug is gone. Try another hole.' }); }
    else Game.toast('Easy! It backed in.', { color: PAL.warn, size: 30, y: 130, sub: 'Let go of TICKLE when the antennae twitch' });
  }
  emerge(den) {
    const lob = den.lob;
    this.out = { x: den.x + den.dir * 6, y: den.y, tx: den.x + den.dir * 52, ty: this.baseFloor(den.x + den.dir * 52) - 9, dir: den.dir, lob, state: 'walk', t: 0, ringT: 0, ringDur: 1.15, misses: 0, vx: 0 };
    if (den.extra > 0) { den.extra--; den.coax = 0; den.spooks = 0; den.lob = this.makeLob(); }
    else { den.state = 'empty'; den.kind = 'empty'; }
    Game.toast('It’s out!', { color: PAL.good, size: 32, y: 130, sub: 'Tap NET when the ring hits the gold circle' });
    SFX.play('coin');
  }
  updateOut(dt, d) {
    const o = this.out; o.t += dt;
    if (o.state === 'walk') { o.x = approach(o.x, o.tx, 4, dt); o.y = approach(o.y, o.ty, 4, dt); if (Math.abs(o.x - o.tx) < 3) { o.state = 'ring'; o.ringT = 0; } }
    else if (o.state === 'ring') {
      if (dist(o.x, o.y, d.x, d.y) < 140) { o.ringT += dt; if (o.ringT > o.ringDur + 0.12) this.bolt(); }
      else o.ringT = Math.max(0, o.ringT - dt);
    } else if (o.state === 'bolt') {
      o.x += o.vx * dt; o.vx *= 1 - Math.min(1, dt * 3.2); o.t2 -= dt;
      const gy = this.groundAt(o.x); if (gy < o.y + 4) { o.x -= o.vx * dt; o.vx = 0; }
      o.y = approach(o.y, this.baseFloor(o.x) - 9, 5, dt);
      if (chance(0.5)) this.parts.add({ x: o.x, y: o.y + 6, vx: rand(-20, 20), vy: -rand(5, 25), life: 0.8, size: rand(2, 4), color: 'rgba(225,205,150,0.7)' });
      if (o.t2 <= 0) { o.state = 'ring'; o.ringT = 0; o.ringDur *= 0.86; }
    }
  }
  ringRadius() { const o = this.out; return lerp(84, 10, clamp(o.ringT / o.ringDur, 0, 1)); }
  tryNet() {
    const r = this.ringRadius(), tol = 8 * this.perks.window;
    if (Math.abs(r - 26) <= tol) {
      const perfect = Math.abs(r - 26) <= 3;
      SFX.play('net'); Game.vibrate(40);
      this.parts.burst(this.out.x, this.out.y, 18, { kind: 'bubble', min: 30, max: 120, life: 1.1 });
      if (perfect) { this.addLine('Perfect net', 25); this.fl.add(this.out.x - this.cam, this.out.y - 40, 'PERFECT +25', PAL.sun, 22); }
      this.gauge = { lob: this.out.lob, t: 0 }; Game.toasts = [];
      this.out = null;
    } else this.bolt();
  }
  bolt() {
    const o = this.out, d = this.diver;
    o.misses++;
    if (o.misses >= 3) { this.lobsterFlees(); return; }
    o.state = 'bolt'; o.t2 = 0.6; o.vx = (Math.sign(o.x - d.x) || 1) * 430;
    SFX.play('splash'); Game.toast('Missed! It tail-flipped away', { color: PAL.warn, size: 28, y: 130, sub: 'Chase it down and try again' });
    this.parts.burst(o.x, o.y + 4, 14, { color: 'rgba(225,205,150,0.8)', min: 20, max: 90, life: 0.9, angle: -Math.PI / 2, spread: 1.4 });
  }
  lobsterFlees() {
    const o = this.out; if (!o) return;
    let best = null, bd = 1e9;
    for (const den of this.dens) { if (den.kind !== 'empty' || den.state === 'gone') continue; const dd = Math.abs(den.x - o.x); if (dd < bd) { bd = dd; best = den; } }
    if (best && bd < 600) { best.kind = 'lobster'; best.lob = o.lob; best.coax = 0.15; best.spooks = 1; best.state = 'in'; best.extra = 0; }
    this.out = null; Game.toast('It got back into the rocks', { color: PAL.warn, size: 28, y: 130 });
  }
  decide(keep) {
    const lob = this.gauge.lob; this.gauge = null;
    const legal = lob.cl > GAUGE_IN && !lob.eggs;
    if (keep) {
      this.bag.push(lob); SFX.play('coin');
      this.fl.add(this.diver.x - this.cam, this.diver.y - 50, 'In the bag ' + this.bag.length + '/' + BH.BAG, '#fff', 22);
      if (legal) this.score += Math.round(lob.w * 100);
      if (this.bag.length >= BH.BAG) this.end('limit');
    } else {
      this.parts.burst(this.diver.x + this.diver.facing * 40, this.diver.y, 10, { kind: 'bubble', min: 20, max: 80, life: 1 });
      if (!legal) { this.goodReleases++; this.addLine(lob.eggs ? 'Released an egg-bearing female' : 'Released a short (' + lob.cl.toFixed(2) + '")', 25); this.fl.add(this.diver.x - this.cam, this.diver.y - 50, 'Good call +25', PAL.good, 22); SFX.play('coin'); }
      else this.fl.add(this.diver.x - this.cam, this.diver.y - 50, 'Let a keeper go', '#cfe3ea', 20);
    }
  }
  buildResult() {
    const lines = [], catches = []; let fines = 0;
    this.bag.forEach((lob, i) => {
      const tag = 'Lobster ' + (i + 1) + ' · ' + lob.cl.toFixed(2) + '"';
      if (lob.eggs) { lines.push({ label: tag + ' · eggs! FWC fine', pts: -300, bad: true }); fines++; }
      else if (lob.cl <= GAUGE_IN) { lines.push({ label: tag + ' · short! FWC fine', pts: -250, bad: true }); fines++; }
      else {
        const extras = lob.cl >= 4.4 ? [{ label: 'Big boy bonus', pts: 100 }] : [];
        const c = makeCatch('lobster', lob.w, this.ch, 'bughunt', extras); c.cl = lob.cl; catches.push(c);
        lines.push({ label: tag + ' · ' + fmtLb(lob.w), pts: c.pts, key: 'lobster', trophy: c.trophy });
      }
    });
    for (const l of this.extraLines) lines.push(l);
    if (this.bag.length >= BH.BAG) lines.push({ label: 'Limited out (6 bugs)', pts: 150 });
    if (catches.length && !fines) lines.push({ label: 'Clean bag · the officer nods', pts: 100 });
    if (!this.bag.length) lines.push({ label: 'Empty bag. The officer waves you through.', pts: 0 });
    const total = Math.max(0, lines.reduce((a, l) => a + l.pts, 0));
    let best = null; for (const c of catches) if (!best || c.pts > best.pts) best = c;
    return { catches, lines, total, best, header: this.resultHeader, under: true };
  }

  /* ---------- drawing ---------- */
  draw(ctx) {
    if (this.drawChildOrNull(ctx)) return;
    const W = Game.W, H = Game.H, t = this.t, cam = this.cam, d = this.diver;
    drawSky(ctx, W, BH.SURF, 'day');
    drawSun(ctx, W * 0.85, 40, 16);
    drawCloud(ctx, ((200 - cam * 0.1) % (W + 200) + W + 200) % (W + 200) - 100, 34, 0.6, 0.9);
    drawCloud(ctx, ((700 - cam * 0.1) % (W + 200) + W + 200) % (W + 200) - 100, 52, 0.45, 0.8);
    const vis = this.weather.vis;
    const g = ctx.createLinearGradient(0, BH.SURF, 0, H);
    g.addColorStop(0, vis > 1.1 ? '#43c7da' : '#35b2cc'); g.addColorStop(0.55, '#1683a8'); g.addColorStop(1, '#0c5a7a');
    ctx.fillStyle = g; ctx.fillRect(0, BH.SURF, W, H - BH.SURF);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for (let i = 0; i < 7; i++) { const bx = ((i * 260 - cam * 0.3) % (W + 300) + W + 300) % (W + 300) - 150; ctx.beginPath(); ctx.moveTo(bx, BH.SURF); ctx.lineTo(bx + 50, BH.SURF); ctx.lineTo(bx - 70 + Math.sin(t * 0.7 + i) * 18, H); ctx.lineTo(bx - 150 + Math.sin(t * 0.7 + i) * 18, H); ctx.fill(); }
    // far reef silhouettes
    ctx.fillStyle = 'rgba(10,70,95,0.55)'; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) { const wx = x + cam * 0.5; ctx.lineTo(x, 420 - 30 * Math.abs(Math.sin(wx * 0.006)) - 18 * Math.sin(wx * 0.017)); }
    ctx.lineTo(W, H); ctx.fill();
    ctx.save(); ctx.translate(-cam, 0);
    // boat at the surface with the rest of the crew
    drawBoatSide(ctx, BH.BOATX, BH.SURF + 8, 0.42, { crew: this.others, flag: true, t });
    // sand
    const sg = ctx.createLinearGradient(0, 470, 0, H); sg.addColorStop(0, '#d8c58f'); sg.addColorStop(1, '#a8955f');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(cam - 10, H);
    for (let x = cam - 10; x <= cam + W + 20; x += 16) ctx.lineTo(x, this.baseFloor(x)); ctx.lineTo(cam + W + 20, H); ctx.fill();
    ctx.strokeStyle = '#4f8a46'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (const gr of this.grass) { if (gr.x < cam - 20 || gr.x > cam + W + 20) continue; const by = this.baseFloor(gr.x) + 4; ctx.beginPath(); ctx.moveTo(gr.x, by); ctx.quadraticCurveTo(gr.x + Math.sin(t * 1.4 + gr.ph) * 6, by - gr.h * 0.6, gr.x + Math.sin(t * 1.4 + gr.ph) * 10, by - gr.h); ctx.stroke(); }
    for (const L of this.ledges) { if (L.x1 < cam - 60 || L.x0 > cam + W + 60) continue; this.drawLedge(ctx, L, t); }
    for (const den of this.dens) { if (den.x < cam - 80 || den.x > cam + W + 80) continue; this.drawDen(ctx, den, t); }
    for (const s of this.schools) for (const f of s.fish) {
      const fx = s.x + f.ox + Math.sin(t * 2 + f.ph) * 4, fy = s.y + f.oy;
      ctx.save(); ctx.translate(fx, fy); if (Math.cos(s.ph) < 0) ctx.scale(-1, 1);
      ctx.fillStyle = s.kind === 'tang' ? '#2b62d6' : '#e2d867'; ell(ctx, 0, 0, 7, 4); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-11, -4); ctx.lineTo(-11, 4); ctx.fill();
      if (s.kind === 'sgt') { ctx.fillStyle = '#222'; ctx.fillRect(-3, -4, 1.4, 8); ctx.fillRect(1, -4, 1.4, 8); }
      ctx.restore();
    }
    ctx.save(); ctx.translate(this.cuda.x, this.cuda.y + Math.sin(t * 0.6) * 10); drawFish(ctx, 'barracuda', 120, { t, flip: this.cuda.dir < 0, wig: 0.4, alpha: 0.85 }); ctx.restore();
    for (const j of this.jellies) this.drawJelly(ctx, j, t);
    if (this.out) this.drawOut(ctx, t);
    const moving = Math.hypot(d.vx, d.vy) / 168;
    drawDiver(ctx, this.ch, d.x, d.y, 0.95, { t, facing: d.facing, kick: moving, tickle: this.tickling, tilt: clamp(d.vy / 400, -0.35, 0.35) * d.facing });
    this.parts.draw(ctx);
    ctx.restore();

/* ---- js/bottom.js ---- */
'use strict';
/* Keys Crew — The Ledge. Anchored over the reef in 95 feet.
   Pick a bait, set your depth, sit through the nibbles, set the hook on the real bite. */

const BOT = { SURF: 132, FLOOR: 512, MAXFT: 100 };
const BOT_TABLE = [
  // key, spawn weight, depth range (ft), likes squid, likes pinfish, where
  ['yellowtail', 5, [32, 70], 1, 0.1, 'any'],
  ['mangrove', 3, [78, 95], 1, 0.5, 'any'],
  ['mutton', 2, [86, 97], 0.8, 0.7, 'sand'],
  ['redgrouper', 2, [86, 97], 0.4, 1, 'ledge'],
  ['blackgrouper', 1.4, [84, 96], 0.15, 1, 'ledge'],
  ['amberjack', 1.2, [52, 84], 0.05, 1, 'any'],
  ['barracuda', 0.6, [18, 50], 0, 0.8, 'any'],
  ['goliath', 0.22, [92, 97], 0, 1, 'ledge']
];

class BottomScene extends SessionBase {
  constructor(o) {
    super(o);
    this.baitType = 'squid'; this.baitOn = true; this.baitDepth = 0; this.targetDepth = 60; this.rebaitT = 0; this.reeling = false;
    this.fish = []; this.spawnT = 0; this.chumT = 0; this.chumCd = 0; this.chum = new Particles();
    this.drag = null; this.twitch = 0; this.slam = 0;
    this.others = (Trip.cur && Trip.cur.crew ? Trip.cur.crew : CHAR_ORDER).filter((c) => c !== this.ch).slice(0, 2);
    for (let i = 0; i < 6; i++) this.spawn(true);
  }
  enter() { SFX.setAmbient(0.8, false); Game.toast('The Ledge', { color: PAL.coral, size: 46, y: 200, sub: 'Drag to set your depth. Tap on the BITE.' }); }
  exit() { SFX.setAmbient(0); }
  pxPerFt() { return (BOT.FLOOR - BOT.SURF) / BOT.MAXFT; }
  yOf(ft) { return BOT.SURF + ft * this.pxPerFt(); }
  baitX() { return Game.W * 0.5 + Math.sin(this.t * 0.4) * 6 + this.weather.drift * 18; }
  ledgeX0() { return Game.W * 0.47; } ledgeX1() { return Game.W * 0.93; }
  spawn(initial) {
    const chum = this.chumT > 0;
    let total = 0; const table = BOT_TABLE.map((r) => { const w = r[0] === 'yellowtail' && chum ? r[1] * 3 : r[1]; total += w; return [r, w]; });
    let roll = Math.random() * total, row = table[0][0];
    for (const [r, w] of table) { if ((roll -= w) <= 0) { row = r; break; } }
    const [key, , dr, , , where] = row;
    let ft = rand(dr[0], dr[1]); if (key === 'yellowtail' && chum) ft = rand(16, 44);
    const W = Game.W, fromLeft = chance(0.5);
    let x = initial ? rand(60, W - 60) : fromLeft ? -60 : W + 60;
    if (where === 'ledge') x = initial ? rand(this.ledgeX0(), this.ledgeX1()) : rand(this.ledgeX0(), this.ledgeX1());
    const w = rollWeight(key, this.perks);
    const len = clamp(34 + 70 * sizeNorm(key, w), 34, 120) * (key === 'goliath' ? 1.7 : 1);
    this.fish.push({ key, w, x, y: this.yOf(ft), homeY: this.yOf(ft), vx: (fromLeft ? 1 : -1) * rand(18, 40), len, state: 'swim', t: rand(0, 5), nib: 0, timer: 0, where, alpha: initial ? 1 : 0 });
  }
  activeFish() { return this.fish.find((f) => f.state === 'approach' || f.state === 'nibble' || f.state === 'bite'); }

  pointerDown(p) {
    if (this.basePointerDown(p)) return;
    if (this.hookset()) return;
    if (p.y > BOT.SURF - 20) { this.drag = p.id; this.setDepthFromY(p.y); }
  }
  pointerMove(p) { if (this.drag === p.id) this.setDepthFromY(p.y); }
  pointerUp(p) { if (this.drag === p.id) this.drag = null; }
  keyDown(c) { if (this.baseKeyDown(c)) return; if (c === 'Space' || c === 'Enter') this.hookset(true); }
  setDepthFromY(y) { this.targetDepth = clamp((y - BOT.SURF) / this.pxPerFt(), 4, 97); }
  hookset(fromKey) {
    const f = this.activeFish();
    if (!f || !this.baitOn) { if (fromKey) this.twitch = 0.2; return false; }
    if (f.state === 'bite') {
      this.fish = this.fish.filter((x) => x !== f);
      this.baitOn = false; this.slam = 0;
      this.startFight({ sp: f.key, weight: f.w, ctxType: 'reef', depth: Math.max(25, this.baitDepth) });
      return true;
    }
    if (f.state === 'nibble' || f.state === 'approach') {
      if (f.state === 'nibble') {
        Game.toast('Too early!', { color: PAL.warn, size: 34, y: 140, sub: 'Wait for the rod to slam down' }); SFX.play('fail');
        if (chance(0.65)) this.stealBait(f, true); else { f.state = 'leave'; }
      }
      return true;
    }
    return false;
  }
  stealBait(f, quiet) {
    this.baitOn = false; f.state = 'leave';
    if (!quiet) { Game.toast('Bait stolen!', { color: PAL.warn, size: 32, y: 140, sub: 'Tap REBAIT and drop back down' }); SFX.play('fail'); }
  }
  rebait(type) {
    if (this.rebaitT > 0 || this.reeling) { if (type) this.baitType = type; return; }
    if (type) this.baitType = type;
    const f = this.activeFish(); if (f) f.state = 'leave';
    this.baitOn = false; this.reeling = true;
  }
  onFightDone() { this.baitDepth = 0; this.reeling = false; this.rebaitT = 0.9; this.baitOn = false; }

  update(dt) {
    if (this.baseUpdate(dt)) return;
    const t = this.t, dpf = this.pxPerFt();

/* ---- js/troll.js ---- */
'use strict';
/* Keys Crew — The Weedline. Trolling offshore, seen from above.
   Steer so your spread crosses the fish: weedlines hold mahi, birds mark tuna,
   the blue-water edge brings wahoo and sailfish. Stay off the trap floats. */

const LURES = [
  { Ld: 170, off: -36, color: '#ff4fa0', name: 'Pink skirt' },
  { Ld: 240, off: 36, color: '#36c8ff', name: 'Blue ballyhoo' },
  { Ld: 310, off: 0, color: '#ffe14a', name: 'Shotgun' }

class TrollScene extends SessionBase {
  constructor(o) {
    super(o);
    this.by = Game.H * 0.55; this.ty = this.by; this.bvy = 0; this.speed = 150; this.stall = 0; this.trav = 0;
    this.hist = [{ d: 0, y: this.by }];
    this.lures = LURES.map((l) => Object.assign({}, l, { x: 0, y: 0, fouled: 0 }));
    this.features = []; this.fish = []; this.strike = null; this.dragId = null;
    this.timers = { weed: 1.5, birds: 7, log: 12, buoy: 1, open: 4 };
    this.edgeAt = [this.len * 0.62, this.len * 0.25];
    this.waves = []; for (let i = 0; i < 70; i++) this.waves.push({ x: rand(0, 1400), y: rand(0, 540), l: rand(8, 22) });
  }
  enter() { SFX.setAmbient(1, false); Game.toast('The Weedline', { color: PAL.coral, size: 46, y: 200, sub: 'Drag to steer. Pull your lures past the fish.' }); }
  exit() { SFX.setAmbient(0); }
  boatX() { return Game.W * 0.42; }
  pointerDown(p) { if (this.basePointerDown(p)) return; this.dragId = p.id; this.ty = clamp(p.y, 120, Game.H - 50); }
  pointerMove(p) { if (this.dragId === p.id) this.ty = clamp(p.y, 120, Game.H - 50); }
  pointerUp(p) { if (this.dragId === p.id) this.dragId = null; }
  keyDown(c) { this.baseKeyDown(c); }
  yAtDist(d) {
    const h = this.hist; if (d <= h[0].d) return h[0].y;
    for (let i = h.length - 1; i > 0; i--) if (h[i - 1].d <= d) { const a = h[i - 1], b = h[i]; return lerp(a.y, b.y, (d - a.d) / Math.max(0.001, b.d - a.d)); }
    return h[h.length - 1].y;
  }
  spawnFeature(type) {
    const W = Game.W, H = Game.H, x = W + 140;
    if (type === 'weed') {
      const y = rand(150, H - 90), len = rand(420, 820), ang = rand(-0.25, 0.25), blobs = [];
      for (let s = 0; s < len; s += rand(14, 30)) blobs.push({ dx: s, dy: Math.sin(s * 0.02) * 14 + rand(-8, 8), r: rand(6, 15) });
      const f = { type, x, y, len, ang, blobs }; this.features.push(f);
      const n = chance(0.85) ? randi(2, 4) : 0; for (let i = 0; i < n; i++) this.spawnFish('mahi', x + rand(40, len), y + rand(-30, 30), f);
      if (chance(0.12)) this.spawnFish('sailfish', x + rand(0, len), y + rand(-50, 50), f);
    } else if (type === 'birds') {
      const f = { type, x, y: rand(150, H - 80), r: rand(60, 90), birds: [] };
      for (let i = 0; i < 5; i++) f.birds.push({ a: rand(0, TAU), r: rand(20, 80), h: rand(0.6, 1.2), sp: rand(0.6, 1.2) });
      this.features.push(f);
      for (let i = 0; i < randi(3, 4); i++) this.spawnFish(chance(0.6) ? 'blackfin' : 'mahi', f.x + rand(-60, 60), f.y + rand(-50, 50), f);
      if (chance(0.25)) this.spawnFish('kingfish', f.x, f.y + rand(-40, 40), f);
    } else if (type === 'log') {
      const f = { type, x, y: rand(150, H - 80), rot: rand(-0.6, 0.6) }; this.features.push(f);
      for (let i = 0; i < randi(2, 3); i++) this.spawnFish('mahi', f.x + rand(-40, 40), f.y + rand(-40, 40), f, true);
      if (chance(0.18)) this.spawnFish('wahoo', f.x + rand(-60, 60), f.y + rand(-50, 50), f);
    } else if (type === 'buoy') {
      this.features.push({ type, x, y: rand(130, H - 50), color: pick(['#ff6a3d', '#ffffff', '#ffd23a', '#7be36a', '#ff4fa0']), stripe: pick(['#1b3f8a', '#e03a3a', '#111111']) });
    } else if (type === 'edge') {

      if (chance(0.6)) this.spawnFish('sailfish', x + rand(150, 700), rand(150, H - 80), f);
      if (chance(0.5)) this.spawnFish('kingfish', x + rand(100, 700), rand(150, H - 80), f);
      if (chance(0.5)) this.spawnFish('blackfin', x + rand(100, 700), rand(150, H - 80), f);
      if (chance(0.07)) this.spawnFish('bluemarlin', x + rand(300, 800), rand(180, H - 100), f);
      Game.toast('Blue water edge ahead', { color: '#9fd8ff', size: 28, y: 110, sub: 'Wahoo and sailfish country' });
    }
  }
  spawnFish(key, x, y, feat, small) {
    let w = rollWeight(key, this.perks); if (small && key === 'mahi') w = Math.round(Math.min(w, rand(6, 18)) * 10) / 10;
    const n = sizeNorm(key, w);
    this.fish.push({ key, w, x, y, hx: x, hy: y, vx: 0, vy: 0, len: (40 + 70 * n) * (key === 'bluemarlin' ? 1.6 : key === 'wahoo' || key === 'sailfish' ? 1.2 : 1), t: rand(0, 5), state: 'cruise', chase: 0, feat, cool: 0 });
  }
  onFightDone(r) {
    if (r.ok && r.catch && r.catch.key === 'mahi' && chance(0.7)) {
      const L = this.lures[randi(0, 2)];
      for (let i = 0; i < randi(2, 3); i++) this.spawnFish('mahi', L.x + rand(20, 120), L.y + rand(-50, 50), null, true);
      Game.toast('The school followed it up!', { color: '#bff46a', size: 28, y: 120, sub: 'Get a bait back in front of them' });
    }

  update(dt) {
    if (this.baseUpdate(dt)) return;

    if (Input.held('ArrowUp', 'KeyW')) this.ty = clamp(this.ty - 230 * dt, 120, H - 50);
    if (Input.held('ArrowDown', 'KeyS')) this.ty = clamp(this.ty + 230 * dt, 120, H - 50);
    if (this.stall > 0) { this.stall -= dt; this.speed = approach(this.speed, 0, 6, dt); } else this.speed = approach(this.speed, 150, 2, dt);
    const v = this.speed;
    const dy = clamp(this.ty - this.by, -220 * dt, 220 * dt); this.bvy = dy / Math.max(dt, 1e-4); this.by += dy;
    this.trav += v * dt; this.hist.push({ d: this.trav, y: this.by }); if (this.hist.length > 400) this.hist.shift();
    for (const w of this.waves) { w.x -= (v * 1.0 + 12) * dt; if (w.x < -30) { w.x = W + rand(0, 60); w.y = rand(0, H); } }
    // lures trail the boat's path
    const bx = this.boatX();
    for (const L of this.lures) {
      L.x = bx - L.Ld; L.y = this.yAtDist(this.trav - L.Ld) + L.off; L.fouled = Math.max(0, L.fouled - dt);
      if (!L.fouled && chance(dt * 6)) this.parts.add({ x: L.x - 6, y: L.y + rand(-2, 2), vx: -v * 0.2, life: 0.6, size: rand(1.5, 2.5), color: 'rgba(255,255,255,0.7)' });
    }
    // spawn features
    for (const k of Object.keys(this.timers)) this.timers[k] -= dt * (v / 150);
    if (this.timers.weed <= 0) { this.spawnFeature('weed'); this.timers.weed = rand(6, 9); }
    if (this.timers.birds <= 0) { this.spawnFeature('birds'); this.timers.birds = rand(10, 15); }
    if (this.timers.log <= 0) { this.spawnFeature('log'); this.timers.log = rand(14, 20); }
    if (this.timers.buoy <= 0) { this.spawnFeature('buoy'); this.timers.buoy = rand(1.1, 2.2); }
    if (this.timers.open <= 0) { this.spawnFish(chance(0.5) ? 'kingfish' : 'barracuda', W + 60, rand(150, H - 80), null); this.timers.open = rand(8, 14); }
    if (this.edgeAt.length && this.timeLeft < this.edgeAt[0]) { this.edgeAt.shift(); this.spawnFeature('edge'); }
    for (const f of this.features) {
      f.x -= v * dt;
      if (f.type === 'birds') for (const b of f.birds) b.a += dt * b.sp;
      if (f.type === 'buoy') {
        if (dist(f.x, f.y, bx + 20, this.by) < 26 && !f.hit) { f.hit = true; this.stall = 2.5; Game.toast('Wrapped a trap line!', { color: PAL.warn, size: 32, y: 130, sub: 'Cutting it out of the prop… (stalled)' }); SFX.play('fail'); Game.shake(5); }
        for (const L of this.lures) if (!L.fouled && dist(f.x, f.y, L.x, L.y) < 15) { L.fouled = 3.5; Game.toast('Lure fouled on a trap line', { color: PAL.warn, size: 26, y: 130 }); SFX.play('warn'); }
      }
      if (f.type === 'weed') for (const L of this.lures) {
        if (L.fouled || L.weedCd > t) continue;
        const ca = Math.cos(f.ang), sa = Math.sin(f.ang); const rx = (L.x - f.x) * ca + (L.y - f.y) * sa, ry = -(L.x - f.x) * sa + (L.y - f.y) * ca;
        if (rx > 0 && rx < f.len && Math.abs(ry) < 14) { L.weedCd = t + 3; if (chance(0.25)) { L.fouled = 2; this.fl.add(L.x, L.y - 20, 'weed on it', '#e8d27a', 16); } }
      }
    }
    this.features = this.features.filter((f) => f.x + (f.len || 120) > -200);
    // fish
    for (const fi of this.fish) {
      fi.t += dt; fi.cool = Math.max(0, fi.cool - dt);

  resize() { this.buildTerrain(); }

    const base = g.createLinearGradient(0, 0, 0, H); base.addColorStop(0, '#79cdbf'); base.addColorStop(1, '#a9dcc8'); g.fillStyle = base; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 26; i++) { g.fillStyle = rng() < 0.6 ? 'rgba(66,120,82,0.22)' : 'rgba(236,224,180,0.28)'; ell(g, rng() * W, 60 + rng() * (H - 60), 40 + rng() * 80, 22 + rng() * 40, rng() * 3); g.fill(); }
    for (let i = 0; i < 200; i++) { g.fillStyle = 'rgba(60,110,70,0.25)'; ell(g, rng() * W, 60 + rng() * H, 2 + rng() * 5, 1 + rng() * 3); g.fill(); }
    g.fillStyle = 'rgba(30,110,140,0.55)'; g.beginPath(); g.moveTo(0, 150); g.bezierCurveTo(W * 0.3, 110, W * 0.5, 210, W, 130); g.lineTo(W, 210); g.bezierCurveTo(W * 0.55, 280, W * 0.3, 190, 0, 240); g.closePath(); g.fill();
