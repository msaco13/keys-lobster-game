<meta name="theme-color" content="#0c2734">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Keys Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Shrikhand&display=swap">
<style>
  /* One full-screen canvas. The game commits to a single sunlit-water look in both themes. */
  :root { --bg: #041d29; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  html { box-sizing: border-box; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #wrap { position: relative; width: 100%; height: 100%; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Keys Crew, a Florida Keys lobstering and fishing game"></canvas></div>
<script>
/* ---- js/core.js ---- */
'use strict';
/* Keys Crew — core: math helpers, canvas + loop, input, immediate-mode buttons,
   synthesized audio, local storage, particles. Everything is drawn on one canvas
   in a logical space that is always 540 units tall and 720–1280 units wide. */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const approach = (v, target, rate, dt) => v + (target - v) * (1 - Math.exp(-rate * dt));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; t = clamp(t, 0, 1); return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
function angleDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtLb(w) { return (w >= 100 ? Math.round(w) : w.toFixed(1)) + ' lb'; }
function longDate(d = new Date()) { return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }

const FONT_D = '"Shrikhand", Georgia, "Times New Roman", serif';
const FONT_UI = '"Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
const fnt = (size, weight = 700) => `${weight} ${size}px ${FONT_UI}`;
const dfnt = (size) => `400 ${size}px ${FONT_D}`;

// Sun-bleached Keys palette: gelcoat white, deep Gulf Stream navy, lobster orange, sun yellow.
const PAL = {
  ink: '#0c2734', inkSoft: '#355564', panel: 'rgba(7,36,51,0.9)', panelLine: 'rgba(255,255,255,0.16)',
  foam: '#f7f3e8', sand: '#efdcae', coral: '#ff6a3d', sun: '#ffc845', sunDeep: '#c98b12',
  sea: '#0e7fa1', deep: '#08405e', shallow: '#62d0cf', good: '#3ccf7c', warn: '#ffad1f', bad: '#ff4f4f', mute: '#9fb8c2'
};

function text(ctx, s, x, y, o = {}) {
  let size = o.size || 20;
  const setFont = () => { ctx.font = o.display ? dfnt(size) : fnt(size, o.weight || 700); };
  setFont();
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.maxW) { while (size > 8 && ctx.measureText(s).width > o.maxW) { size -= 1; setFont(); } }
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(s, x + (o.sx || 0), y + (o.sy == null ? 3 : o.sy)); }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || 4; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || '#fff';
  ctx.fillText(s, x, y);
  if (o.alpha != null) ctx.globalAlpha = 1;
  return size;
}
function wrapText(ctx, s, maxW) {
  const words = String(s).split(' '); const lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function para(ctx, s, x, y, maxW, o = {}) {
  ctx.font = fnt(o.size || 18, o.weight || 500);
  const lines = wrapText(ctx, s, maxW); const lh = o.lh || (o.size || 18) * 1.3;
  lines.forEach((l, i) => text(ctx, l, x, y + i * lh, Object.assign({}, o, { size: o.size || 18, weight: o.weight || 500 })));
  return lines.length * lh;
}
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(ctx, x, y, w, h, o = {}) {
  ctx.save();
  if (o.shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(ctx, x, y + 5, w, h, o.r || 18); ctx.fill(); }
  ctx.fillStyle = o.fill || PAL.panel; rr(ctx, x, y, w, h, o.r || 18); ctx.fill();
  ctx.strokeStyle = o.line || PAL.panelLine; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

/* ---------- storage (per-browser conveniences only) ---------- */
const Store = {
  get(k, d) { try { const v = window.localStorage.getItem('keyscrew_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { window.localStorage.setItem('keyscrew_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { window.localStorage.removeItem('keyscrew_' + k); } catch (e) { /* storage unavailable */ } }
};

/* ---------- audio: everything is synthesized, nothing to download ----------
   one-shots + beds ──────────────────────────→ SFX.out ─┐
   music: voices → Music.ch → bus → muffle → duck → SFX.mus ─┼→ SFX.master (mute) → compressor → soft clip → speakers
   reverb sends (sounds and music) → convolver ─────────────┘
   Tonal and drum one-shots are rendered once into small buffers (SFX.buf) and replayed at any pitch
   with playbackRate, so a steel-pan note costs two nodes. The engine, water, sea and reel-drag beds
   are built the first time they're needed and torn down after a few seconds of silence. */
const SFX = {
  ac: null, master: null, out: null, mus: null, verbIn: null, muted: false, nb: null, sm: null, crk: null,
  bank: {}, waves: {}, timer: null, LEVEL: 0.62, st: null,
  engine: null, water: null, amb: null, drag: null,
  init() { this.muted = !!Store.get('muted', false); },
  unlock() {
    if (this.ac) { const s = this.ac.state; if (s !== 'running' && s !== 'closed' && !document.hidden && this.ac.resume) this.ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const ac = new AC(); this.build(ac);
      const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, ac.sampleRate); b.connect(ac.destination); b.start(0);   // finishes the unlock on older iOS
      if (ac.state === 'suspended' && ac.resume) ac.resume().catch(() => {});
    } catch (e) { this.ac = null; this.master = null; return; }
    try { Music.attach(); } catch (e) { console.warn('music unavailable', e); }
    if (this.wantAmb) this.setAmbient(this.wantAmb[0], this.wantAmb[1]);   // a scene asked for the sea before the first tap
    this.warm();
    if (!this.timer) this.timer = setInterval(() => { try { this.house(); } catch (e) { /* ambience never stops the game */ } }, 100);
    if (!this.vis) {
      this.vis = true;
      document.addEventListener('visibilitychange', () => { const ac = this.ac; if (!ac) return; try { if (document.hidden) ac.suspend().catch(() => {}); else ac.resume().catch(() => {}); } catch (e) { /* old Safari */ } });
    }
  },
  // the whole mixer, on any (Offline)AudioContext
  build(ac) {
    this.ac = ac; this.bank = {}; this.waves = {}; this.crk = null; this.engine = this.water = this.amb = this.drag = null;
    this.st = { eng: [-1, -1], amb: [-1, false], drag: [-1, -1], hull: 0, hullAuto: 0, hullScene: null };
    const sr = ac.sampleRate, G = (v, to) => { const g = ac.createGain(); g.gain.value = v; if (to) g.connect(to); return g; };
    const nb = ac.createBuffer(1, sr * 2, sr), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.nb = nb;
    // slow random wander (−1..1, a new target every half second, eased): swells, wobble, gusts
    const sm = ac.createBuffer(1, 8000 * 12, 8000), m = sm.getChannelData(0), P = [0];
    for (let k = 1; k < 24; k++) P.push(rand(-1, 1)); P.push(0);
    for (let i = 0; i < m.length; i++) { const k = Math.floor(i / 4000), u = (i % 4000) / 4000; m[i] = P[k] + (P[k + 1] - P[k]) * (0.5 - 0.5 * Math.cos(Math.PI * u)); }
    this.sm = sm;
    this.master = G(this.muted ? 0 : this.LEVEL);
    let tail = this.master;
    try { const c = ac.createDynamicsCompressor(); c.threshold.value = -9; c.knee.value = 8; c.ratio.value = 6; c.attack.value = 0.003; c.release.value = 0.2; tail.connect(c); tail = c; } catch (e) { /* no compressor */ }
    try {
      const ws = ac.createWaveShaper(), n = 2048, cv = new Float32Array(n);   // transparent below 0.75, rounds anything hotter off below 1
      for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1, a = Math.abs(x); cv[i] = Math.sign(x) * (a < 0.75 ? a : 0.75 + 0.24 * Math.tanh((a - 0.75) / 0.24)); }
      ws.curve = cv; tail.connect(ws); tail = ws;
    } catch (e) { /* no shaper */ }
    tail.connect(ac.destination);
    this.out = G(1, this.master); this.mus = G(0.62, this.master); this.verbIn = null;
    try { const cv = ac.createConvolver(); cv.buffer = this.impulse(1.5); const vi = G(1); vi.connect(cv); cv.connect(G(0.42, this.master)); this.verbIn = vi; } catch (e) { /* dry */ }
  },
  impulse(len) { // a soft plate: early taps, then a tail that darkens as it dies
    const ac = this.ac, sr = ac.sampleRate, n = Math.floor(sr * len), b = ac.createBuffer(2, n, sr), pre = Math.floor(sr * 0.011);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c); let lp = 0;
      for (let i = pre; i < n; i++) { const u = (i - pre) / (n - pre); lp += (Math.random() * 2 - 1 - lp) * (0.85 - 0.6 * u); d[i] = lp * Math.pow(1 - u, 2) * Math.exp(-3.2 * u); }
      for (let k = 0; k < 6; k++) { const i = pre + Math.floor(sr * rand(0.004, 0.05)); d[i] += rand(-0.5, 0.5); }
    }
    return b;
  },
  house() { // ten times a second: ambient events, and put idle beds to sleep
    const ac = this.ac; if (!ac || ac.state !== 'running') return;
    const now = ac.currentTime, s = this.st;
    if (s.hull && typeof Game !== 'undefined' && Game.scene !== s.hullScene) { s.hull = 0; this.hullApply(); }
    this.ambEvents(now, 0.45);
    for (const k of ['engine', 'water', 'amb', 'drag']) { const b = this[k]; if (b && b.off != null && now - b.off > 3) this.sleep(k); }
  },
  sleep(k) {
    const b = this[k]; if (!b) return; this[k] = null;
    for (const n of b.src) { try { n.stop(); } catch (e) { /* already stopped */ } }
    try { b.g.disconnect(); } catch (e) { /* gone */ }
    if (k === 'engine') this.st.eng = [-1, -1]; else if (k === 'amb') this.st.amb = [-1, false]; else if (k === 'drag') this.st.drag = [-1, -1];
  },
  warm() { // render the rest of the sample bank in small idle slices after the first tap, so no song or sound waits on it
    const q = ['steel', 'kick', 'shaker', 'rim', 'conga', 'marimba', 'bell', 'hat', 'snare', 'pluck', 'crash', 'tom', 'clap', 'cowbell', 'boom', 'ratchet', 'clave'];
    const next = () => { const n = q.shift(), d = n && this.SMP[n]; if (!d || !this.ac) return; try { for (const b of d.bases || [0]) this.buf(n, b || 1); } catch (e) { return; } setTimeout(next, 40); };
    setTimeout(next, 150);
  },
  setMuted(m) { this.muted = m; Store.set('muted', m); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : this.LEVEL, this.ac.currentTime, 0.05); },

  /* ----- building blocks for the beds ----- */
  kit() {
    const ac = this.ac, t = ac.currentTime, src = [];
    return {
      src, t,
      G: (v, to) => { const g = ac.createGain(); g.gain.value = v; if (to) g.connect(to); return g; },
      F: (type, f, q, to) => { const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; if (to) fl.connect(to); return fl; },
      O: (f, w) => { const o = ac.createOscillator(); if (w && this.WAVES[w]) o.setPeriodicWave(this.wave(w)); else o.type = w || 'sine'; o.frequency.value = f; o.start(t); src.push(o); return o; },
      B: (buf, rate) => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.playbackRate.value = rate || 1; s.start(t, Math.random() * buf.duration * 0.9); src.push(s); return s; }
    };
  },
  WAVES: { // PeriodicWave recipes: n → [cos, sin] amplitude of harmonic n
    pulse: (n) => [Math.sin(n * Math.PI * 0.17) / n, 0],      // an exhaust-pulse train for the outboards
    ratchet: (n) => [n < 64 ? Math.sin(n * Math.PI * 0.035) / n : 0, 0],  // reel pawl clicks
    bass: (n) => [0, [0, 1, 0.42, 0.16, 0.07, 0.03][n] || 0],
    organ: (n) => [0, [0, 1, 0.65, 0.18, 0.42, 0.06, 0.14, 0, 0.1][n] || 0],
    flute: (n) => [0, [0, 1, 0.16, 0.06, 0.025][n] || 0],
    reed: (n) => [0, n < 14 ? (n % 2 ? 1 : 0.35) / n : 0]
  },
  wave(name) {
    if (this.waves[name]) return this.waves[name];
    const N = 72, re = new Float32Array(N), im = new Float32Array(N), f = this.WAVES[name];
    for (let n = 1; n < N; n++) { const [a, b] = f(n); re[n] = a; im[n] = b; }
    return (this.waves[name] = this.ac.createPeriodicWave(re, im));
  },

  /* ----- twin outboards ----- */
  mkEngine() {
    const { src, G, F, O, B } = this.kit();
    const g = G(0, this.out), am = G(0.7, g), lp = F('lowpass', 300, 1.5, am);
    const a = O(36, 'pulse'), b = O(36.4, 'pulse'), sub = O(18);
    a.connect(G(0.5, lp)); b.connect(G(0.42, lp)); const gs = G(0.6, lp); sub.connect(gs);
    // wobble: each engine drifts on its own slow LFO, plus a shared random waver
    O(0.53).connect(G(7, a.detune)); O(0.81).connect(G(9, b.detune));
    const jg = G(14); B(this.sm, 1.7).connect(jg); jg.connect(a.detune); jg.connect(b.detune); jg.connect(sub.detune);
    // idle burble: exhaust bubbling out through the prop hubs
    const bur = O(7), bg = G(0.4, am.gain); bur.connect(bg);
    const n = B(this.nb, 1), ib = F('bandpass', 230, 0.9), ig = G(0.5, am); n.connect(ib); ib.connect(ig);
    // full-throttle gearcase whine and intake whoosh
    const wh = O(260, 'triangle'), wg = G(0, g); wh.connect(wg);
    const ab = F('bandpass', 1500, 0.6), ag = G(0, g); n.connect(ab); ab.connect(ag);
    return { src, g, lp, a, b, sub, gs, bur, bg, ig, wh, wg, ab, ag, off: null };
  },
  setEngine(level, rpm = 0) {
    if (!this.ac) return;
    const L = clamp(+level || 0, 0, 1), r = clamp(+rpm || 0, 0, 1), s = this.st;
    if (Math.abs(L - s.eng[0]) < 0.005 && Math.abs(r - s.eng[1]) < 0.004) return;   // called every frame: only touch params on a change
    s.eng[0] = L; s.eng[1] = r; s.hullAuto = L * Math.pow(r, 1.2); this.hullApply();
    let e = this.engine; if (!e) { if (!L) return; e = this.engine = this.mkEngine(); }
    const t = this.ac.currentTime, f = 34 + 120 * Math.pow(r, 0.9), idle = Math.pow(1 - r, 2);
    e.off = L ? null : t;
    e.g.gain.setTargetAtTime(L * (0.05 + 0.08 * r), t, L ? 0.15 : 0.35);
    e.a.frequency.setTargetAtTime(f, t, 0.3); e.b.frequency.setTargetAtTime(f * 1.011, t, 0.36); e.sub.frequency.setTargetAtTime(f / 2, t, 0.3);
    e.lp.frequency.setTargetAtTime(240 + 2600 * Math.pow(r, 1.3), t, 0.09);   // opens ahead of the revs: sounds like the props biting
    e.gs.gain.setTargetAtTime(0.65 - 0.45 * r, t, 0.2);
    e.bur.frequency.setTargetAtTime(6.5 + 11 * r, t, 0.3); e.bg.gain.setTargetAtTime(0.03 + 0.42 * idle, t, 0.2); e.ig.gain.setTargetAtTime(0.7 * idle, t, 0.2);
    e.wh.frequency.setTargetAtTime(f * 7.3, t, 0.3); e.wg.gain.setTargetAtTime(0.035 * Math.pow(r, 2.4), t, 0.2);
    e.ab.frequency.setTargetAtTime(900 + 1600 * r, t, 0.2); e.ag.gain.setTargetAtTime(0.4 * Math.pow(r, 1.6), t, 0.2);
  },
  /* ----- water rushing past the hull (follows the engine; setHull adds to it) ----- */
  mkWater() {
    const { src, G, F, B } = this.kit();
    const g = G(0, this.out), n = B(this.nb, 1), hg = G(0.6, g), lp = F('lowpass', 1200, 0.6, hg), hp = F('highpass', 380, 0.5, lp); n.connect(hp);
    const mg = G(0.38, hg.gain); B(this.sm, 2.3).connect(mg);   // the rush rises and falls with the swells
    const rl = F('lowpass', 150, 0.8), rg = G(0, g); n.connect(rl); rl.connect(rg);
    return { src, g, lp, rg, off: null };
  },
  hullApply() {
    const s = this.st, L = Math.max(s.hull, s.hullAuto);
    let w = this.water; if (!w) { if (L < 0.01) return; w = this.water = this.mkWater(); }
    const t = this.ac.currentTime;
    w.g.gain.setTargetAtTime(L * 0.07, t, 0.25); w.lp.frequency.setTargetAtTime(800 + 5000 * L, t, 0.3); w.rg.gain.setTargetAtTime(1.2 * L, t, 0.3);
    w.off = L < 0.01 ? t : null;
  },
  setHull(level) { // 0..1 extra water rush (drifting in a chop, a wake) — call it every frame like setEngine; it clears itself on a scene change
    if (!this.ac) return; const L = clamp(+level || 0, 0, 1), s = this.st;
    s.hullScene = typeof Game !== 'undefined' ? Game.scene : null;
    if (Math.abs(L - s.hull) < 0.01) return; s.hull = L; this.hullApply();
  },
  /* ----- the sea: lapping wash, surf hiss and far gulls up top; a muffled, bubbly bed under ----- */
  mkAmb() {
    const { src, G, F, B } = this.kit();
    const g = G(0, this.out), top = G(1, g), und = G(0.0001, g), n = B(this.nb, 1), n2 = B(this.nb, 0.93), sw = B(this.sm, 1);
    const wg = G(0.55, top), wl = F('lowpass', 520, 0.5, wg); n.connect(wl); sw.connect(G(0.42, wg.gain));
    const hg = G(0.08, top), hb = F('bandpass', 2400, 0.5, hg); n2.connect(hb); sw.connect(G(0.05, hg.gain));
    const ug = G(0.75, und), ul = F('lowpass', 210, 0.7, ug); n2.connect(ul); sw.connect(G(0.4, ug.gain));
    const cg = G(0.5, und), ch = F('highpass', 2200, 0.6, cg); B(this.crackle(), 1).connect(ch);   // snapping shrimp, far off on the reef
    return { src, g, top, und, off: null, L: 0, under: false, nl: 0, ng: 0, nb: 0 };
  },
  crackle() {
    if (this.crk) return this.crk;
    const sr = 24000, n = sr * 4, b = this.ac.createBuffer(1, n, sr), d = b.getChannelData(0);
    for (let k = 0; k < 4 * 60; k++) { const i0 = randi(0, n - 40), a = Math.pow(Math.random(), 3) * (chance(0.5) ? 1 : -1); for (let j = 0; j < 24; j++) d[i0 + j] += a * Math.exp(-j / 3) * (j % 2 ? -1 : 1); }
    return (this.crk = b);
  },
  setAmbient(level, under) {
    this.wantAmb = [level, under];
    if (!this.ac) return; const L = clamp(+level || 0, 0, 1), u = !!under, s = this.st;
    if (Math.abs(L - s.amb[0]) < 0.01 && u === s.amb[1]) return; s.amb[0] = L; s.amb[1] = u;
    let a = this.amb; if (!a) { if (!L) return; a = this.amb = this.mkAmb(); }

      for (let guard = 0; guard < 6; guard++) { const hit = placed.find((p) => Math.abs(p.y - y) < (p.h + h) / 2); if (!hit) break; y = hit.y + (hit.h + h) / 2 + 4; }
      placed.push({ y, h });
      ctx.save(); ctx.translate(this.W / 2, y); ctx.scale(a, a); ctx.globalAlpha = fadeOut;
      text(ctx, t.msg, 0, 0, { size: t.size, display: true, align: 'center', base: 'middle', color: t.color, stroke: 'rgba(4,28,40,0.9)', sw: 8, maxW: this.W - 60 });
      if (t.sub) text(ctx, t.sub, 0, t.size * 0.85, { size: 18, align: 'center', base: 'middle', color: '#fff', stroke: 'rgba(4,28,40,0.9)', sw: 5, weight: 700, maxW: this.W - 60 });
      ctx.restore();
    }
  }
};

function rollWeight(key, perks) {
  const sp = SPECIES[key]; const k = 2.3 / ((perks && perks.trophy) || 1);
  const r = Math.pow(Math.random(), k);
  return Math.round((sp.min + (sp.max - sp.min) * r) * 10) / 10;
}
function sizeNorm(key, w) { const sp = SPECIES[key]; return clamp((w - sp.min) / (sp.max - sp.min), 0, 1); }

// Build a scored catch record. extras: [{label, pts}]
function makeCatch(key, weight, ch, spot, extras = []) {
  const sp = SPECIES[key];
  const lines = [{ label: fmtLb(weight) + ' × ' + sp.mult, pts: Math.round(weight * sp.mult) }];
  const trophy = sizeNorm(key, weight) >= 0.72;
  if (trophy) lines.push({ label: 'Trophy', pts: Math.round(weight * sp.mult * 0.2) });
  if (sp.release && sp.relBonus) lines.push({ label: 'Clean release', pts: sp.relBonus });
  for (const e of extras) lines.push(e);
  const pts = lines.reduce((a, l) => a + l.pts, 0);
  return { key, name: sp.name, weight, ch, spot, trophy, released: !!sp.release, lines, pts, at: Date.now() };
}

/* ---------- trip state (saved after every turn so a phone nap doesn't wipe the day) ---------- */
const Trip = {
  cur: null,
  start(o) {
    const scores = {}; o.crew.forEach((c) => (scores[c] = 0));
    this.cur = {
      id: Date.now(), mode: o.mode, crew: o.crew.slice(), plan: o.plan,
      spotsNeeded: o.plan === 'full' ? 4 : o.plan === 'half' ? 2 : 0,
      sessionLen: o.sessionLen, weather: o.weather || rollWeather(), date: new Date().toISOString(),
      done: [], spot: null, turn: 0, scores, catches: [], turns: [], legs: 0, boat: null, found: [],
      bounties: o.bounties || Bounties.roll()   // the day's three goals (the briefing screen rolls them first so it can show them)
    };
    this.save();
  },
  save() { if (this.cur && this.cur.mode === 'crew') Store.set('trip', this.cur); },
  load() { const t = Store.get('trip', null); return t && t.crew && t.scores ? t : null; },
  resume() { this.cur = this.load(); return !!this.cur; },
  clear() { Store.del('trip'); },
  get player() { return this.cur.crew[this.cur.turn]; },
  record(ch, spot, res) {
    const c = this.cur;
    Records.add(res.catches);          // first: marks personal bests (k.pb) and first-ever catches (k.isNew)
    Bounties.apply(ch, spot, res);     // then any bounty this turn finishes adds its line and bonus to the turn
    c.scores[ch] = (c.scores[ch] || 0) + res.total;
    for (const k of res.catches) c.catches.push(k);
    c.turns.push({ ch, spot, total: res.total, n: res.catches.length });
    this.save();
  },
  leader() {
    const c = this.cur; let best = null;
    for (const ch of c.crew) if (!best || c.scores[ch] > c.scores[best]) best = ch;
    return best;
  }
};

const Records = {
  all() { return Store.get('records', {}); },
  add(catches) {
    const rec = this.all(); let changed = false;
    for (const k of catches) {
      if (!k || !k.weight || k.fine) continue;
      const r = rec[k.key];
      if (!r) k.isNew = true;   // never logged before: a new species for the logbook
      if (!r || k.weight > r.w) { rec[k.key] = { w: k.weight, ch: k.ch, date: new Date().toISOString() }; changed = true; k.pb = true; }
    }
    if (changed) Store.set('records', rec);
  },
  isRecord(key, w) { const r = this.all()[key]; return !r || w > r.w; },
  trips() { return Store.get('trips', []); },
  addTrip(t) { const list = this.trips(); list.unshift(t); Store.set('trips', list.slice(0, 12)); }
};

const Bounties = {
  DEFS: BOUNTY_DEFS,
  // where a bounty can be done: the spots whose water holds its species ([] means anywhere)
  spotsFor(id) { const d = BOUNTY_DEFS[id]; return d && d.sp ? SPOT_ORDER.filter((s) => SPOTS[s].species.some((k) => d.sp.includes(k))) : []; },
  make(id) { const d = BOUNTY_DEFS[id]; return { id, text: d.text, short: d.short, bonus: d.bonus, icon: d.icon, group: d.group, where: this.spotsFor(id), done: false, by: null, spot: null }; },
  // three for the day, from different parts of the Keys: usually two places plus one you can do anywhere
  roll(n = 3) {

    const ok = (id) => { const d = BOUNTY_DEFS[id]; return !d.need || d.need(known, rec); };
    const groups = BOUNTY_GROUPS.slice().sort(() => Math.random() - 0.5).slice(0, chance(0.7) ? n - 1 : n);
    if (groups.length < n) groups.push('any');
    return groups.map((g) => {
      const ids = Object.keys(BOUNTY_DEFS).filter((id) => BOUNTY_DEFS[id].group === g && ok(id));

      const wt = (id) => (BOUNTY_DEFS[id].w || 1) * (this.spotsFor(id).length && !this.spotsFor(id).some((s) => known.has(s)) ? 0.4 : 1);

  },
  list(c = Trip.cur) { return (c && c.bounties) || []; },
  open(c = Trip.cur) { return this.list(c).filter((b) => !b.done); },
  // can this bounty still be finished at this spot?
  here(b, spot) { if (b.done) return false; const d = BOUNTY_DEFS[b.id]; if (d && d.sea) return false; return !b.where || !b.where.length || b.where.includes(spot); },

  check(ch, spot, res, c = Trip.cur) {
    if (!c || !c.bounties || !res) return [];
    const turn = (res.catches || []).filter(Boolean);
    const day = (c.catches || []).filter((k) => k && k.ch === ch).concat(turn);

  },
  // the boat scene calls this when a spot gets discovered: pays "Find a new spot" straight to that captain's score.
  // Returns the bounties it completed (empty when there was nothing to pay) so the scene can celebrate.
  found(spotId, ch) {

/* ================= SEA LIFE, OTHER BOATS, AND BILLBOARDS FOR THE CHASE CAMERA ================= */
/* Top-down sprites (the overhead view) take (ctx, x, y, s, ang, o): origin at the center, facing +x at ang 0.
   Boats use the drawBoatTop scale (s = 1: a 24 ft center console is ~175 px bow to engines);
   creatures and birds list their own size at s = 1. Light comes from the upper left of the
   screen whatever the heading, so shadows always fall down and to the right.
   The side-view billboards for the chase camera are further down. Test sheet: test/seaart.mjs. */

function saBegin(ctx, x, y, s, ang) { ctx.save(); ctx.translate(x, y); if (ang) ctx.rotate(ang); if (s !== 1) ctx.scale(s, s); }
// a screen-space offset (px) expressed in a rotated, scaled sprite's local units
function saOff(ang, s, dx, dy) { const c = Math.cos(ang), n = Math.sin(ang); return [(dx * c + dy * n) / s, (-dx * n + dy * c) / s]; }
function saHex(r, g, b) { return '#' + ((1 << 24) | (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255)).toString(16).slice(1); }

function saLum(h) { const p = hexRgb(h); return (p[0] * 0.299 + p[1] * 0.587 + p[2] * 0.114) / 255; }
function saFrac(v) { return v - Math.floor(v); }
const SA_DEEP = '#1b5f86';   // what an animal's colors fade toward the deeper it swims
// a smooth closed (or open) curve through points (Catmull-Rom)
function saSmooth(ctx, P, closed = true) {
  const n = P.length, at = (i) => (closed ? P[(i + n) % n] : P[clamp(i, 0, n - 1)]);
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }

}
// mirror a half outline (nose → tail along the −y side, both ends on the axis) into a closed symmetric one
function saSym(half) { const out = half.slice(); for (let i = half.length - 2; i > 0; i--) out.push([half[i][0], -half[i][1]]); return out; }
// a gradient that is light on the sun side of a rotated sprite
function saLightGrad(ctx, ang, r, c1, c2, c3) {
  const [lx, ly] = saOff(ang, 1, -0.6, -0.8);
  const g = ctx.createLinearGradient(lx * r, ly * r, -lx * r, -ly * r);
  g.addColorStop(0, c1); if (c3) { g.addColorStop(0.5, c2); g.addColorStop(1, c3); } else g.addColorStop(1, c2);

function saDots(ctx, list) { ctx.beginPath(); for (const d of list) { ctx.moveTo(d[0] + d[2] * Math.cos(d[4] || 0), d[1] + d[2] * Math.sin(d[4] || 0)); ctx.ellipse(d[0], d[1], d[2], d[3], d[4] || 0, 0, TAU); } }
// soft dark halo that lifts an underwater animal off the water at any size
function saHalo(ctx, x, y, rx, ry, a = 0.16) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, 1); g.addColorStop(0, `rgba(3,28,44,${a})`); g.addColorStop(0.6, `rgba(3,28,44,${a * 0.75})`); g.addColorStop(1, 'rgba(3,28,44,0)');
  ctx.save(); ctx.translate(x, y); ctx.scale(rx, ry); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore();
}

'use strict';

   running a fish fight on top of the spot, and packaging the results. */

class SessionBase {
  constructor(o) {
    this.o = o; this.ch = o.ch; this.C = CHARS[o.ch]; this.perks = this.C.perks; this.spot = o.spot;
    this.weather = o.weather || { id: 'light', name: 'Light chop', vis: 1, drift: 0.5, aim: 1 };
    this.len = o.len || 120; this.timeLeft = this.len; this.t = 0;
    this.paused = false; this.quitAsk = false; this.leaving = false; this.ended = false; this.endT = 0; this.endReason = null;
    this.catches = []; this.extraLines = []; this.score = 0;
    this.parts = new Particles(); this.fl = new Floaters(); this.child = null; this.music = 'boat';
  }
  tickTime(dt) {
    if (this.timeLeft <= 0) return;
    const before = this.timeLeft; this.timeLeft = Math.max(0, this.timeLeft - dt);
    if (before > 10 && this.timeLeft <= 10) { Game.toast('10 seconds left!', { color: PAL.sun, size: 30, y: 110 }); SFX.play('warn'); }
    if (this.timeLeft <= 0 && this.child) Game.toast('Last fish! Land it!', { color: PAL.sun, size: 30, y: 110 });
  }
  addCatch(c) { this.catches.push(c); this.score += c.pts; }
  addLine(label, pts) { this.extraLines.push({ label, pts }); this.score += pts; }
  startFight(opts) {
    const fs = new FightScene(Object.assign({
      ch: this.ch, spot: this.spot, weather: this.weather,
      tick: (dt) => this.tickTime(dt), timeLeft: () => this.timeLeft,
      onDone: (r) => { this.child = null; Music.play(this.music); if (r.ok) this.addCatch(r.catch); if (this.onFightDone) this.onFightDone(r); if (this.timeLeft <= 0) this.end('time'); }
    }, opts));
    this.child = fs; fs.enter();
  }
  end(reason) {
    if (this.ended) return;
    this.ended = true; this.endT = 0; this.endReason = reason; SFX.setDrag(0);
    const msg = reason === 'limit' ? 'Limited out!' : reason === 'quit' ? 'Heading in' : 'Time’s up!';
    Game.toast(msg, { color: PAL.sun, size: 52, dur: 1.6, y: Game.H / 2 - 20 });
    SFX.play('horn');
  }
  buildResult() {
    const lines = this.catches.map((c) => ({ label: c.name + ' · ' + fmtLb(c.weight), pts: c.pts, key: c.key, trophy: c.trophy }));
    for (const l of this.extraLines) lines.push(l);
    const total = Math.max(0, lines.reduce((a, l) => a + l.pts, 0));
    let best = null; for (const c of this.catches) if (!best || c.pts > best.pts) best = c;
    return { catches: this.catches, lines, total, best, header: this.resultHeader || null };
  }
  finish() { if (this.finished) return; this.finished = true; SFX.setDrag(0); SFX.setAmbient(0); this.o.onEnd(this.buildResult()); }
  // returns true when the subclass should skip its own update
  baseUpdate(dt) {
    if (this.paused || this.leaving) return true;   // a fish fight freezes too
    if (this.child) { this.child.update(dt); return true; }
    this.t += dt; this.parts.update(dt); this.fl.update(dt);
    if (this.ended) { this.endT += dt; if (this.endT > 1.7) this.finish(); return true; }
    this.tickTime(dt);
    if (this.timeLeft <= 0 && !this.child) { this.end('time'); return true; }
    return false;
  }
  togglePause() { if (this.ended || this.leaving) return; this.setPaused(!this.paused); }
  setPaused(on) { this.paused = on; this.quitAsk = false; SFX.setDrag(0); if (on) Game.toasts = []; }  // toasts draw above everything, so clear them off the menu
  // leave mid-turn: this turn never reaches the results. Trip.cur still points at this spot and angler,
  // so Resume trip on the title screen hands the phone right back to them.
  quitToTitle() {
    if (this.leaving) return;
    this.leaving = true; this.finished = true; SFX.setDrag(0); SFX.setAmbient(0);
    if (Trip.cur && Trip.cur.mode === 'crew') Trip.save();
    Game.go(new TitleScene());
  }
  basePointerDown(p) {
    if (this.paused || this.leaving) return true;
    if (this.child) { this.child.pointerDown(p); return true; }
    return this.ended;
  }
  baseKeyDown(c) {
    if (c === 'Escape' || c === 'KeyP') { if (this.quitAsk) this.quitAsk = false; else this.togglePause(); return true; }
    if (this.paused || this.leaving) return true;
    if (this.child) { this.child.keyDown(c); return true; }
    return this.ended;
  }
  drawTopBar(ctx) {
    const W = Game.W;
    UI.button(ctx, 'pause', 14, 12, 46, 46, '❚❚', () => this.togglePause(), { style: 'dark', size: 16, r: 14 });
    panel(ctx, 70, 12, 196, 46, { r: 23 });
    ctx.save(); ell(ctx, 93, 35, 19, 19); ctx.clip(); ctx.fillStyle = '#7fc8e8'; ctx.fillRect(70, 12, 46, 46); drawHead(ctx, this.C, 93, 40, 15); ctx.restore();
    ctx.strokeStyle = this.C.color; ctx.lineWidth = 2.5; ell(ctx, 93, 35, 19, 19); ctx.stroke();
    text(ctx, this.C.name, 120, 31, { size: 17, weight: 800, color: '#fff' });
    text(ctx, this.score.toLocaleString() + ' pts', 120, 50, { size: 15, weight: 700, color: PAL.sun });
    drawTimerPill(ctx, W / 2, 35, this.timeLeft);
  }
  drawPause(ctx) {
    const W = Game.W, H = Game.H, cx = W / 2, crew = Trip.cur && Trip.cur.mode === 'crew';
    for (const r of UI.regions) r.disabled = true;   // nothing under the menu answers clicks or hotkeys while paused
    ctx.fillStyle = 'rgba(3,22,32,0.86)'; ctx.fillRect(0, 0, W, H);
    if (this.quitAsk) return this.drawQuitAsk(ctx, crew);
    text(ctx, 'Paused', cx, 130, { display: true, size: 54, align: 'center', color: '#fff' });
    text(ctx, SPOTS[this.spot].name + ' · ' + fmtTime(this.timeLeft) + ' left', cx, 168, { size: 20, align: 'center', color: '#cfe3ea', weight: 600 });
    UI.button(ctx, 'resume', cx - 130, 194, 260, 56, 'Resume', () => this.setPaused(false), { key: 'Escape|Enter|Space', size: 22 });
    UI.button(ctx, 'mute', cx - 130, 264, 125, 48, SFX.muted ? 'Sound: off' : 'Sound: on', () => SFX.setMuted(!SFX.muted), { style: 'secondary', size: 17 });
    UI.button(ctx, 'music', cx + 5, 264, 125, 48, Music.on ? 'Music: on' : 'Music: off', () => Music.setOn(!Music.on), { style: 'secondary', size: 17 });
    UI.button(ctx, 'quit', cx - 130, 326, 260, 56, 'End my turn now', () => { this.setPaused(false); this.end('quit'); }, { style: 'coral', size: 20, sub: this.child ? 'Right after this fish' : 'Your catches so far still count' });
    UI.button(ctx, 'totitle', cx - 130, 398, 260, 52, 'Quit to title', () => (this.quitAsk = true), { style: 'ghost', size: 19, sub: crew ? 'Your trip is saved' : 'Ends your solo day' });
  }
  drawQuitAsk(ctx, crew) {
    const W = Game.W, cx = W / 2;
    text(ctx, crew ? 'Leave the trip?' : 'Leave your day?', cx, 150, { display: true, size: 46, align: 'center', color: '#fff', maxW: W - 60 });
    const lines = crew
      ? ['Your trip is saved. Pick it up with Resume trip on the title screen.', 'This turn won’t count. ' + this.C.name + ' starts it over when you come back.']
      : ['Solo days aren’t saved, so your day ends here.', 'This turn won’t count. Bests from earlier turns stay in the logbook.'];
    lines.forEach((l, i) => text(ctx, l, cx, 202 + i * 30, { size: 19, align: 'center', color: '#cfe3ea', weight: 600, maxW: W - 70 }));
    UI.button(ctx, 'quitno', cx - 230, 280, 220, 56, 'Cancel', () => (this.quitAsk = false), { style: 'ghost', size: 20, key: 'Escape' });
    UI.button(ctx, 'quityes', cx + 10, 280, 220, 56, 'Quit to title', () => this.quitToTitle(), { style: 'coral', size: 20 });
  }
  // during a fish fight the fight draws the whole screen; keep a pause button on it, next to the clock
  drawChildOrNull(ctx) {
    if (!this.child) return false;
    this.child.draw(ctx);
    if (!this.ended && this.child.phase !== 'over') UI.button(ctx, 'pause', Game.W / 2 + 68, 14, 44, 40, '❚❚', () => this.togglePause(), { style: 'dark', size: 15, r: 14 });
    if (this.paused) this.drawPause(ctx);
    return true;
  }
}

'use strict';
/* Keys Crew — Bug Hunt. Free-dive the reef for spiny lobster.
   Hold on a hole (or TICKLE) to coax the bug out, and let go when it twitches. When it walks out,
   click or tap it to swing the net. Lobsters tail-flip backward toward their hole, so a net set
   behind one catches it. Gauge every bug: carapace over 3", no eggs. Six per person.
   Now and then a shark shows up, and you race it back to the boat. */

const BH = { SURF: 96, BAG: 6, BOATX: 660 };
const GAUGE_IN = 3.0;
const NET = { REACH: 170, HOOP: 30, SWING: 0.2, SET: 1.3, COOL: 0.3 };
const BH_SITES = {
  patch: { WW: 3400, floor: 500, ledgeH: [62, 120], gap: [150, 260], bugs: 6, morays: 3, extra: 0.3, shark: 0.35, gold: 1, big: 1, short: 0.34, grade: 0.16 },
  reef: { WW: 4300, floor: 700, ledgeH: [110, 240], gap: [120, 220], bugs: 9, morays: 5, extra: 0.35, shark: 0.55, gold: 2, big: 1.7, short: 0.24, grade: 0.36, light: true }
};

function rollCL(perks, site) {
  const r = Math.random(), sh = site ? site.short : 0.3;
  if (r < sh) return Math.round(rand(2.45, 2.97) * 100) / 100;
  if (r < sh + 0.12) return Math.round(rand(2.95, 3.1) * 100) / 100;
  const big = chance(0.16 * ((perks && perks.trophy) || 1) * (site ? site.big : 1));
  return Math.round((3.1 + Math.pow(Math.random(), 1.7) * (big ? 2.9 : 1.6)) * 100) / 100;
}
const lobsterWeight = (cl) => Math.round(0.034 * Math.pow(cl, 2.9) * 10) / 10;
const bugLen = (lob) => 46 + lob.cl * 5;

// what the rest of the crew yells from the boat
const QUIPS = {
  nice: ['Nice bug!', 'That’s dinner!', 'Look at that thing!', 'Into the cooler!'],
  big: ['THAT’S a big boy!', 'Big boy alert!', 'Now THAT’S a bug!'],
  short: ['Uh… that looked short.', 'FWC is gonna love that one.', 'Bro. Gauge it again.'],
  moray: ['HAHAHA wrong hole!', 'Morays bite, bro!', 'That’s an eel house!'],
  jelly: ['Jellies, man.', 'Watch the jellies!'],
  blackout: ['Breathe, bro!', 'Got you. Easy now.'],
  shark: ['SHARK!! Back to the boat!', 'Uhh… SHARK! SWIM!', 'SHARK! Move, move, move!'],
  escape: ['Never seen you swim that fast!', 'Bro walked on water.', 'I was gonna film it.', 'Still counts as a dive.'],
  caught: ['That’s the tax man!', 'He took a bug! HAHA', 'Sharks gotta eat too.'],
  gold: ['Is that… GOLD?!', 'No way. A golden bug!'],
  octo: ['Inked! HAHA', 'The octopus wins that one.'],
  miss: ['Tail-flipped you!', 'So close!', 'Net BEHIND it, bro!'],
  pro: ['Textbook!', 'Right into the net. Clean.', 'That’s how it’s done.'],
  empty: ['Nobody home.', 'Empty hole, bro.']
};

// a tiling caustic pattern (the bright net of light on the sand), built once
let BH_CAUSTIC = null;
function causticTile() {
  if (BH_CAUSTIC) return BH_CAUSTIC;
  const S = 192, c = document.createElement('canvas'); c.width = S; c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), rng = mulberry(99), pts = [];
  for (let i = 0; i < 16; i++) pts.push([rng() * S, rng() * S]);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let d1 = 1e9, d2 = 1e9;
    for (const [px, py] of pts) for (let oy = -S; oy <= S; oy += S) for (let ox = -S; ox <= S; ox += S) { const dd = Math.hypot(x - px - ox, y - py - oy); if (dd < d1) { d2 = d1; d1 = dd; } else if (dd < d2) d2 = dd; }
    const k = Math.max(0, 1 - (d2 - d1) / 10), p = (y * S + x) * 4;
    img.data[p] = 255; img.data[p + 1] = 255; img.data[p + 2] = 230; img.data[p + 3] = Math.round(255 * k * k);
  }
  g.putImageData(img, 0, 0);
  return (BH_CAUSTIC = c);
}

class BugHuntScene extends SessionBase {
  constructor(o) {
    super(o);
    const v = (SPOTS[o.spot] && SPOTS[o.spot].variant) || 'patch';
    this.variant = BH_SITES[v] ? v : 'patch'; this.site = BH_SITES[this.variant]; this.WW = this.site.WW;
    this.music = 'reef';
    this.resultHeader = 'FWC check at the ramp';
    this.diver = { x: BH.BOATX + 70, y: BH.SURF - 26, vx: 0, vy: 0, facing: 1, stun: 0 };
    this.intro = { t: 0 };
    this.maxBreath = 24 * this.perks.breath; this.breath = this.maxBreath;
    this.bag = []; this.out = null; this.gauge = null; this.blackout = 0; this.beatT = 0;
    this.joy = null; this.press = null; this.tickPtr = null; this.actionPtr = null; this.actionPress = false; this.cam = 0; this.camY = 0; this.goodReleases = 0;
    this.net = { state: 'carry', t: 0, x: 0, y: 0, cool: 0 }; this.seek = null; this.swings = 0;
    let others = (Trip.cur && Trip.cur.crew ? Trip.cur.crew : CHAR_ORDER).filter((c) => c !== this.ch).slice(0, 2);
    if (!others.length) others = CHAR_ORDER.filter((c) => c !== this.ch);
    this.others = others;
    this.quip = null; this.wasUnder = false; this.exhaleT = 2;
    this.coach = !Store.get('coach_bug2_' + this.ch, false); this.coachSaw = {};
    this.shark = null; this.sharkDone = false;
    this.sharkAt = o.shark === true ? 6 : o.shark === false ? null : chance(this.site.shark) ? rand(this.len * 0.22, this.len * 0.62) : null;
    this.gen();
  }
  enter() {
    SFX.setAmbient(1, false); Music.play('reef');
    Game.toast(SPOTS[this.spot] ? SPOTS[this.spot].name : 'Bug Hunt', { color: PAL.coral, size: 44, y: 200, sub: 'Find the antennae. Tickle them out. Swing the net.' });
    if (this.coach) Store.set('coach_bug2_' + this.ch, true);
  }
  exit() { SFX.setAmbient(0); Music.muffle(false); }
  baseFloor(x) { return this.site.floor + 10 * Math.sin(x * 0.004) + 6 * Math.sin(x * 0.013 + 1) + (this.variant === 'reef' ? 22 * Math.sin(x * 0.0017 + 2) : 0); }
  groundAt(x) { for (const L of this.ledges) if (x >= L.x0 - 4 && x <= L.x1 + 4) return L.top; return this.baseFloor(x); }
  solid(x, y) { return y > this.groundAt(x) - 12; }
  elapsed() { return this.len - this.timeLeft; }
  maxCamY() { return Math.max(0, this.site.floor + 46 - Game.H); }
  gen() {
    const S = this.site, WW = this.WW;
    this.ledges = []; let x = 620;
    while (x < WW - 240) { const w = rand(150, 270), h = rand(S.ledgeH[0], S.ledgeH[1]); this.ledges.push({ x0: x, x1: x + w, h, seed: randi(1, 99999) }); x += w + rand(S.gap[0], S.gap[1]); }
    for (const L of this.ledges) {
      L.top = this.baseFloor((L.x0 + L.x1) / 2) - L.h;
      const rng = mulberry(L.seed); L.pts = [];
      L.pts.push([L.x0 - 2, this.baseFloor(L.x0) + 4], [L.x0 - 7, L.top + L.h * 0.55], [L.x0 + 4, L.top + 6]);
      for (let px = L.x0 + 20; px < L.x1 - 14; px += 18) L.pts.push([px, L.top - rng() * 9]);
      L.pts.push([L.x1 - 4, L.top + 6], [L.x1 + 7, L.top + L.h * 0.55], [L.x1 + 2, this.baseFloor(L.x1) + 4]);
      L.deco = [];
      const kinds = this.variant === 'reef' ? ['fan', 'elk', 'elk', 'brain', 'sponge', 'rod', 'barrel'] : ['fan', 'brain', 'sponge', 'rod', 'rod', 'fan', 'urchin', 'barrel'];
      for (let px = L.x0 + 14; px < L.x1 - 10; px += rand(22, 40)) L.deco.push({ x: px, kind: pick(kinds), s: rand(0.7, 1.25), c: pick(['#8a4fb8', '#b85fa8', '#e07a3a', '#d9a441', '#7d5bd0']) });
      L.spots = []; for (let i = 0; i < 10; i++) L.spots.push([L.x0 + rng() * (L.x1 - L.x0), L.top + 10 + rng() * (L.h - 16), 2 + rng() * 6, rng()]);
    }
    // holes: at the foot of every ledge, up the walls of the tall ones. Most are empty.
    this.dens = [];
    for (const L of this.ledges) {
      for (const side of [-1, 1]) { const ex = side < 0 ? L.x0 : L.x1; if (chance(0.9)) this.dens.push(this.makeDen(ex, this.baseFloor(ex) - rand(15, 24), side)); }
      const walls = L.h > 150 ? 2 : L.h > 88 ? 1 : 0;
      for (let i = 0; i < walls; i++) if (chance(0.7)) { const right = chance(0.5); this.dens.push(this.makeDen(right ? L.x1 : L.x0, L.top + rand(26, L.h - 48), right ? 1 : -1)); }
    }
    const order = this.dens.slice().sort(() => Math.random() - 0.5);
    order.forEach((d, i) => {
      if (i < S.morays) d.kind = 'moray';
      else if (i < S.morays + S.bugs) { d.kind = 'lobster'; d.extra = chance(S.extra) ? 1 : 0; d.lob = this.makeLob(); }
      else d.kind = 'empty';
    });
    this.grass = []; for (let i = 0; i < WW / 34; i++) this.grass.push({ x: rand(0, WW), h: rand(10, 26), ph: rand(0, TAU) });
    this.jellies = []; for (let i = 0; i < Math.round(WW / 700); i++) this.jellies.push({ x: rand(700, WW - 100), y: rand(170, this.site.floor - 150), ph: rand(0, TAU), hit: 0 });
    this.schools = [];
    for (let i = 0; i < Math.round(WW / 650); i++) {
      const L = pick(this.ledges), fish = [], kind = pick(['tang', 'sgt', 'grunt', 'yt']);
      for (let k = 0; k < randi(6, 11); k++) fish.push({ ox: rand(-56, 56), oy: rand(-28, 28), ph: rand(0, TAU) });
      this.schools.push({ x: (L.x0 + L.x1) / 2, y: L.top - 40, cx: (L.x0 + L.x1) / 2, cy: L.top - (kind === 'yt' ? 110 : 40), ph: rand(0, TAU), fish, kind });
    }
    this.cuda = { x: rand(900, 2000), y: 230, dir: 1 };
    this.turtle = { x: rand(1000, 2200), y: rand(190, 280), dir: chance(0.5) ? 1 : -1, t: rand(0, 5) };
    this.ray = { x: -300, y: rand(150, 230), t: 0, wait: rand(6, 14), on: false };
    this.critters = [];
    for (let i = 0; i < Math.round(WW / 520); i++) { const L = pick(this.ledges), key = pick(['parrot', 'parrot', 'angel', 'hogfish']); this.critters.push({ key, cx: (L.x0 + L.x1) / 2, x: (L.x0 + L.x1) / 2 + rand(-60, 60), y: L.top - rand(18, 60), vx: rand(16, 30) * (chance(0.5) ? 1 : -1), range: (L.x1 - L.x0) / 2 + 40, t: rand(0, 5), nib: 0, len: key === 'parrot' ? rand(34, 46) : key === 'hogfish' ? rand(40, 52) : rand(26, 32) }); }
    this.crabs = []; for (let i = 0; i < 7; i++) { const cx = rand(200, WW - 200); this.crabs.push({ x: cx, dir: chance(0.5) ? 1 : -1, t: rand(0, 5), pause: rand(0, 2), flee: 0 }); }
    this.sandDeco = []; for (let i = 0; i < WW / 120; i++) this.sandDeco.push({ x: rand(100, WW - 100), kind: i % 3 ? 'star' : 'urchin', r: rand(5, 9), c: pick(['#e8742c', '#d9532f', '#f0a23a', '#c8467a']) });
    const gapL = this.ledges.find((L, i) => i > 0 && i < this.ledges.length - 1) || this.ledges[0];
    this.nurse = { x: gapL.x1 + 82, y: this.baseFloor(gapL.x1 + 82) - 8, dir: -1, t: 0, zT: 1, move: 0 };
    const oL = this.ledges[Math.min(this.ledges.length - 1, 3)];
    this.octo = { x: (oL.x0 + oL.x1) / 2 + rand(-30, 30), y: oL.top - 8, state: 'hide', t: 0, vx: 0, vy: 0, a: 1 };
    // a goliath grouper parked under the biggest ledge at the deep reef
    if (this.variant === 'reef') { const G = this.ledges.reduce((a, L) => (L.h > a.h ? L : a), this.ledges[0]); this.goliath = { x: G.x1 + 70, y: this.baseFloor(G.x1 + 70) - 34, t: 0 }; }
    this.snow = []; for (let i = 0; i < 80; i++) this.snow.push({ x: rand(0, 1400), y: rand(0, 640), r: rand(0.6, 1.8), vy: rand(3, 9), ph: rand(0, TAU) });
    this.fg = []; for (let x = 0; x < WW * 1.4; x += rand(240, 420)) this.fg.push({ x, kind: pick(['fan', 'rock', 'grass', 'grass']), s: rand(0.8, 1.4) });
    this.farFish = []; for (let i = 0; i < 6; i++) this.farFish.push({ x: rand(0, 1400), y: rand(170, 380), sp: rand(8, 18) * (chance(0.5) ? 1 : -1), n: randi(5, 9) });
  }
  makeDen(x, y, dir) { return { x, y, dir, kind: 'empty', coax: 0, spooks: 0, twitch: 0, nextTwitch: rand(0.9, 1.8), badHold: 0, state: 'in', peek: 0, peekT: rand(2, 5), lob: null, extra: 0, probe: 0 }; }
  makeLob() { const cl = rollCL(this.perks, this.site); return { cl, w: lobsterWeight(cl), eggs: cl > 3.0 && chance(0.14), gold: cl > 3.0 && chance(0.04 * this.perks.trophy * this.site.gold) }; }
  say(kind, p = 1) {
    if (!chance(p) || !QUIPS[kind]) return;
    this.quip = { who: pick(this.others), msg: pick(QUIPS[kind]), t: 2.8 };
  }

  /* ---------- input ---------- */
  actionZone() { return { x: Game.W - 96, y: Game.H - 96, r: 66 }; }
  inAction(x, y) { const a = this.actionZone(); return dist(x, y, a.x, a.y) < a.r + 8; }
  toWorld(p) { return [p.x + this.cam, p.y + this.camY]; }
  denAt(wx, wy) { let best = null, bd = 44; for (const den of this.dens) { if (den.state === 'gone') continue; const dd = dist(wx, wy, den.x + den.dir * 6, den.y); if (dd < bd) { bd = dd; best = den; } } return best; }
  pointerDown(p) {
    if (this.basePointerDown(p) || this.gauge || this.blackout > 0 || this.intro) return;
    if (this.inAction(p.x, p.y)) { this.actionPtr = p.id; this.actionPress = true; return; }
    const [wx, wy] = this.toWorld(p);
    if (!this.out) { const den = this.denAt(wx, wy); if (den) { this.tickPtr = { id: p.id, den }; return; } }
    this.press = { id: p.id, sx: p.x, sy: p.y, t0: this.t };
  }
  pointerMove(p) {
    if (this.press && this.press.id === p.id && dist(p.x, p.y, this.press.sx, this.press.sy) > 14) { this.joy = { id: p.id, sx: this.press.sx, sy: this.press.sy, x: p.x, y: p.y }; this.press = null; }
    if (this.joy && this.joy.id === p.id) { this.joy.x = p.x; this.joy.y = p.y; }
  }
  pointerUp(p) {
    if (this.press && this.press.id === p.id) { const [wx, wy] = this.toWorld(p); this.press = null; this.swingAt(wx, wy); }
    if (this.joy && this.joy.id === p.id) this.joy = null;
    if (this.actionPtr === p.id) this.actionPtr = null;
    if (this.tickPtr && this.tickPtr.id === p.id) { this.tickPtr = null; this.seek = null; }
  }
  keyDown(c) {
    if (this.baseKeyDown(c) || this.gauge || this.intro) return;
    if (c === 'Space' || c === 'KeyE' || c === 'KeyF') this.actionPress = true;
  }
  actionHeld() { return this.actionPtr != null || Input.held('Space', 'KeyE'); }

  /* ---------- the net ---------- */
  shoulder() { const d = this.diver; return { x: d.x + d.facing * 10, y: d.y + 2 }; }
  carryPos() { const d = this.diver; return { x: d.x + d.facing * 36, y: d.y + 22 }; }
  bugBody(o) { return { x: o.x, y: o.y - 3 }; }
  swingAt(wx, wy) {
    const n = this.net, d = this.diver;
    if (n.state === 'swing' || n.cool > 0 || this.gauge || this.intro || this.blackout > 0 || d.y < BH.SURF + 10) return;
    const sh = this.shoulder(); let dx = wx - sh.x, dy = wy - sh.y; const L = Math.hypot(dx, dy) || 1;
    if (L > NET.REACH) {
      if (this.out && dist(wx, wy, this.out.x, this.out.y) < 100) { this.seek = { kind: 'net', t: 1.6 }; return; }   // too far: swim at it, swing when in reach
      dx *= NET.REACH / L; dy *= NET.REACH / L;
    }
    const tx = sh.x + dx, ty = Math.min(sh.y + dy, this.groundAt(sh.x + dx) - 6);
    if (Math.abs(dx) > 8) d.facing = dx > 0 ? 1 : -1;
    const from = n.state === 'carry' ? this.carryPos() : { x: n.x, y: n.y };
    this.net = { state: 'swing', t: 0, fx: from.x, fy: from.y, tx, ty, x: from.x, y: from.y, cool: NET.COOL };
    this.swings++; this.seek = null;
    SFX.play('swish');
    for (let i = 0; i < 4; i++) this.parts.add({ kind: 'bubble', x: from.x + rand(-6, 6), y: from.y, vy: -rand(30, 60), vx: rand(-10, 10), life: 1.2, size: rand(1.5, 3) });
  }
  autoSwing() {
    const o = this.out; if (!o) return;
    const b = this.bugBody(o), lead = o.state === 'walk' ? Math.sign(o.tx - o.x) * 16 : 0;
    this.swingAt(b.x + lead, b.y);
  }
  inHoop(o, tight) { const b = this.bugBody(o); return dist(this.net.x, this.net.y, b.x, b.y) < (tight ? NET.HOOP * 0.85 : NET.HOOP + 12); }
  updateNet(dt) {
    const n = this.net; n.cool = Math.max(0, n.cool - dt);
    if (n.state === 'carry') { const p = this.carryPos(); n.x = p.x; n.y = p.y; return; }
    n.t += dt;
    if (n.state === 'swing') {
      const k = easeOut(n.t / NET.SWING); n.x = lerp(n.fx, n.tx, k); n.y = lerp(n.fy, n.ty, k) - Math.sin(k * Math.PI) * 16;
      if (n.t >= NET.SWING) { n.state = 'set'; n.t = 0; n.x = n.tx; n.y = n.ty; this.netImpact(); }
    } else if (n.state === 'set') {
      const o = this.out;
      if (o && o.state === 'flip' && this.inHoop(o)) { this.catchIt(true); return; }
      if (n.t > NET.SET || dist(n.x, n.y, this.diver.x, this.diver.y) > NET.REACH + 60) n.state = 'carry';
    }
  }
  netImpact() {
    const n = this.net, o = this.out;
    if (n.y > this.groundAt(n.x) - 30) this.parts.burst(n.x, n.y + 8, 10, { color: 'rgba(225,205,150,0.7)', min: 20, max: 70, life: 0.9, angle: -Math.PI / 2, spread: 1.2 });
    SFX.play('net');
    if (!o) return;
    if (this.inHoop(o, o.state === 'flip')) { this.catchIt(o.state === 'flip'); return; }
    if (dist(n.x, n.y, o.x, o.y) < 140) this.missed(o);
  }
  missed(o) {
    o.misses++;
    if (o.misses >= 3) { this.sendHome(o, 'It’s running for the rocks!'); return; }
    const behind = (this.net.x - o.x) * o.dir < 0;
    if (behind && o.state !== 'flip') { o.state = 'walk'; o.tx = this.clampWalk(o, o.x + o.dir * rand(60, 90)); o.speed = 2.2; }
    else if (o.state !== 'flip') { o.state = 'crouch'; o.ct = 0.12; }
    Game.toast(behind ? 'Missed! It scooted away' : 'Missed! It tail-flipped', { color: PAL.warn, size: 28, y: 190, sub: o.misses === 1 ? 'Lobsters flip backward. Set the net BEHIND the tail.' : 'One more miss and it’s gone' });
    this.say('miss', 0.5); this.coachSaw.behind = true;
  }
  catchIt(pro) {
    const o = this.out; if (!o) return;
    SFX.play('net'); SFX.play('coin'); Game.vibrate(40);
    this.parts.burst(o.x, o.y, 18, { kind: 'bubble', min: 30, max: 120, life: 1.1 });
    if (pro) { this.addLine('Backed it into the net', 50); this.fl.add(o.x - this.cam, o.y - this.camY - 40, 'PRO MOVE +50', PAL.sun, 24); this.say('pro'); }
    else if (!o.misses) { this.addLine('One swing, one bug', 25); this.fl.add(o.x - this.cam, o.y - this.camY - 40, 'CLEAN SWING +25', PAL.sun, 22); }
    this.gauge = { lob: o.lob, t: 0 }; Game.toasts = [];
    this.out = null; this.net.state = 'carry'; this.coach = false;
  }

  /* ---------- update ---------- */
  update(dt) {
    if (this.gauge) { if (!this.paused && !this.child) { this.gauge.t += dt; this.t += dt; } Game.toasts = []; return; }
    if (this.baseUpdate(dt)) return;
    const d = this.diver, t = this.t;
    if (this.quip) { this.quip.t -= dt; if (this.quip.t <= 0) this.quip = null; }
    this.updateScenery(dt, d, t);
    if (this.intro) { this.updateIntro(dt); this.updateCam(dt); return; }
    if (this.blackout > 0) {
      this.blackout -= dt; d.y = approach(d.y, BH.SURF + 4, 1.5, dt);
      if (this.blackout <= 0) { d.y = BH.SURF + 4; this.breath = this.maxBreath * 0.5; this.timeLeft = Math.max(0, this.timeLeft - 6); Game.toast('Your buddy pulled you up', { color: '#fff', size: 30, y: 160, sub: 'Never push a breath-hold. Always dive with a buddy. (−6 sec)' }); this.say('blackout'); }
      this.updateCam(dt); return;
    }
    if (this.press && this.t - this.press.t0 > 0.24) { this.joy = { id: this.press.id, sx: this.press.sx, sy: this.press.sy, x: this.press.sx, y: this.press.sy }; this.press = null; }
    // movement input
    let ix = 0, iy = 0;
    if (Input.held('ArrowLeft', 'KeyA')) ix -= 1; if (Input.held('ArrowRight', 'KeyD')) ix += 1;
    if (Input.held('ArrowUp', 'KeyW')) iy -= 1; if (Input.held('ArrowDown', 'KeyS')) iy += 1;
    if (this.joy) { const jx = (this.joy.x - this.joy.sx) / 55, jy = (this.joy.y - this.joy.sy) / 55; const m = Math.hypot(jx, jy); if (m > 0.12) { ix = jx / Math.max(1, m); iy = jy / Math.max(1, m); } }
    const manual = Math.hypot(ix, iy) > 0.1;
    if (manual && this.seek && this.seek.kind === 'net') this.seek = null;
    // auto-swim: toward a hole you're holding, or toward the bug you clicked
    let seekTo = null;
    if (!manual && this.tickPtr && this.tickPtr.den.state !== 'gone') { const den = this.tickPtr.den; seekTo = [den.x + den.dir * 58, den.y - 2]; }
    if (!manual && this.seek && this.seek.kind === 'net' && this.out) {
      this.seek.t -= dt; const b = this.bugBody(this.out), sh = this.shoulder();
      if (dist(sh.x, sh.y, b.x, b.y) < NET.REACH * 0.9) this.autoSwing(); else if (this.seek.t > 0) seekTo = [b.x - Math.sign(b.x - d.x) * 90, b.y - 10]; else this.seek = null;
    } else if (this.seek && !this.out) this.seek = null;
    if (seekTo) { const dx = seekTo[0] - d.x, dy = seekTo[1] - d.y, m = Math.hypot(dx, dy); if (m > 8) { ix = dx / m * Math.min(1, m / 60); iy = dy / m * Math.min(1, m / 60); } }
    const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }
    const stunned = d.stun > 0; if (stunned) { d.stun -= dt; ix = 0; iy = 0; }
    const under = d.y > BH.SURF + 14;
    const sp = this.shark && this.shark.state === 'hunt' ? 176 : 168;
    d.vx = approach(d.vx, ix * sp, 4, dt);
    d.vy = approach(d.vy, iy * sp + (iy === 0 ? -16 : 0), 4, dt);
    if (Math.abs(ix) > 0.1 && !(this.net.state === 'swing')) d.facing = ix > 0 ? 1 : -1;
    const drift = under ? -this.weather.drift * 16 : 0;
    let nx = d.x + (d.vx + drift) * dt, ny = d.y + d.vy * dt;
    nx = clamp(nx, 30, this.WW - 30);
    if (this.solid(nx + d.facing * 28, d.y) || this.solid(nx, d.y)) { nx = d.x; d.vx = 0; }
    ny = clamp(ny, BH.SURF + 2, this.site.floor + 80);
    if (this.solid(nx, ny)) { ny = this.groundAt(nx) - 12; d.vy = Math.min(0, d.vy); }
    d.x = nx; d.y = ny;
    this.updateCam(dt);
    // breathing, bubbles and splashes
    if (under && !this.wasUnder) { this.parts.burst(d.x, BH.SURF + 4, 14, { color: ['#ffffff', '#cfefff'], angle: -Math.PI / 2, spread: 0.9, min: 60, max: 160, g: 400, life: 0.7 }); SFX.play('plop'); Music.muffle(true); SFX.setAmbient(1, true); }
    if (!under && this.wasUnder) { this.parts.burst(d.x + d.facing * 16, BH.SURF - 18, 10, { color: ['#ffffff', '#dff6ff'], angle: -Math.PI / 2, spread: 0.4, min: 80, max: 190, g: 500, life: 0.6 }); SFX.noise(0.25, { filter: 'bandpass', f: 1800, vol: 0.12 }); Music.muffle(false); SFX.setAmbient(1, false); }
    this.wasUnder = under;
    if (under) {
      this.breath -= dt * (d.y > 560 ? 1.15 : 1); this.exhaleT -= dt;
      if (this.exhaleT <= 0) { this.exhaleT = rand(2, 2.8); for (let i = 0; i < 5; i++) this.parts.add({ kind: 'bubble', x: d.x + d.facing * 30 + rand(-3, 3), y: d.y - 10, vy: -rand(40, 80), vx: rand(-10, 10), life: 2, size: rand(1.8, 4) }); if (chance(0.5)) SFX.play('bubble'); }
      if (Math.hypot(d.vx, d.vy) > 120 && chance(dt * 8)) this.parts.add({ kind: 'bubble', x: d.x - d.facing * 70, y: d.y + rand(-4, 4), vy: -30, vx: -d.facing * 20, life: 1, size: rand(1, 2.2) });
    } else this.breath = Math.min(this.maxBreath, this.breath + dt * 9);
    if (this.breath < this.maxBreath * 0.28 && under) { this.beatT -= dt; if (this.beatT <= 0) { this.beatT = 0.75; SFX.tone(60, 0.12, { vol: 0.25 }); } }
    if (this.breath <= 0) { this.blackout = 2.2; this.breath = 0; if (this.out) this.sendHome(this.out, null, true); SFX.play('fail'); return; }
    for (const j of this.jellies) if (!j.hit && dist(j.x, j.y, d.x + d.facing * 10, d.y) < 26) { j.hit = 2; d.stun = 0.7; this.breath -= 3; Game.toast('Jellyfish sting!', { color: '#ff9fd6', size: 30, y: 130 }); SFX.play('sting'); Game.shake(4); this.say('jelly', 0.6); }
    // the shark
    if (!this.shark && !this.sharkDone && this.sharkAt != null && this.elapsed() >= this.sharkAt && d.y > BH.SURF + 80 && Math.abs(d.x - BH.BOATX) > 420 && !this.out) this.startShark();
    if (this.shark) this.updateShark(dt);
    const chased = this.shark && this.shark.state === 'hunt';
    // which hole are we working?
    for (const den of this.dens) if (den.kind === 'moray') { den.peekT -= dt; if (den.peekT <= 0) { den.peek = 1.4; den.peekT = rand(3, 6); } den.peek = Math.max(0, den.peek - dt); }
    let target = null;
    if (!chased && !this.out) {
      if (this.tickPtr && this.tickPtr.den.state !== 'gone') target = this.tickPtr.den;
      else { let best = 100; for (const den of this.dens) { if (den.state === 'gone') continue; if ((d.x - den.x) * den.dir < 4) continue; const dd = dist(d.x, d.y, den.x + den.dir * 52, den.y); if (dd < best) { best = dd; target = den; } } }
    }
    this.target = target;
    const reach = target && (d.x - target.x) * target.dir > 4 && dist(d.x, d.y, target.x + target.dir * 52, target.y) < 46;
    this.inReach = !!reach;
    const held = (this.actionHeld() || !!this.tickPtr) && !stunned && !!reach;
    if (held) d.facing = -target.dir;
    this.tickling = false;
    if (held && target.kind === 'moray') {
      target.peek = 1.5; d.stun = 0.9; this.breath -= 4; Game.toast('MORAY! Wrong hole.', { color: PAL.bad, size: 34, y: 130 }); SFX.play('chomp'); Game.shake(7); Game.vibrate(120); this.say('moray');
      this.parts.burst(target.x, target.y, 10, { color: 'rgba(255,255,255,0.7)', kind: 'bubble', min: 20, max: 60, life: 1 });
      this.tickPtr = null; this.seek = null;
    } else if (held && target.kind === 'empty') {
      this.tickling = true; if (chance(dt * 18)) SFX.play('tickle');
      target.probe += dt;
      if (target.probe > 0.8 && !target.probed) { target.probed = true; this.fl.add(target.x - this.cam, target.y - this.camY - 30, 'Nobody home', '#cfe3ea', 18); this.say('empty', 0.3); }
    } else if (held && target.kind === 'lobster') {
      this.tickling = true;
      if (chance(dt * 18)) SFX.play('tickle');
      if (target.twitch > 0) { target.badHold += dt; if (target.badHold > 0.22) this.spook(target); }
      else target.coax += dt * 0.5 * this.perks.coax;
      target.nextTwitch -= dt;
      if (target.nextTwitch <= 0 && target.twitch <= 0) { target.twitch = 0.6; target.badHold = 0; target.nextTwitch = rand(0.8, 1.9); SFX.tone(300, 0.06, { type: 'square', vol: 0.05 }); }
      if (target.coax >= 1) this.emerge(target);
    }
    for (const den of this.dens) if (den.twitch > 0) den.twitch -= dt;
    if (this.out) this.updateOut(dt, d);
    this.updateNet(dt);
    if (this.actionPress) {
      this.actionPress = false;
      if (this.out) this.autoSwing();
      else if (!target) this.parts.burst(d.x + d.facing * 46, d.y + 2, 4, { kind: 'bubble', min: 10, max: 40, life: 0.8 });
    }
  }
  updateIntro(dt) {
    const I = this.intro, d = this.diver; I.t += dt;
    // a back-roll off the gunwale
    if (I.t < 0.5) { d.x = BH.BOATX + 70; d.y = BH.SURF - 26; }
    else if (I.t < 1.15) { const k = (I.t - 0.5) / 0.65; d.x = BH.BOATX + 70 + k * 30; d.y = BH.SURF - 26 + k * k * 96; }
    else { d.vx = 40; d.vy = 30; this.intro = null; this.wasUnder = false; return; }
    if (I.t >= 0.86 && !I.splash) { I.splash = true; this.parts.burst(d.x, BH.SURF, 22, { color: ['#ffffff', '#cfefff'], angle: -Math.PI / 2, spread: 1.1, min: 80, max: 220, g: 500, life: 0.8 }); SFX.play('splash'); }
  }
  updateCam(dt) {
    const d = this.diver;
    this.cam = approach(this.cam, clamp(d.x - Game.W * 0.45, 0, this.WW - Game.W), 6, dt);
    this.camY = approach(this.camY, clamp(d.y - Game.H * 0.5, 0, this.maxCamY()), 5, dt);
  }
  updateScenery(dt, d, t) {
    for (const j of this.jellies) { j.ph += dt; j.x += Math.sin(j.ph * 0.3) * 10 * dt - this.weather.drift * 6 * dt; j.y += Math.sin(j.ph * 0.9) * 8 * dt; j.hit = Math.max(0, j.hit - dt); }

   lying over on its side in 110 feet, with a debris field off the bow.
   The boat anchors over a long strip of bottom. Fish are few and hold on structure, and it's dark down
   there: you see them on the fish finder, and in the glow of the deep-drop light on your line.
   Read the marks, move the boat onto them, drop the bait to their depth, sit through the nibbles and
   set the hook on the real bite. */

  bow: [[1400, 79.6], [1640, 80.8], [1880, 82.4], [1885, 85], [1877, 88.5], [1889, 92], [1880, 96.5], [1888, 101], [1882, 113], [1468, 113], [1453, 105], [1435, 96], [1416, 87]],

/* ---------- small helpers (kept local to this file) ---------- */
function btSmooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
// colors fade toward deep blue the further down they sit
function btTint(hex, ft, to = '#0d3a52') { return mix(hex, to, clamp(0.16 + ft / 250, 0, 0.62)); }
function btShade(hex, k) { return '#' + hexRgb(hex).map((v) => Math.round(v * (1 - k)).toString(16).padStart(2, '0')).join(''); }
// the highest (smallest feet) point of a polygon's outline at x
function btPolyTop(poly, x) {
  let best = Infinity;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length], lo = Math.min(p[0], q[0]), hi = Math.max(p[0], q[0]);
    if (x < lo || x > hi || hi === lo) continue;
    const ft = lerp(p[1], q[1], (x - p[0]) / (q[0] - p[0])); if (ft < best) best = ft;
  }
  return best;
}
function btFan(ctx, x, y, s, col, t) {  // sea fan
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 0.8 + x * 0.013) * 0.06);
  ctx.save(); ctx.globalAlpha *= 0.42; ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-s * 0.06, 0); ctx.bezierCurveTo(-s * 0.9, -s * 0.5, -s * 0.62, -s * 1.15, 0, -s * 1.12); ctx.bezierCurveTo(s * 0.62, -s * 1.15, s * 0.9, -s * 0.5, s * 0.06, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  for (let i = -3; i <= 3; i++) { ctx.lineWidth = Math.max(0.8, s * (i === 0 ? 0.07 : 0.035)); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(i * s * 0.1, -s * 0.5, i * s * 0.2, -s * (1.08 - Math.abs(i) * 0.07)); ctx.stroke(); }
  ctx.lineWidth = Math.max(0.6, s * 0.025); for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.ellipse(0, 0, s * 0.2 * k, s * 0.36 * k, 0, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  ctx.restore();
}
function btWhip(ctx, x, y, s, col, t) {  // sea whips and sea rods
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const a = (i - 1.5) * 0.24, sw = Math.sin(t * 1.1 + i + x * 0.02) * s * 0.12;
    ctx.lineWidth = Math.max(1, s * 0.05); ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.sin(a) * s * 0.5 + sw * 0.5, y - s * 0.55, x + Math.sin(a) * s * 0.8 + sw, y - s * (0.95 + (i % 2) * 0.22)); ctx.stroke();
  }
  ctx.restore();
}
function btBarrel(ctx, x, y, s, col) {  // barrel sponge
  ctx.save(); ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x - s * 0.34, y); ctx.quadraticCurveTo(x - s * 0.64, y - s * 0.6, x - s * 0.5, y - s); ctx.lineTo(x + s * 0.5, y - s); ctx.quadraticCurveTo(x + s * 0.64, y - s * 0.6, x + s * 0.34, y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x - s * 0.5 + i * s * 0.25, y - s * 0.96); ctx.lineTo(x - s * 0.34 + i * s * 0.17, y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(5,12,14,0.6)'; ell(ctx, x, y - s, s * 0.5, s * 0.12); ctx.fill();
  ctx.restore();
}
function btTubes(ctx, x, y, s, col) {  // tube and vase sponges
  ctx.save();
  for (let i = 0; i < 3; i++) {
    const ox = (i - 1) * s * 0.32, hh = s * (0.7 + ((i * 37 + Math.round(x)) % 5) * 0.12), lw = s * 0.22, lean = (i - 1) * 0.14;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x + ox - lw / 2, y); ctx.lineTo(x + ox - lw * 0.6 + lean * hh, y - hh); ctx.lineTo(x + ox + lw * 0.6 + lean * hh, y - hh); ctx.lineTo(x + ox + lw / 2, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(5,12,14,0.5)'; ell(ctx, x + ox + lean * hh, y - hh, lw * 0.6, lw * 0.22); ctx.fill();
  }
  ctx.restore();
}
function btEncrust(ctx, x, y, s, col) { ctx.fillStyle = col; for (let i = 0; i < 4; i++) { ell(ctx, x + (i - 1.5) * s * 0.35, y - s * 0.1 * (1 + (i % 2)), s * 0.26, s * 0.16 * (1 + (i % 2) * 0.5)); ctx.fill(); } }
function btDome(ctx, b, x, y, ry) {  // brain coral, star coral or a lump of rubble
  const rx = b.r;
  ctx.save();
  const g = ctx.createLinearGradient(0, y - ry, 0, y); g.addColorStop(0, b.c1); g.addColorStop(1, b.c2);
  ctx.fillStyle = g; ctx.beginPath();
  if (b.k === 'rock') { ctx.moveTo(x - rx, y + 3); ctx.quadraticCurveTo(x - rx * 0.9, y - ry * 0.9, x - rx * 0.2, y - ry); ctx.quadraticCurveTo(x + rx * 0.7, y - ry * 1.05, x + rx, y + 3); }
  else ctx.ellipse(x, y + 3, rx, ry + 3, 0, Math.PI, 0);
  ctx.closePath(); ctx.fill();
  if (b.k === 'brain') {
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.1;
    for (let i = 1; i <= 3; i++) { ctx.beginPath(); for (let a = Math.PI; a <= TAU + 0.001; a += 0.16) { const k = i / 4 + Math.sin(a * 9 + i * 2) * 0.035, px = x + Math.cos(a) * rx * k, py = y + 3 + Math.sin(a) * (ry + 3) * k; a === Math.PI ? ctx.moveTo(px, py) : ctx.lineTo(px, py); } ctx.stroke(); }
  } else if (b.k === 'star') {
    ctx.fillStyle = 'rgba(255,255,230,0.16)'; const n = Math.round(rx / 3.2);
    for (let i = 0; i < n; i++) { const a = Math.PI + (i + 0.5) / n * Math.PI, k = 0.35 + ((i * 7) % 5) * 0.12; ell(ctx, x + Math.cos(a) * rx * k, y + Math.sin(a) * ry * k, 1.6, 1.3); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ell(ctx, x - rx * 0.25, y - ry * 0.6, rx * 0.4, Math.max(1, ry * 0.18)); ctx.fill();
  ctx.restore();
}

class BottomScene extends SessionBase {
  constructor(o) {
    super(o);
    const spot = SPOTS[this.spot] || SPOTS.bottom;
    this.variant = spot.variant === 'wreck' ? 'wreck' : 'ledge';
    this.L = BOT_LAYOUT[this.variant];
    this.ppf = (BOT.FLOOR - BOT.SURF) / this.L.base;   // the logical canvas is always 540 tall
    const list = (spot.species || []).filter((k) => BOT_SP[k] && SPECIES[k]);
    this.species = list.length ? list : Object.keys(BOT_SP).filter((k) => SPECIES[k]);
    this.baitType = this.variant === 'wreck' ? 'pinfish' : 'squid';
    this.baitOn = true; this.baitDepth = 0; this.targetDepth = this.variant === 'wreck' ? 78 : 62; this.rebaitT = 0; this.reeling = false; this.settled = false;
    this.fish = []; this.chumT = 0; this.chumCd = 0; this.slickQ = []; this.slickT = 0; this.chum = new Particles(); this.wake = new Particles();
    this.drag = null; this.twitch = 0; this.slam = 0; this.move = null; this.moveV = 0; this.engOn = false; this.swingK = 1;
    this.alarmT = 0; this.beepT = 0; this.quietT = 0; this.sonar = []; this.pingT = 0; this.sonarRect = null;
    this.track = new Array(Math.ceil(BOT.STRIP / 25) + 2).fill(null); this.wps = []; this.hookX = 0;
    this.others = (Trip.cur && Trip.cur.crew ? Trip.cur.crew : CHAR_ORDER).filter((c) => c !== this.ch).slice(0, 2);
    this.buildBottom();
    // the structure along the strip: only species this spot holds, a few fish on each
    this.hot = [];
    for (const h of this.L.spots) {
      const table = Object.entries(h.sp).filter(([k]) => this.species.includes(k));
      if (table.length) this.hot.push({ name: h.name, x: h.x, r: h.r, re: h.re, cap: clamp(h.cap + randi(-1, 1), 1, 4), table, timer: rand(h.re[0], h.re[1]) * 0.6 });
    }
    // anything the spot lists that no structure holds wanders through now and then
    const held = new Set(); for (const h of this.hot) for (const [k] of h.table) held.add(k);
    this.roamTable = Object.entries(this.L.roam).filter(([k]) => this.species.includes(k));
    for (const k of this.species) if (!held.has(k) && !this.roamTable.some(([r]) => r === k)) this.roamTable.push([k, 0.5]);
    this.roamT = rand(14, 26);
    this.schools = this.L.schools.map((s) => Object.assign({}, s, { ph: rand(0, 10), pts: Array.from({ length: s.n }, () => [rand(-1, 1), rand(-1, 1), rand(0.5, 1.4), rand(0, TAU)]) }));
    // anchor up in quiet water, a move or two from some structure: finding the fish is up to you
    const gap = (x) => this.hot.reduce((a, h) => Math.min(a, Math.abs(x - h.x) - h.r), 1e9);
    const quiet = []; for (let x = BOT.XMIN; x <= BOT.XMAX; x += 10) { const g = gap(x); if (g >= 110 && g <= 280) quiet.push(x); }
    this.bx = quiet.length ? pick(quiet) : 1600;
    this.cam = this.bx - this.baitSX();
    this.initSnow();
    for (const h of this.hot) { const n = randi(h.cap > 1 ? 1 : 0, h.cap); for (let i = 0; i < n; i++) this.spawnFish(h, false); }
    // let the bottom live for a few seconds first, so the fish finder has history on screen
    for (let i = 0; i < BOT.COLS; i++) { this.stepFish(BOT.PING, false); this.ping(); }
  }
  enter() {
    SFX.setAmbient(0.8, false); Music.play('boat');
    Game.toast(SPOTS[this.spot] ? SPOTS[this.spot].name : 'The Ledge', { color: PAL.coral, size: 46, y: 200, sub: 'Read the fish finder. Move the boat to find the marks.' });
  }
  exit() { SFX.setAmbient(0); this.engine(0); }

  /* ---------- layout ---------- */
  colW() { return clamp(Math.round(Game.W * 0.3), 236, 336); }
  colX() { return Game.W - this.colW() - 12; }
  sceneW() { return this.colX() - 6; }
  baitSX() { return this.sceneW() * 0.54; }          // where the line hangs on screen
  yOf(ft) { return BOT.SURF + ft * this.ppf; }
  ftOf(y) { return (y - BOT.SURF) / this.ppf; }
  pxPerFt() { return this.ppf; }
  // the boat swings slowly on its anchor line, which sweeps the fish finder's cone back and forth
  swing() { return Math.sin(this.t * 0.42) * (14 + 16 * this.weather.drift) * this.swingK; }
  baitX() { return this.bx + this.swing() + Math.sin(this.t * 0.9) * 3 + this.weather.drift * 8; }
  maxDepth() { return this.bottomFt(this.baitX()) - 0.8; }
  ambient(ft) { return clamp((1.25 - ft / this.L.amb) * (this.weather.vis || 1), 0, 1); }

  /* ---------- the bottom ---------- */
  sandFt(x) { return this.L.base + Math.sin(x * 0.013) * 0.8 + Math.sin(x * 0.0041 + 2) * 0.7; }
  rockFt(x) {
    const sand = this.sandFt(x);
    if (this.variant === 'wreck') return sand;
    if (x < 1112) { const ter = 78.5 + Math.sin(x * 0.011) * 2.2 + Math.sin(x * 0.029 + 1) * 1.2; return lerp(ter, sand, btSmooth(1074, 1102, x)); }
    if (x > 1800 && x < 2100) { const u = (x - 1950) / 140; return sand - 9 * Math.pow(Math.max(0, 1 - u * u), 0.75); }
    if (x > 2675 && x < 3210) { const top = 88.6 + Math.sin(x * 0.02) * 1.1; return lerp(sand, top, btSmooth(2686, 2704, x) * (1 - btSmooth(3070, 3205, x))); }
    return sand;
  }
  bottomFt(x) {
    let ft = this.rockFt(x);
    if (this.wTop) { const i = Math.round((x - BOT_WK.x0) / 4); if (i >= 0 && i < this.wTop.length && this.wTop[i] < ft) ft = this.wTop[i]; }
    for (const b of this.bumps) {
      if (b.x - 60 > x) break;
      if (x < b.x - b.r || x > b.x + b.r) continue;
      const u = (x - b.x) / b.r, f = b.base - b.h * Math.sqrt(1 - u * u); if (f < ft) ft = f;
    }
    return ft;
  }
  hardAt(x) { return this.sandFt(x) - this.bottomFt(x) > 0.8 ? 1 : 0.4; }
  buildBottom() {
    const R = mulberry(hashStr('bottom:' + this.variant)), rn = (a, b) => a + (b - a) * R(), pk = (arr) => arr[Math.floor(R() * arr.length)];
    const bumps = []; this.decor = []; this.wTop = null;
    const bump = (x, r, h, k) => bumps.push({ x, r, h, k });
    if (this.variant === 'ledge') {
      for (const b of [[468, 30, 5, 'brain'], [548, 38, 6.5, 'star'], [618, 24, 4, 'brain'], [1888, 30, 4.5, 'star'], [1948, 44, 6.5, 'brain'], [2004, 30, 5, 'star'], [2046, 18, 2.4, 'rock'], [1856, 18, 2.2, 'rock'],
        [2760, 24, 3.5, 'brain'], [2905, 20, 3, 'star'], [3088, 16, 2.6, 'rock'], [3118, 22, 3.4, 'star'], [3150, 14, 2, 'rock']]) bump(...b);
      for (let x = -260; x < 1030; x += rn(70, 130)) if (Math.abs(x - 545) > 120 && R() < 0.75) bump(x, rn(14, 28), rn(1.5, 3.5), pk(['brain', 'star', 'rock']));
      for (let x = 2790; x < 3060; x += rn(60, 110)) if (R() < 0.6) bump(x, rn(12, 22), rn(1.2, 2.8), pk(['brain', 'star', 'rock']));
      for (let x = 1120; x < 3800; x += rn(110, 240)) if (this.rockFt(x) > this.sandFt(x) - 0.5 && R() < 0.55) bump(x, rn(7, 15), rn(0.5, 1.3), 'rock');
    } else {
      // the debris field off the bow: plates, a winch, an anchor, pipe; a funnel lying off the stern
      for (const b of [[780, 22, 2.2, 'anchor'], [1010, 18, 5, 'winch'], [1180, 30, 4, 'pipe'], [2452, 32, 6.5, 'funnel'], [2920, 26, 3.4, 'plate'], [2948, 14, 2, 'rock']]) bump(...b);
      for (let x = 620; x < 1270; x += rn(36, 80)) if (R() < 0.8) bump(x, rn(14, 30), rn(1.6, 4.4), R() < 0.7 ? 'plate' : 'rock');
      for (let x = -200; x < 3800; x += rn(140, 280)) if (R() < 0.45 && (x < 560 || x > 2520) && Math.abs(x - 2930) > 60) bump(x, rn(7, 14), rn(0.5, 1.2), 'rock');
      this.buildWreck();
    }
    bumps.sort((a, b) => a.x - b.x); this.bumps = [];
    for (const b of bumps) {
      b.base = this.rockFt(b.x); b.seed = R();
      const base = b.k === 'brain' ? pk(['#b39a5c', '#a88f5a', '#9c9a62']) : b.k === 'star' ? pk(['#8f8d4e', '#9a7a52', '#7f8f5a']) : b.k === 'rock' ? pk(['#6a6658', '#5e5c50']) : pk(['#6b5444', '#5c5048', '#4f4a44']);
      b.c1 = btTint(base, b.base - b.h); b.c2 = btTint(btShade(base, 0.35), b.base);

    }

    if (this.variant === 'ledge') for (let x = -300; x < 3250; x += rn(10, 22)) { if (this.sandFt(x) - this.rockFt(x) < 1.5) continue; this.blobs.push({ x, d: rn(6, 90), rx: rn(5, 15), ry: rn(3, 8), c: pk(['rgba(0,0,0,0.16)', 'rgba(0,0,0,0.1)', 'rgba(255,240,200,0.06)', 'rgba(120,80,120,0.12)']) }); }
    const C = {
      fan: ['#8d5aa8', '#a0507a', '#c27a3a', '#7c4fa0'], whip: ['#c9a24a', '#a8885a', '#8a5aa2', '#b46a3a'], barrel: ['#8a5a3c', '#7a4a3a', '#946446'],
      tubes: ['#b0549a', '#d07a3a', '#7a6ab0', '#c4a03a'], encrust: ['#d0603a', '#c8a03a', '#9a4a8a', '#5a9a7a', '#c84a4a']

      let type = null;
      if (hull) { const r = R(); type = r < 0.42 ? 'encrust' : r < 0.64 ? 'fan' : r < 0.84 ? 'whip' : 'tubes'; }
      else if (onRock) { const r = R(); type = r < 0.22 ? 'fan' : r < 0.46 ? 'whip' : r < 0.58 ? 'barrel' : r < 0.7 ? 'tubes' : r < 0.9 ? 'encrust' : null; }
      else if (R() < 0.22) type = pk(['whip', 'encrust', 'tubes', 'whip']);
      if (!type) continue;
      const s = type === 'fan' ? rn(12, 24) : type === 'whip' ? rn(12, 26) : type === 'barrel' ? rn(10, 18) : type === 'tubes' ? rn(9, 16) : rn(6, 11);

  buildWreck() {
    const W = BOT_WK, ppf = this.ppf, s = W.sup;
    // wheelhouse: a box rolled over on the stern deck
    const hp = s.h * ppf, ca = Math.cos(s.a), sa = Math.sin(s.a);
    const corner = (dx, dy) => [s.x + dx * ca - dy * sa, s.ft + (dx * sa + dy * ca) / ppf];
    this.supPoly = [corner(-s.w / 2, 8), corner(s.w / 2, 8), corner(s.w / 2, -hp), corner(-s.w / 2, -hp)];
    const n = Math.ceil((W.x1 - W.x0) / 4) + 1; this.wTop = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = W.x0 + i * 4;
      let ft = Math.min(btPolyTop(W.bow, x), btPolyTop(W.stern, x), btPolyTop(this.supPoly, x));
      if (x > 1884 && x < 1936) ft = Math.min(ft, 93.5 + 2.5 * Math.abs(Math.sin((x - 1884) * 0.25)));   // ribs at the break
      this.wTop[i] = ft;
    }
  }

  /* ---------- fish ---------- */
  rollKey(table) {
    let tot = 0; for (const [, w] of table) tot += w;
    let r = Math.random() * tot; for (const [k, w] of table) { if ((r -= w) <= 0) return k; }

  update(dt) {

      if (T.weed <= 0) { this.spawnFeature('weed'); T.weed = rand(18, 28); }
      if (T.buoy <= 0) { this.spawnFeature('buoy'); T.buoy = rand(5, 8); }
      if (T.raise <= 0) { this.raiseBill(); T.raise = rand(30, 46); }
      if (T.blind <= 0) { this.blindStrike(); T.blind = rand(30, 44); }

    } else {

      if (T.birds <= 0) { this.spawnFeature('birds'); T.birds = rand(34, 46); }

  updateFeatures(dt, v, bx) {

  fishVis(fi, bx) {

  updateFish(dt, v, bx) {
